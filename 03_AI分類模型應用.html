句有 95% 的機率真的符合人的標註。","question":"高信心卻判錯，可能反映什麼問題？","steps":["看預測標籤","查看機率條","思考可能誤判"],"minutes":3,"sub":""},{"l":1,"title":"分類模型會在哪些地方失誤？","kind":"errors","lead":"否定、反諷、模糊立場和領域差異，都可能讓分類發生錯誤。","points":["「還可以」不一定很正面；「好到不想來第二次」可能是反諷","不能只看最高機率，要檢視與真實標籤不一致的案例"],"example":"「這部片真是精彩，精彩到我睡著。」表面正面詞不保證整句正面。","question":"哪一句最可能造成只找關鍵字的分類器出錯？","steps":["選擇句子","揭示難點","討論改善方法"],"minutes":3,"sub":""}],"modeLabels":["信心分數","容易判錯的句子"],"steps":["看預測標籤","查看機率條","思考可能誤判"],"lead":"輸出 Score 通常是模型對某一類別給出的分數，不能視為事實確定度。","points":["模型可能自信地犯錯，尤其遇到反諷、超出訓練資料範圍的文字","要評估分數是否校準，須另外比較大量預測與真實答案"],"example":"模型對某句評論給「正面 95%」，不等於這句有 95% 的機率真的符合人的標註。","question":"高信心卻判錯，可能反映什麼問題？","minutes":3},{"l":1,"title":"Hugging Face：使用他人微調好的繁體中文模型","kind":"huggingface","lead":"Hugging Face 可搜尋已為特定分類任務微調的模型；本投影片是離線教學圖解，真正推論請使用課後提供的程式。","points":["範例：Johnson8187/Chinese-Emotion-Small；模型卡記載以約 4,000 筆繁體中文情緒語句微調","八類情緒：平淡、關切、開心、憤怒、悲傷、疑問、驚奇、厭惡；它不是原先的二元正負面商品評論模型"],"example":"想分類「開心、關切、厭惡」等不同情緒時，先檢查模型卡定義的八類標籤，再使用課後程式執行真正推論。","question":"已微調好的「八種情緒模型」，能直接當成新聞分類模型嗎？","steps":["檢查模型卡與任務","認識八種標籤","了解分類結果如何呈現"],"minutes":4,"sub":""},{"l":1,"title":"第 1 節：3 題快速檢核","kind":"quiz","lead":"文字處理、Encoder、分類頭、模型微調與信心分數，一起檢查。","points":["前面已示範「分類頭」把 BERT 的上下文表示映射為類別 Logit","檢核並不只背術語，還要能說出已預訓練與已微調的差別"],"example":"遇到實際文字時，要先分清 Tokenizer、BERT Encoder 與分類頭各自做什麼；教學圖的機率不是已載入模型的即時結果。","question":"在三題檢核中，哪一題最容易讓你混淆？","steps":["作答","看原因","準備下一節"],"minutes":3,"sub":"","quizset":0},{"l":2,"title":"讓模型學會你的分類任務","kind":"cover2","lead":"已預訓練的模型很有用，但不一定懂你的類別定義。","points":["收集並標註自己的中文文字資料","拆解微調、Batch、Step、Epoch，再用驗證指標挑選模型"],"example":"要辨識「校園午餐滿意／不滿意」，商品評論情緒模型可以直接照用嗎？","question":"想讓分類模型符合你的任務，第一步是修改參數，還是準備資料？","steps":["定義任務","準備資料","觀察微調與評估"],"minutes":2,"sub":"第 2 節｜資料標註、微調與驗證"},{"l":2,"title":"園遊會留言分類：先訂標籤與判斷準則","kind":"combo","sub":"生活情境 · 園遊會報名整理","modes":[{"l":2,"title":"先定義標籤，再蒐集資料","kind":"taskspec","lead":"想讓 AI 整理班群的園遊會報名訊息？先決定「想參加／不能參加／還不確定」三種標籤，再蒐集留言。","points":["「我一定到！」標為想參加；「當天有補習」標為不能參加；「到時再看看」標為還不確定","對「我應該可以去吧」這種模糊留言，先約定判斷規則，避免每個人標得不一樣"],"example":"班長想統計園遊會幫忙的人數：AI 必須先知道「可能會去」應算哪一類，才能開始整理留言。","question":"「我可能會去，但還沒問家人」應該標成哪一類？為什麼先討論標準比直接蒐集資料重要？","steps":["設定三種報名標籤","看班群留言的例子","處理「可能會去」這類模糊句"],"minutes":3,"sub":""},{"l":2,"title":"標註一致性：模糊句怎麼辦？","kind":"agreement","lead":"同一則園遊會報名留言，如果同學們標的類別不一樣，模型會學到互相衝突的答案。","points":["針對含糊句先討論、修正標註準則，而不是隨機猜一個標籤","可保留「難判斷／需人工審核」標記，視任務定義決定如何處理"],"example":"「我可能去園遊會，但還沒問家人」可能被不同標註者判為不同類別。先約定標準，再統一標註。","question":"增加第三類「中立」前，需要重新定義哪些情況？","steps":["看兩位標註者","顯示分歧","調整標註規則"],"minutes":3,"sub":""}],"modeLabels":["定義三種標籤","處理模糊與分歧"],"steps":["設定三種報名標籤","看班群留言的例子","處理「可能會去」這類模糊句"],"lead":"想讓 AI 整理班群的園遊會報名訊息？先決定「想參加／不能參加／還不確定」三種標籤，再蒐集留言。","points":["「我一定到！」標為想參加；「當天有補習」標為不能參加；「到時再看看」標為還不確定","對「我應該可以去吧」這種模糊留言，先約定判斷規則，避免每個人標得不一樣"],"example":"班長想統計園遊會幫忙的人數：AI 必須先知道「可能會去」應算哪一類，才能開始整理留言。","question":"「我可能會去，但還沒問家人」應該標成哪一類？為什麼先討論標準比直接蒐集資料重要？","minutes":3},{"l":2,"title":"自己做標註：一句話一個答案","kind":"labeling","lead":"每一筆訓練樣本要包含輸入文字與標籤。點選標籤即可更改練習資料。","points":["教學用資料 8 筆，先練習建立「文字／label」對照","真實資料集需要更多且多樣的樣本；不要把本頁 8 筆當成充分訓練資料"],"example":"把園遊會報名訊息逐筆配上標籤；此頁 8 筆屬於操作示意，真實微調需要更多、多樣且一致的資料。","question":"請點選你覺得標錯的一筆，說明理由。","steps":["讀取句子","點選標籤","討論有爭議樣本"],"minutes":3,"sub":""},{"l":2,"title":"Train／Validation／Test 與資料洩漏","kind":"combo","sub":"分組公平，評估才可信","modes":[{"l":2,"title":"切分 Train／Validation／Test","kind":"split","lead":"Train 學習參數；Validation 挑超參數與檢查訓練；Test 留到最後一次評估。","points":["調整驗證集比例，看筆數與資料格子同步改變","此頁固定保留 20% Test，教學示範資料共 20 筆；實際工作可依資料量與類別比例調整"],"example":"若總共只有 20 筆，驗證集太小時，分數容易受單筆樣本影響。","question":"為什麼不能反覆看 Test 的結果來決定訓練輪數？","steps":["看三種資料角色","調整切分比例","核對實際筆數"],"minutes":3,"sub":""},{"l":2,"title":"資料洩漏：測試題不能先偷看","kind":"leak","lead":"Data Leakage（資料洩漏）會讓測試成績看似很好，卻無法反映新資料的表現。","points":["完全相同或高度重複的評論若出現在訓練與測試，容易造成高估","同一使用者大量相似文字也可能需要依群組切分，避免資訊洩漏"],"example":"如果「校慶我會去！」在 Train 和 Test 原封不動重複，考試就像先看過題目，不能當作公平的泛化能力測試。","question":"出現重複資料時，應在切分前做哪些檢查？","steps":["比較兩側句子","指出重複樣本","修正切分方式"],"minutes":3,"sub":""}],"modeLabels":["切分三組資料","重複留言會洩漏"],"steps":["看三種資料角色","調整切分比例","核對實際筆數"],"lead":"Train 學習參數；Validation 挑超參數與檢查訓練；Test 留到最後一次評估。","points":["調整驗證集比例，看筆數與資料格子同步改變","此頁固定保留 20% Test，教學示範資料共 20 筆；實際工作可依資料量與類別比例調整"],"example":"若總共只有 20 筆，驗證集太小時，分數容易受單筆樣本影響。","question":"為什麼不能反覆看 Test 的結果來決定訓練輪數？","minutes":3},{"l":2,"title":"Tokenization：Padding 與 Attention Mask","kind":"padding","lead":"一個 batch 有長有短的句子，通常需要依共同長度補齊。","points":["[PAD] 不代表文字；Mask 的 1 表示有效位置、0 表示 padding（常見做法）","為避免大量不必要的填補，可使用動態 padding，按 batch 最長句決定長度"],"example":"「非常好」與「服務態度真的非常好」放在同一 batch，短句需要補位置。","question":"Mask 為 0 的位置，模型應把它當成新的詞嗎？","steps":["讀兩句長度","補齊 Token","觀察 Mask"],"minutes":3,"sub":""},{"l":2,"title":"微調 BERT：哪些權重會改變？","kind":"finetune","lead":"微調是讓模型在你的任務資料上繼續更新參數，不是單純重新貼標籤。","points":["常見 full fine-tuning 同時更新 Encoder 與分類頭的權重","也可能凍結 Encoder、只訓練分類頭；兩種策略要清楚區分"],"example":"本頁切換「只訓練分類頭／全部微調」會標亮實際更新的模組。","question":"如果凍結 Encoder，反向傳播會更新 Encoder 裡的參數嗎？","steps":["看到模型結構","切換凍結策略","比較可更新範圍"],"minutes":3,"sub":""},{"l":2,"title":"Batch、Step、Epoch：每批怎麼跑完整輪？","kind":"combo","sub":"用 12 筆資料看一次完整訓練","modes":[{"l":2,"title":"Batch、Step、Epoch：把 12 筆資料裝進訓練盒","kind":"step","lead":"把 Batch Size 想成盒子的容量；處理完一盒就完成一個 Step，所有資料都走過一次才完成 1 個 Epoch。","points":["調整每盒容量與 Epoch 次數，再按「下一個 Step」或「自動播放」，觀察訓練盒依序亮起","本例每批更新一次、不丟棄最後不足額的資料、也不做梯度累積，因此總 Step＝⌈12 ÷ Batch Size⌉ × Epoch"],"example":"12 則班群留言、每批 5 則，完成 5＋5＋2 三批才算一輪 Epoch；三輪共 9 個更新 Step。","question":"若 Batch Size 從 5 改成 4，訓練 3 個 Epoch，總共需要幾個 Step？","steps":["觀察資料裝進 Step 盒","逐盒前進直到完成一輪","重複 Epoch 並累積總 Step"],"minutes":3,"sub":""},{"l":2,"title":"Batch Size：一次送幾筆？","kind":"batch","lead":"Batch Size 就像分格收納盒的容量：一次取出幾筆資料，放進同一個盒子處理。","points":["將 12 筆資料依 Batch Size 裝盒：每盒最多放指定數量，最後一盒即使未裝滿仍是一批","本例每處理一個 Batch 就更新一次權重，算作一個 optimizer Step；切回「互動訓練盒」即可動態觀看完整 Epoch"],"example":"Batch Size＝5：12 筆資料裝成 5、5、2 三盒，因此一個 Epoch 有 3 個 Step。","question":"為何 Batch Size 越大，不代表訓練一定越好？","steps":["選擇每盒容量","看 12 筆資料如何裝盒","數出本輪 Step 數"],"minutes":3,"sub":""},{"l":2,"title":"Epoch：把訓練集完整看過一遍","kind":"epoch","lead":"Epoch 是整份訓練資料都被處理過一遍；同一份資料會在下一輪再次出現。","points":["12 筆資料、Batch Size＝5：每個 Epoch 為 3 個 Step，分別裝 5、5、2 筆","Epoch＝3 就是把相同的 12 筆資料跑三輪，一共 3 × 3＝9 Step（假設每批更新一次）"],"example":"就像把 12 張單字卡分盒練習：全部盒子看完算 1 輪；看 3 輪才是 3 個 Epoch。","question":"將 Epoch 增加兩倍，是否保證驗證集分數提高？","steps":["先把 12 筆分批","讓盒子完成一個 Epoch","複製三輪並數總 Step"],"minutes":3,"sub":""}],"modeLabels":["互動訓練盒","Batch Size","一輪 Epoch"],"steps":["觀察資料裝進 Step 盒","逐盒前進直到完成一輪","重複 Epoch 並累積總 Step"],"lead":"把 Batch Size 想成盒子的容量；處理完一盒就完成一個 Step，所有資料都走過一次才完成 1 個 Epoch。","points":["調整每盒容量與 Epoch 次數，再按「下一個 Step」或「自動播放」，觀察訓練盒依序亮起","本例每批更新一次、不丟棄最後不足額的資料、也不做梯度累積，因此總 Step＝⌈12 ÷ Batch Size⌉ × Epoch"],"example":"12 筆、Batch Size＝5：每輪 3 盒（5＋5＋2）；訓練 3 個 Epoch 就處理 9 盒，也就是 9 個 Step。","question":"若 Batch Size 從 5 改成 4，訓練 3 個 Epoch，總共需要幾個 Step？","minutes":3},{"l":2,"title":"Learning Rate：每次更新跨多大步","kind":"learning","lead":"Learning Rate（學習率）控制每次更新參數的幅度。現在可連續觀察多達 15 次更新，而非只看少數幾個點。","points":["學習率太小：15 次後可能還離最低點很遠；適中：逐步靠近最低點","學習率太大：可能左右震盪甚至發散；試試不同大小，比較多次更新的完整軌跡"],"example":"同樣初始參數，試試小／中／大的 Learning Rate，觀察參數位置。","question":"學習率越大，每次移動越遠，是否一定能更快接近最低 Loss？","steps":["調整學習率","觀察 15 次位置","比較收斂與震盪"],"minutes":3,"sub":""},{"l":2,"title":"訓練 Loss、驗證 Loss 與模型選擇","kind":"combo","sub":"訓練越久，不一定越會預測","modes":[{"l":2,"title":"Training Loss 下降，不代表泛化最好","kind":"curves","lead":"需要同時觀察訓練集與驗證集；兩條曲線可能在後期分離。","points":["滑桿切換 Epoch，顯示示意 Training／Validation Loss 與目前的訓練輪數","此頁曲線是明確標記的合成例子；真實曲線須由實際訓練紀錄提供"],"example":"假設第 5 輪後訓練 Loss 持續下降，驗證 Loss 卻回升，可能是過度擬合。","question":"應只選 Training Loss 最低的那一次嗎？","steps":["看兩條曲線","調整 Epoch","找出過度擬合轉折"],"minutes":3,"sub":""},{"l":2,"title":"挑模型：用 Validation，不用 Test","kind":"checkpoint","lead":"訓練過程可以儲存多個 Checkpoint（模型權重快照），用驗證結果選擇。","points":["模型選擇依 Validation 指標；Test 應保留給最後的獨立評估","同一份 Validation 反覆調整仍可能逐漸過擬合，必要時採更嚴謹評估設計"],"example":"四個候選 Epoch 的驗證 Loss 為 0.62、0.48、0.39、0.45，最低的是第 3 個。","question":"如果第 4 個 Epoch 的 Training Loss 更低，該選第 4 個嗎？","steps":["比較四個模型","選最低 Validation Loss","留到最後評測"],"minutes":3,"sub":""}],"modeLabels":["觀察兩條 Loss","選最佳 Checkpoint"],"steps":["看兩條曲線","調整 Epoch" // Dim, rather than hide, upcoming teaching steps so the diagram never goes blank.
// 以淡化代替完全隱藏，讓每個步驟都有可觀察的主要圖像。
function drawPhase(){
 $('#deck').querySelectorAll('.gate[data-min]').forEach(el=>el.classList.remove('dim'));
 $('#deck').querySelectorAll('.step').forEach((el,i)=>{el.classList.toggle('active',i===phase);el.classList.toggle('done',i<phase);});
 const next=$('[data-action="next"]');
 if(next)next.textContent='下一頁 →';
}

// Produce compact, readable vector diagrams with deterministic data.
// 使用確定的示範資料產生清楚可讀的向量圖解。
// Educational Encoder chart: explicit contextual vectors and the classification head.
// Encoder 圖解包含 Token、彼此參照、語境向量及分類頭，不把示意機率當實測值。
function understandView(){
 const rows=[
  {sentence:'這家店不太好吃',tokens:['[CLS]','這家店','不','太','好吃','[SEP]'],p:0.13,cls:'[−0.6, 0.8, …]',decoder:'「可能是因為味道……」'},
  {sentence:'這家店真的很好吃',tokens:['[CLS]','這家店','真的','很','好吃','[SEP]'],p:0.91,cls:'[0.7, −0.1, …]',decoder:'「聽起來很值得試試……」'}
 ];
 const r=rows[encoderCase];
 const probs=[{label:'正面',val:r.p,col:'positive'},{label:'負面',val:1-r.p,col:'negative'}];
 return `<div class="enc-stage">
  <div class="enc-left">
   <div class="enc-titleline"><b>① 從句子到 Token</b><div class="enc-choices">${rows.map((row,i)=>`<button class="smallbtn ${encoderCase===i?'selected':''}" data-action="encoderCase" data-value="${i}">${i===0?'否定句':'稱讚句'}</button>`).join('')}</div></div>
   <div class="enc-sentence">「${r.sentence}」<small>教學切詞示意</small></div>
   <div class="enc-tokens">${r.tokens.map((t,i)=>`<span class="${i===0?'important':''}">${t}</span>`).join('')}</div>
   <div class="enc-core gate" data-min="1">
    <div class="enc-connect"><svg viewBox="0 0 485 47" preserveAspectRatio="none" aria-label="注意力連線示意：文字中的不同位置可以參照彼此"><path d="M39 31 Q121 0 203 31 M203 31 Q284 3 365 31 M121 31 Q243 -13 447 31 M39 31 Q242 -25 447 31" fill="none" stroke="#92b8e9" stroke-width="2.6" stroke-opacity=".64"/><g fill="#517fbf">${[39,121,203,284,365,447].map(x=>`<circle cx="${x}" cy="31" r="4.4"/>`).join('')}</g></svg></div>
    <div class="enc-core-title">② Transformer Encoder <span>參考整句前後文</span></div>
    <div class="enc-vectors">${r.tokens.map((t,i)=>`<div class="enc-vcol ${i===0?'selected':''}" title="${t} 的語境向量（示意色塊）"><div class="enc-miniheat">${Array.from({length:6},(_,j)=>`<i style="background:${(i+j+encoderCase)%4===0?'#5f91d7':(i+j+encoderCase)%4===1?'#b6d2f4':(i+j+encoderCase)%4===2?'#9fd8bc':'#e1b980'}"></i>`).join('')}</div><small>${t}</small></div>`).join('')}</div>
   </div>
   <div class="enc-output gate" data-min="2">

// Every tray is an optimizer step in this introductory one-update-per-batch example.
// 每個收納盒代表一個 Batch；本例每處理一批便更新一次，因此算一個 Step。
function trayList(size,complete=0,active=-1){
 const steps=Math.ceil(12/size);
 return Array.from({length:steps},(_,i)=>{
  const from=i*size,count=Math.min(size,12-from);
  return `<div class="tray-card ${i<complete?'finished':i===active?'running':''}"><div class="tray-top"><b>Step ${i+1}</b><span>${count} / ${size} 筆</span></div><div class="tray-slots" style="--slots:${size}">${Array.from({length:size},(_,j)=>{const id=from+j+1;return `<div class="tray-slot ${id>12?'empty':''}">${id>12?'—':String(id).padStart(2,'0')}</div>`}).join('')}</div></div>`;
 }).join('');
}
function batchGraphic(){const steps=Math.ceil(12/batchSize);return `<div class="batch-tray-layout"><div class="tray-explain"><b>12 筆練習資料</b><span>${Array.from({length:12},(_,i)=>`<em>${String(i+1).padStart(2,'0')}</em>`).join('')}</span></div><div class="tray-arrows">↓　依 Batch Size 裝進盒子　↓</div><div class="batch-trays">${trayList(batchSize)}</div><div class="tray-equation">每盒最多 <b>${batchSize}</b> 筆　｜　本輪共 <b>${steps}</b> 盒 = <b>${steps}</b> 個 Step</div></div>`;}
function batchView(){return `<div id="batchGraphic">${batchGraphic()}</div><div class="range-row"><label for="batchRange">每盒容量 Batch Size</label><input id="batchRange" class="range" data-action="batchRange" type="range" min="2" max="6" step="1" value="${batchSize}"><output id="batchOut">${batchSize} 筆</output></div>`;}

// Storage-tray training animation: a step completes one batch, and an epoch traverses all 12 samples.
// 分格收納盒訓練動畫：每盒完成一個 Step，整份 12 筆資料處理一次才算一個 Epoch。
let nnBatch=5,nnEpochs=3,nnDone=0,nnTimer=null,nnRunning=false;
function nnStop(){if(nnTimer!==null)clearInterval(nnTimer);nnTimer=null;nnRunning=false;}
function nnReset(){nnStop();nnDone=0;}
function nnIndex(){const per=Math.ceil(12/nnBatch);return {per,total:per*nnEpochs,epoch:Math.floor(nnDone/per),batch:nnDone%per};}
function nnAdvance(){const k=nnIndex();if(nnDone>=k.total){nnStop();return false;}nnDone++;if(nnDone>=k.total)nnStop();return true;}
function nnPanel(){
 const {per,total}=nnIndex(),finished=nnDone>=total;
 const focusEpoch=Math.min(nnEpochs-1,Math.floor(Math.max(0,nnDone-(finished?1:0))/per));
 const inEpoch=nnDone-focusEpoch*per;
 const epochRows=Array.from({length:nnEpochs},(_,e)=>{const done=Math.max(0,Math.min(per,nnDone-e*per));return `<div class="tray-epoch-row ${e===focusEpoch?'current':''}"><b>Epoch ${e+1}</b><div class="tray-epoch-steps" style="--step-cols:${per}">${Array.from({length:per},(_,j)=>`<span class="${j<done?'done':e===focusEpoch&&j===done?'active':''}">${j+1}</span>`).join('')}</div><small>${done} / ${per} Step</small></div>`}).join('');
 return `<div class="tray-lab">
  <div class="tray-stats"><div><small>訓練資料</small><b>12 筆</b></div><div><small>Batch Size</small><b>${nnBatch} 筆／盒</b></div><div><small>每個 Epoch</small><b>${per} Step</b></div><div><small>總進度</small><b>${nnDone} / ${total} Step</b></div></div>
  <div class="tray-current-title"><b>第 ${focusEpoch+1} 個 Epoch：按順序處理 ${per} 個盒子</b><span>${finished?'全部完成！':`接下來：Step ${nnDone+1}`}</span></div>
  <div class="tray-main-boxes" style="grid-template-columns:repeat(${per},minmax(0,1fr))">${trayList(nnBatch,Math.max(0,Math.min(per,inEpoch)),inEpoch<per?inEpoch:-1)}</div>
  <div class="tray-epoch-board"><div class="tray-board-title">全部 Epoch 的 Step 進度 <span>每完成一個盒子，整體 Step ＋1</span></div>${epochRows}</div>
  <div class="tray-control-row"><label>Batch Size <input type="range" min="2" max="6" step="1" value="${nnBatch}" data-action="nnBatch"></label><b>${nnBatch}</b><label>Epoch <input type="range" min="1" max="5" step="1" value="${nnEpochs}" data-action="nnEpochs"></label><b>${nnEpochs}</b><button class="smallbtn primary" data-action="nnNext" ${finished?'disabled':''}>下一個 Step</button><button class="smallbtn" data-action="nnPlay">${nnRunning?'暫停':'▶ 自動播放'}</button><button class="smallbtn" data-action="nnReset">重設</button></div>
  <div class="tray-math">⌈12 ÷ ${nnBatch}⌉ × ${nnEpochs} Epoch = <strong>${per} × ${nnEpochs} = ${total} Step</strong><span>　（最後一盒不足 ${nnBatch} 筆仍計為一個 Step）</span></div>
 </div>`;
}
// English: Keep the classroom example consistent with the interactive training counters.
// 中文：Batch Size、Epoch 或 Step 改變時，右側生活情境的數值也必須同步。
function syncTrainingSide(){
 const kind=activeMode(SLIDES[index]).kind;
 const example=document.querySelector('.side .example');
 const question=document.querySelector('.side .question');
 if(!example||!question)return;
 if(kind==='step'){
  const per=Math.ceil(12/nnBatch),total=per*nnEpochs,last=12-(per-1)*nnBatch;
  example.textContent=`校慶志工留言共有 12 筆，每盒最多 ${nnBatch} 筆：每輪 ${per} 個 Step（最後一盒 ${last} 筆）；跑 ${nnEpochs} 個 Epoch，共 ${total} 個 Step。目前已完成 ${nnDone} 個。`;
  question.textContent=`思考看看：Batch Size＝${nnBatch} 時，若再多訓練 1 個 Epoch，會多出幾個 Step？`;
 }else if(kind==='batch'){
  const per=Math.ceil(12/batchSize),last=12-(per-1)*batchSize;
  example.textContent=`12 筆園遊會報名留言，每盒最多 ${batchSize} 筆，分成 ${per} 盒；最後一盒有 ${last} 筆，仍算一個 Step。`;
  question.textContent=`思考看看：這批資料如果跑 2 個 Epoch，總共會處理幾個 Step？`;
 }else if(kind==='epoch'){
  const per=Math.ceil(12/epochSize);
  example.textContent=`12 筆園遊會報名留言，每批 ${epochSize} 筆，走完一輪需 ${per} 個 Step；重複 ${epochCount} 輪，共 ${per*epochCount} 個 Step。`;
  question.textContent=`思考看看：增加 Epoch 是否保證新留言的分類效果更好？`;
 }
}

function nnRedraw(preserveSlider=false){
 const v=document.querySelector('#visual');if(!v||activeMode(SLIDES[index]).kind!=='step')return;
 if(!preserveSlider){v.innerHTML=nnPanel();drawPhase();syncTrainingSide();return;}
 const previous=v.querySelector('.tray-lab'),staging=document.createElement('div');staging.innerHTML=nnPanel();
 const fresh=staging.firstElementChild;
 if(!previous){v.innerHTML=nnPanel();drawPhase();syncTrainingSide();return;}
 Array.from(previous.children).forEach((child,i)=>{
  if(child.classList.contains('tray-control-row')){
   const labels=child.querySelectorAll(':scope > b');if(labels[0])labels[0].textContent=nnBatch;if(labels[1])labels[1].textContent=nnEpochs;
  }else child.replaceWith(fresh.children[i].cloneNode(true));
 });
 drawPhase();
 syncTrainingSide();
}
function nnPlay(){if(nnRunning){nnStop();nnRedraw();return;}if(nnDone>=nnIndex().total)nnReset();nnRunning=true;nnTimer=setInterval(()=>{if(activeMode(SLIDES[index]).kind!=='step'||modal){nnStop();return;}nnAdvance();nnRedraw();},680);nnRedraw();}
function stepGraphic(){return nnPanel();}
function stepView(){return stepGraphic();}
function epochGraphic(){
 const per=Math.ceil(12/epochSize),total=per*epochCount;
 return `<div class="epoch-overview"><div class="epoch-overview-head"><b>同一份 12 筆資料，跑 ${epochCount} 輪</b><small>每一輪皆重新處理全部資料</small></div><div class="epoch-mini-rows">${Array.from({length:epochCount},(_,i)=>`<div class="epoch-mini-row"><b>Epoch ${i+1}</b><div style="grid-template-columns:repeat(${per},minmax(0,1fr))">${Array.from({length:per},(_,j)=>`<span>Step ${i*per+j+1}<small>${Math.min(epochSize,12-j*epochSize)} 筆</small></span>`).join('')}</div></div>`).join('')}</div><div class="epoch-summary">每輪 <b>${per}</b> Step × <b>${epochCount}</b> 輪 = <strong>${total}</strong> 次更新</div></div>`;
}
function epochView(){return `<div id="epochGraphic">${epochGraphic()}</div><div class="range-row"><label for="epochBatch">Batch Size</label><input id="epochBatch" data-action="epochBatch" class="range" type="range" min="2" max="6" step="1" value="${epochSize}" style="width:110px"><output id="batchNum">${epochSize}</output><label for="epochRange">Epoch</label><input id="epochRange" data-action="epochRange" class="range" type="range" min="1" max="5" step="1" value="${epochCount}" style="width:110px"><output id="epochNum">${epochCount}</output></div>`;}

function curvePoints(f,n=60){return Array.from({length:n},(_,i)=>{const x=i/(n-1)*10;return [x,f(x)]})}
function svgLine(points,color,width=3){return `<polyline points="${points.map(([x,y])=>`${fmt(45+x*55,2)},${fmt(240-y*170,2)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round"/>`}
// Show fifteen gradient-descent updates with the same exact quadratic-loss rule.
// 以同一個二次損失函數真實計算 15 次更新，避免少數點難以比較收斂情形。
function learningSvg(){
 let x=4.65;const history=[x];
 for(let i=0;i<15;i++){x-=rate*2*x;history.push(x);}
 const scaleX=x=>358+x*62, scaleY=x=>246-Math.min(1.38,x*x/14)*165;
 const svgCurve=Array.from({length:101},(_,i)=>{const x=-5+i/10;return `${scaleX(x)},${scaleY(x)}`}).join(' ');
 const dots=history.map((v,i)=>{const visible=i<=rateStep;const px=scaleX(clamp(v,-4.85,4.85)),py=scaleY(clamp(v,-4.85,4.85));return `<circle cx="${px}" cy="${py}" r="${i===rateStep?7.5:3.8}" fill="${Math.abs(v)>4.85?'#db7e5b':i===rateStep?'#e09a53':'#3d8bbd'}" fill-opacity="${visible?1:.13}" stroke="${visible?'#fff':'none'}" stroke-width="1.4"/>`}).join('');
 const path=history.slice(0,rateStep+1).map((v,i)=>`${i?'L':'M'}${scaleX(clamp(v,-4.85,4.85)).toFixed(1)} ${scaleY(clamp(v,-4.85,4.85)).toFixed(1)}`).join(' ');
 const current=history[rateStep],off=Math.abs(current)>4.85,loss=(current*current);
 return `<svg viewBox="0 0 715 295" role="img" aria-label="15 次更新的梯度下降軌跡：學習率大時可能來回震盪或超出顯示範圍"><rect x="0" y="0" width="715" height="295" rx="10" fill="#fff"/><path d="M40 253H682 M358 18V253" fill="none" stroke="#cbd9ea" stroke-width="2"/><polyline points="${svgCurve}" fill="none" stroke="#71a1cf" stroke-width="3.7"/><path d="${path}" fill="none" stroke="#db9865" stroke-width="2.7" stroke-dasharray="5 4" opacity=".85"/>${dots}<text x="58" y="20" fill="#607790" font-size="12">Loss</text><text x="358" y="286" text-anchor="middle" font-size="12.7" fill="#566d86">參數位置（最低點在正中間）</text><text x="650" y="22" text-anchor="end" font-size="12" fill="#536e8c">已進行 ${rateStep} / 15 次更新</text><text x="650" y="39" text-anchor="end" font-size="12" font-weight="800" fill="${off?'#b96746':'#24639e'}">${off?'⚠ 已超出圖表範圍':`目前 Loss ≈ ${fmt(loss,3)}`}</text><text x="53" y="273" font-size="11" fill="#8c9aab">淺色點：尚未進行的步驟</text></svg>`;
}
function learningTrack(){return `<div class="learning-track"><span>第幾次更新</span>${Array.from({length:16},(_,i)=>`<i class="${i<rateStep?'done':i===rateStep?'current':''}">${i}</i>`).join('')}</div>`;}
function learningView(){return `<div class="pane" style="height:225px;padding:5px"><div id="learningSvg" class="diagram">${learningSvg()}</div><div id="learningTrack">${learningTrack()}</div></div><div class="range-row"><label for="lrRange">Learning Rate</label><input class="range" id="lrRange" data-action="lrRange" type="range" min="0.05" max="1.2" step="0.05" value="${rate}"><output id="lrOut">${fmt(rate,2)}</output><button class="smallbtn primary" data-action="rateStep">更新一次</button><button class="smallbtn" data-action="rateAll">連續看 15 次</button><button class="smallbtn" data-action="rateReset">重設</button></div><div class="hint">示意函數 Loss = x²（縱軸按比例縮放）；更新規則 x ← x − 學習率 × 2x。線段及圓點顯示每次參數位置。</div>`;}

function lossTrain(i){return .17+1.13*Math.exp(-.37*i)}
function lossVal(i){return .37+1.16*Math.exp(-.48*i)+Math.max(0,i-5)**1.5*.035}
function curveSvg(){const points=Array.from({length:13},(_,i)=>i);const tx=i=>54+i*49;const ty=v=>250-v*140;const line=fun=>points.map(i=>`${tx(i)},${ty(fun(i))}`).join(' ');return `<svg viewBox="0 0 725 298" role="img" aria-label="示意訓練與驗證損失曲線"><path d="M52 12V252H700" fill="none" stroke="#c9d8e7" stroke-width="2"/><g stroke="#e7edf4" stroke-width="1">${[.5,1,1.5].map(v=>`<path d="M52 ${ty(v)}H700"/>`).join('')}</g><polyline points="${line(lossTrain)}" fill="none" stroke="#4b83d0" stroke-width="4"/><polyline points="${line(lossVal)}" fill="none" stroke="#df986f" stroke-width="4"/><path d="M${tx(curveEpoch)} 10V255" stroke="#8c75c5" stroke-width="2" stroke-dasharray="5 4"/><circle cx="${tx(curveEpoch)}" cy="${ty(lossTrain(curveEpoch))}" r="7" fill="#4b83d0" stroke="white" stroke-width="2"/><circle cx="${tx(curveEpoch)}" cy="${ty(lossVal(curveEpoch))}" r="7" fill="#df986f" stroke="white" stroke-width="2"/><text x="55" y="14" font-size="12" fill="#73869a">Loss（示意）</text><text x="684" y="278" font-size="12" fill="#73869a">Epoch</text></svg>`}
function curvesView(){return `<div class="pane" style="height:236px;padding:0 8px"><div class="diagram" id="curveSvg">${curveSvg()}</div><div class="legend"><span><i class="dot" style="background:#4b83d0"></i>Train Loss</span><span><i class="dot" style="background:#df986f"></i>Validation Loss</span><span><i class="dot" style="background:#9279c1"></i>目前 Epoch</span></div></div><div class="range-row"><label for="curveRange">Epoch</label><input type="range" id="curveRange" class="range" data-action="curveRange" min="1" max="12" value="${curveEpoch}"><output id="curveOut">${curveEpoch}</output></div><div class="hint" id="curveNumbers">Train ${fmt(lossTrain(curveEpoch),2)}｜Validation ${fmt(lossVal(curveEpoch),2)}（教學合成資料）</div>`}
function checkpointView(){const ls=[.62,.48,.39,.45];return `<div class="pane blue"><div class="rowlabel">四個 Checkpoint 的 Validation Loss（示意值）</div><div class="threecol" style="grid-template-columns:repeat(4,1fr)">${ls.map((x,i)=>`<div class="stat gate" data-min="${i>1?1:0}" style="background:${i===2?'#e7f8ee':'white'};border-color:${i===2?'#79c7a3':'#e0e8f2'}"><span>Epoch ${i+1}</span><b>${fmt(x,2)}</b>${i===2?'<span style="color:#258263;font-weight:900">Validation 最低 ✓</span>':''}</div>`).join('')}</div>${gate('<div class="note good">若目標是最小化 Validation Loss，此例選第 3 個 Checkpoint；Test 不用來做這項選擇。</div>',2)}</div>`}
function computeMetrics(tp,fp,fn,tn){const div=(a,b)=>b?a/b:null,p=div(tp,tp+fp),r=div(tp,tp+fn);return {tp,fp,fn,tn,n:tp+fp+fn+tn,accuracy:div(tp+tn,tp+fp+fn+tn),precision:p,recall:r,f1:div(2*tp,2*tp+fp+fn)}}
const BASE=computeMetrics(5,2,1,4);
function matrixGrid(m,chosen=matrixPick){const cells=[['TP',m.tp,'真實正面、預測正面','ok'],['FP',m.fp,'真實負面、預測正面','err'],['FN',m.fn,'真實正面、預測負面','err'],['TN',m.tn,'真實負面、預測負面','ok']];return `<div class="matrix"><div class="axis">預測＼真實</div><div class="axis">真實正面</div><div class="axis">真實負面</div><div class="axis">預測正面</div>${cells.slice(0,2).map(([k,n,t,c])=>`<button class="mcell ${c} ${chosen===k?'selected':''}" data-action="matrix" data-value="${k}"><b>${n}</b><small>${k}</small></button>`).join('')}<div class="axis">預測負面</div>${cells.slice(2).map(([k,n,t,c])=>`<button class="mcell ${c} ${chosen===k?'selected':''}" data-action="matrix" data-value="${k}"><b>${n}</b><small>${k}</small></button>`).join('')}</div>`}
function matrixView(){const texts={TP:'True Positive（真正類）：真實正面、模型也預測正面。',FP:'False Positive（假陽性／誤報）：真實負面、模型預測正面。',FN:'False Negative（假陰性／漏報）：真實正面、模型預測負面。',TN:'True Negative（真負類）：真實負面、模型也預測負面。'};return `${matrixGrid(BASE)}<div class="note" id="matrixNote">${texts[matrixPick]}</div><div class="hint">四格總數 = 5 + 2 + 1 + 4 = ${BASE.n}；這是教學範例資料。</div>`}
function metricView(){const m=BASE;const forms=[['Accuracy（準確率）',m.accuracy,'(TP + TN) / 全部 = 9 / 12'],['Precision（精確率）',m.precision,'TP / (TP + FP) = 5 / 7'],['Recall（召回率）',m.recall,'TP / (TP + FN) = 5 / 6'],['F1-score',m.f1,'2TP / (2TP + FP + FN) = 10 / 13']];return `<div class="twocol">${forms.map((f,i)=>`<div class="pane ${i===0?'blue':i===3?'green':''} gate" data-min="${i>1?1:0}" style="gap:4px"><h3 style="font-size:15px">${f[0]}</h3><strong class="number" style="font-size:29px">${fmt(f[1]*100,1)}%</strong><div class="bartrack"><div class="barfill ${i===3?'pos':''}" style="width:${f[1]*100}%"></div></div><p style="font-size:11.4px">${f[2]}</p></div>`).join('')}</div>`}
function calcThreshold(t){let tp=0,fp=0,fn=0,tn=0;PROBS.forEach((p,i)=>{const actual=TRUTH[i],pred=p>=t?1:0;if(actual&&pred)tp++;else if(!actual&&pred)fp++;else if(actual&&!pred)fn++;else tn++});return computeMetrics(tp,fp,fn,tn)}
function thresholdGraphic(){const m=calcThreshold(threshold);const frac=v=>v===null?'未定義':fmt(v*100,1)+'%';return `<div class="threshold-def"><b>P(正面)：模型對「正面」類別的示意機率</b><span>例如 0.94 = 對正面給出 94% 分數，並不表示模型「94% 準確」。</span></div><div class="threshold-cards">${PROBS.map((p,i)=>{const pred=p>=threshold?1:0;const correct=pred===TRUTH[i];return `<div class="threshold-card ${correct?'correct':'incorrect'}"><strong>樣本 ${i+1}</strong><small>正面分數 P(+)</small><b>${fmt(p,2)}</b><span>判：${pred?'正面':'負面'}</span><span>真：${TRUTH[i]?'正面':'負面'}</span></div>`}).join('')}</div><div class="threshold-sum">${[['TP',m.tp],['FP',m.fp],['FN',m.fn],['TN',m.tn],['Precision',m.precision],['Recall',m.recall]].map(([k,v])=>`<div><span>${k}</span><b>${typeof v==='number'&&v<=1&&k.length>2?frac(v):v}</b></div>`).join('')}</div>`;}
function thresholdView(){return `<div id="thresholdGraphic">${thresholdGraphic()}</div><div class="range-row"><label for="thresholdRange">判為正面的閾值</label><input class="range" data-action="thresholdRange" id="thresholdRange" type="range" min="0.1" max="0.9" step="0.05" value="${threshold}"><output id="thresholdOut">${fmt(threshold,2)}</output></div><div class="hint">綠框＝判對，紅框＝判錯；只改分類門檻，不修改模型分數。「真」為人工標註答案。</div>`}
const FLOW_STAGES=[['① 定義與標註','準備任務標籤與已標註句子'],['② 切分資料','Train／Validation／Test 不互相重疊'],['③ Tokenizer','切 Token、查 ID、padding 與 Mask'],['④ 微調模型','Train 做 Forward、Loss、Backward 與更新'],['⑤ Validation','比較指標／調超參數／挑 Epoch'],['⑥ 固定 Checkpoint','儲存最佳權重及設定，不再偷看 Test'],['⑦ Test','在未參與選模的資料上做最終評估']];
function trainflowView(){return `<div class="train-flow"><div class="flow-chips">${FLOW_STAGES.map((s,i)=>`<button class="flow-chip ${flowStage===i?'selected':''} ${i<flowStage?'finished':''}" data-action="flowStage" data-value="${i}"><span>${s[0]}</span><small>${i===flowStage?'目前節點':i<flowStage?'已完成':'尚未進入'}</small></button>`).join('<div class="flow-sep">→</div>')}</div><div class="flow-detail"><strong>${FLOW_STAGES[flowStage][0]}</strong><span>${FLOW_STAGES[flowStage][1]}</span></div><div class="btnbar"><button class="smallbtn" data-action="flowBack">← 上一站</button><button class="smallbtn primary" data-action="flowNext">下一站 →</button></div><div class="hint">只有正在解說的節點加強標亮；Test 必須在模型與設定固定後才獨立使用。</div></div>`}
// English: Wrong answers show actionable hints; full explanation appears only after a correct response.
// 中文：答錯提供引導但不公布答案；答對才顯示完整的概念解釋。
// English: Give a complete concept and an example only when the student selects the correct answer.
// 中文：學生答對時提供概念定義與具體例子，避免只回覆一個選項名稱。
QUESTIONS[0][0][3]='Tokenizer 會依模型的詞彙表把句子切成 Token，再把每個 Token 對應到固定的 Token ID。例如「好」可對應某個整數索引。Embedding 才會將這些 ID 轉成可計算的向量；Softmax 與 Accuracy 不負責切詞。';
QUESTIONS[0][1][3]='分類模型輸出的信心分數反映它對不同類別的偏好，不是「一定答對」的保證。遇到反諷、含糊語句、訓練資料以外的情境，即使分數很高也可能和正確標籤不同；要確認機率是否可靠，還需要額外做校準評估。';
QUESTIONS[0][2][3]='Tokenizer 先產生 Token ID，BERT Encoder 讓 Token 取得前後文相關的語境向量；整句分類常使用 [CLS] 的語境表示，交給已訓練的分類頭算出各類 Logit，再經 Softmax 產生各類分數。光有預訓練 Encoder 不代表分類頭已經會分辨特定情緒。';
QUESTIONS[1][0][3]='Train（訓練集）用於學習模型權重，Validation（驗證集）用於比較超參數與選擇訓練輪次。Test（測試集）應保留到模型設定與 Checkpoint 決定後，作最後的獨立評估；如果反覆拿它調整模型，就可能高估泛化能力。';
QUESTIONS[1][1][3]='共有 12 筆，Batch Size=4，代表每一輪分為 12÷4=3 批；若每批更新一次權重，1 個 Epoch 就有 3 個 optimizer Step，3 個 Epoch 就是 3×3=9 Step。本題假設沒有梯度累積，也不丟棄最後一批。';
QUESTIONS[1][2][3]='Training Loss 持續下降代表模型越來越貼近訓練資料；如果 Validation Loss 同時開始回升，模型可能也在記住訓練資料的雜訊，形成過度擬合。可以檢查驗證指標、考慮 Early Stopping（提早停止），並從驗證表現挑選 Checkpoint，而不是只選訓練 Loss 最低的模型。';
const QUIZ_HINTS=[
 ['想想哪個工具負責把文字依詞彙表查成整數 ID；它不是評估指標。','信心分數只表示模型的輸出，不保證人類標註也會相同。','先分清楚誰產生語境向量，以及誰把向量對應到分類標籤。'],
 ['哪一組資料要保留到模型與超參數都固定後才做最終驗收？','先算每一輪分幾批，再乘上輪數，別把筆數當更新次數。','比較訓練資料與新資料的表現：兩者方向不同可能是什麼現象？']
];
function quizView(s){
 const set=QUESTIONS[s.quizset],qa=set[quizNumber],correct=qa[2],chosen=quizAnswer;
 const status=chosen<0?'先點選答案；答錯有提示，答對才顯示完整解釋。':chosen===correct?`答對。${esc(qa[3])}`:`再想一下：${esc(QUIZ_HINTS[s.quizset][quizNumber])}`;
 return `<div class="quiznav"><button data-action="quizBack" ${quizNumber===0?'disabled':''}>← 上一題</button><span>第 ${quizNumber+1} / 3 題</span><button data-action="quizNext" ${quizNumber===2?'disabled':''}>下一題 →</button></div><div class="quiztitle">${esc(qa[0])}</div><div class="quizanswers">${qa[1].map((a,i)=>`<button class="option ${chosen===i?(i===correct?'correct':'wrong'):''}" data-action="quizAnswer" data-value="${i}">${String.fromCharCode(65+i)}.　${esc(a)}</button>`).join('')}</div><div class="quizfeedback ${chosen<0?'':chosen===correct?'correct':'wrong'}">${status}</div>`;
}
function coverView(lesson){const rows=lesson===1?[['01','BERT 理解 vs GPT 生成','同一句話：判斷類別或生成文字'],['02','文字轉為數值表示','Tokenizer・Token ID・Embedding'],['03','預訓練 BERT 與推論','上下文・分類分數・錯誤案例']]:[['01','建立資料與標籤','定義任務、切分資料'],['02','微調分類模型','Encoder・Batch・Epoch・Step'],['03','選模型與評估','Validation・混淆矩陣・F1']];return `<div class="twocol" style="grid-template-columns:1.02fr .98fr"><div class="pane blue" style="padding:20px"><div class="rowlabel">課堂開始前，先想一個問題</div><div class="bigwords">${lesson===1?'看到「好」<br>就一定是好評嗎？':'通用 BERT<br>為何需要重新微調？'}</div><p>${lesson===1?'同一句話裡，詞語和上下文如何一起決定情緒？':'如果想預測校園午餐的滿意度，要先準備什麼資料？'}</p><div class="note warn">${lesson===1?'從看懂一句話開始，逐步走到真正的分類流程。':'這節課要把「用了模型」轉成「知道怎麼教模型」。'}</div></div><div class="vertical" style="justify-content:center">${rows.map((r,i)=>`<div class="pane gate" data-min="${Math.min(i,2)}" style="min-height:75px;flex:1;gap:2px"><div class="rowlabel" style="color:#3970b4">${r[0]}</div><h3 style="font-size:15px">${r[1]}</h3><p style="font-size:12px">${r[2]}</p></div>`).join('')}</div></div>`}
function scene(s){if(s.kind==='combo')return scene(activeMode(s));switch(s.kind){
 case 'cover':return coverView(1);case 'cover2':return coverView(2);
 case 'understand':return understandView();case 'categories':return categoryDiagram();case 'negation':return negationDiagram();
 case 'pipeline':return flow([['中文句子','人類可閱讀'],['Tokenizer','切分與查 ID'],['BERT Encoder','上下文向量'],['分類頭','正面／負面','green']]);
 case 'tokenizer':return tokenizerView();case 'tokenid':return tokenIdView();case 'embedding':return embeddingView();
 case 'order':return orderDiagram();case 'attention':return attentionView();case 'pretrain':return pretrainView();
 case 'beforeafter':return beforeAfterView();case 'logits':return logitView();case 'confidence':return confidenceView();
 case 'huggingface':return huggingfaceView();case 'sandbox':return sandboxView();case 'errors':return errorView();
 case 'special':return specialView();case 'multiclass':return multiclassView();case 'quiz':return quizView(s);
 case 'taskspec':return taskspecView();case 'labeling':return labelingView();case 'agreement':return agreementView();
 case 'split':return splitView();case 'leak':return leakView();case 'padding':return paddingView();
 case 'finetune':return finetuneView();case 'batch':return batchView();case 'step':return stepView();
 case 'epoch':return epochView();case 'learning':return learningView();case 'curves':return curvesView();
 case 'checkpoint':return checkpointView();case 'matrix':return matrixView();case 'metrics':return metricView();
 case 'threshold':return thresholdView();case 'trainflow':return trainflowView();default:return `<div class="note warn">未支援的圖解種類：${esc(s.kind)}</div>`;
}}


// Keep full-screen, modal, overview and copy actions available to classroom users.

function renderModal(){
 const overlay=$('#overlay');
 if(!overlay)return;
 const heading='操作說明';
 let content='';
 if(modal==='overview'){
  content=`<div class="jumpgrid">${SLIDES.map((s,i)=>`<button data-action="jump" data-value="${i}" class="${i===index?'current':''}"><strong>${String(i+1).padStart(2,'0')}｜第 ${s.l} 節</strong>${esc(s.title)}</button>`).join('')}</div>`;
 }else if(modal==='help'){
  content=`<div class="threecol">${[['→ 或 Space','直接切換下一頁'],['←','直接切換上一頁'],['G','總覽與跳頁'],['F','進入或退出全螢幕'],['H 或 ?','操作說明'],['Esc','關閉視窗']].map(x=>`<div class="pane blue"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div><p>輸入框與滑桿取得焦點時，方向鍵由元件優先接收，不會誤觸換頁。底部學習重點進入頁面就全部顯示；同頁概念請用上方分頁切換。</p>`;
  }else{content='<p>使用底部按鈕切換投影片，並操作每頁的示意圖與滑桿。</p>';
  }
 overlay.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${heading}"><div class="modalhead"><h2>${modal==='overview'?'投影片總覽':modal==='help'?'操作說明':heading}</h2><button class="smallbtn" data-action="closeModal">關閉　✕</button></div><div class="modalbody">${content}</div></div>`;
}

function next(){if(index<SLIDES.length-1){nnStop();index++;phase=2;quizNumber=0;quizAnswer=-1;modal='';render()}}
function prev(){if(index>0){nnStop();index--;phase=2;quizNumber=0;quizAnswer=-1;modal='';render()}}
function refreshScene(){const el=$('#visual');if(!el)return;el.innerHTML=scene(SLIDES[index]);drawPhase();}
function setIndex(i){nnStop();index=clamp(i,0,SLIDES.length-1);phase=2;quizNumber=0;quizAnswer=-1;modal='';render();}

// Handle slide-navigation buttons and diagram-specific controls.
// 處理翻頁與每一張投影片特有的操作控制。
function handleAction(action,value){
 switch(action){
 case 'phase':phase=2;drawPhase();return;
 case 'comboMode':comboChoices[index]=Number(value);nnStop();render();return;
 case 'next':next();return;case 'prev':prev();return;
 case 'overview':openModal('overview');return;case 'help':openModal('help');return;
 case 'closeModal':closeModal();return;case 'jump':setIndex(Number(value));return;
 case 'encoderCase':encoderCase=Number(value);break;
 case 'attCase':attentionCase=Number(value);break;case 'maskCase':maskCase=Number(value);break;case 'flowStage':flowStage=Number(value);break;case 'flowNext':flowStage=Math.min(FLOW_STAGES.length-1,flowStage+1);break;case 'flowBack':flowStage=Math.max(0,flowStage-1);break;
 case 'sentence':demoSentence=Number(value);break;
 case 'embedding':selectedToken=Number(value);break;
 case 'confidence':confidenceCase=Number(value);break;
 case 'errors':errorCase=Number(value);break;
 case 'multi':multiCase=Number(value);break;
 case 'label':labels[Number(value)]=1-labels[Number(value)];break;
 case 'finetune':fullFineTune=value==='1';break;
 case 'nnNext':nnStop();nnAdvance();nnRedraw();return;
 case 'nnReset':nnReset();nnRedraw();return;
 case 'nnPlay':nnPlay();return;
 case 'rateStep':rateStep=Math.min(15,rateStep+1);break;
 case 'rateAll':rateStep=15;break;
 case 'rateReset':rateStep=0;break;
 case 'matrix':matrixPick=value;break;
 case 'toyPreset':$('#toyInput').value=['餐點很好吃','真的太慢了','這家店好到我不想再來'][Number(value)];$('#toyOut').innerHTML=toyResult($('#toyInput').value);return;
 case 'toyRun':$('#toyOut').innerHTML=toyResult($('#toyInput').value);return;
 case 'quizAnswer':quizAnswer=Number(value);break;
 case 'quizNext':if(quizNumber<2){quizNumber++;quizAnswer=-1;}break;
 case 'quizBack':if(quizNumber>0){quizNumber--;quizAnswer=-1;}break;
 default:return;
 }
 refreshScene();
}

// Redraw only dependent graphics while dragging a slider; never remove its focused element.
// 拖動滑桿時僅更新相關圖形，不移除正在取得焦點的滑桿。
function handleInput(action,value){
 const n=Number(value);
 if(action==='nnBatch'){nnBatch=n;batchSize=n;epochSize=n;nnReset();nnRedraw(true);return;}
 if(action==='nnEpochs'){nnEpochs=n;epochCount=n;nnReset();nnRedraw(true);return;}
 if(action==='attRange'){attentionWeight=n/100;$('#attentionDiagram').innerHTML=attentionPicture();$('#attOut').textContent=n+'%';}
 if(action==='logitPosRange'||action==='logitNegRange'){if(action==='logitPosRange'){logit=n;}else{negativeLogit=n;}$('#logitGraphic').innerHTML=logitGraphic();$('#logitPosOut').textContent=fmt(logit,1);$('#logitNegOut').textContent=fmt(negativeLogit,1);}
 if(action==='valRange'){valPercent=n;$('#splitGraphic').innerHTML=splitGraphic();$('#valOut').textContent=n+'%';}
 if(action==='batchRange'){batchSize=n;epochSize=n;nnBatch=n;nnReset();$('#batchGraphic').innerHTML=batchGraphic();$('#batchOut').textContent=n+' 筆';syncTrainingSide();}
 if(action==='epochBatch'||action==='epochRange'){
  if(action==='epochBatch'){epochSize=n;batchSize=n;nnBatch=n;}else{epochCount=n;nnEpochs=n;}nnReset();
  $('#epochGraphic').innerHTML=epochGraphic();$('#batchNum').textContent=epochSize;$('#epochNum').textContent=epochCount;syncTrainingSide();
 }
 if(action==='lrRange'){rate=n;rateStep=0;$('#learningSvg').innerHTML=learningSvg();$('#learningTrack').innerHTML=learningTrack();$('#lrOut').textContent=fmt(rate,2);}
 if(action==='curveRange'){curveEpoch=n;$('#curveSvg').innerHTML=curveSvg();$('#curveOut').textContent=n;$('#curveNumbers').textContent=`Train ${fmt(lossTrain(n),2)}｜Validation ${fmt(lossVal(n),2)}（教學合成資料）`;}
 if(action==='thresholdRange'){threshold=n;$('#thresholdGraphic').innerHTML=thresholdGraphic();$('#thresholdOut').textContent=fmt(n,2);}
}
// Delegate events so freshly drawn teaching graphics remain operable.
// 採用事件委派，讓重新繪製後的圖解仍然可以操作。
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)handleAction(el.dataset.action,el.dataset.value??el.dataset.phase??'');});
document.addEventListener('input',e=>{const el=e.target;if(el.matches('[data-action][type="range"]'))handleInput(el.dataset.action,el.value);});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeModal();return;}
 const editable=e.target.matches?.('input,textarea,select,[contenteditable="true"]');
 if(editable||modal)return;
 if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
 else if(e.key.toLowerCase()==='g'){e.preventDefault();openModal('overview');}
 else if(e.key.toLowerCase()==='h'||e.key==='?'){e.preventDefault();openModal('help');}
 else if(e.key.toLowerCase()==='f'){e.preventDefault();fullscreen();}
});
window.addEventListener('resize',rescale);
// Start on the cover and fit the 16:9 deck to the available browser window.
// 顯示封面並依瀏覽器視窗等比例調整 16:9 投影片大小。
render();
rescale();
</script></body>
</html>
