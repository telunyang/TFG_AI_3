/* Support compact TP/FP/TN/FN outcomes and metric comparison on two lesson pages. */
/* 讓四格判斷與分類指標能在兩張投影片內清楚顯示。 */
.simple-key{text-align:center;background:#f0f5ff;padding:7px;border-radius:9px;color:#536e90;font-size:12px;font-weight:800}
.simple-key b{color:#2f5d96}
.outcome-matrix{gap:7px;grid-template-columns:104px repeat(2,minmax(0,1fr));grid-template-rows:26px repeat(2,minmax(0,1fr))}
.outcome-matrix .matcell{cursor:pointer;min-width:0;padding:6px 4px}
.outcome-matrix .matcell b{font-size:27px}
.outcome-matrix .matcell span{font-size:12px}.outcome-matrix .matcell small{font-size:12.7px;font-weight:900;color:#315e98;white-space:nowrap;line-height:1.3}.outcome-matrix .matcell{gap:5px}.outcome-matrix .matcell b{font-size:28px}

.metrics-left,.metrics-right{min-height:0;border-radius:12px;border:1px solid #e0e9f5;background:#fff;padding:9px;display:flex;flex-direction:column;gap:7px}
.metrics-caption{font-size:11px;font-weight:850;color:#506d91;text-align:center}
.metrics-grid{display:grid;grid-template-columns:66px repeat(2,minmax(0,1fr));grid-template-rows:24px repeat(2,minmax(0,1fr));gap:4px;flex:1;min-height:0}
.metrics-grid>span{display:grid;place-items:center;font-size:11px;font-weight:850;color:#58728f;text-align:center}

.metrics-cell.selected{background:#e5f4eb;border:2px solid #70bd99}

.metrics-cell strong{color:#2a5c98;font-size:25px;line-height:1}
.metrics-right{padding:12px 13px;gap:6px;justify-content:center;text-align:center;background:#fafcff}
.metrics-name{font-size:17px;font-weight:950;color:#305b98}
.metrics-formula{font-size:15px;font-weight:900;color:#547091}

.metrics-meaning{color:#586f86;font-size:12.5px;line-height:1.4}

/* English: Combine four confusion-matrix outcomes and four evaluation scores on one page. */
/* 中文：同頁整合四格混淆矩陣與四個分類評估指標，TP 固定左上角。 */
.cm-toolbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;flex:0 0 32px}
.cm-toolbar .action{font-size:12px;padding:5px 6px;white-space:nowrap}
.cm-workspace{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:9px;flex:1;min-height:0}
.cm-matrix-wrap,.cm-score{min-width:0;min-height:0;padding:7px 8px;background:#fff;border:1px solid #dfe7f4;border-radius:13px;display:flex;flex-direction:column;gap:5px}
.cm-legend{flex:0 0 18px;text-align:center;font-size:10.5px;font-weight:800;color:#58728c;white-space:nowrap}
.cm-grid{display:grid;grid-template-columns:91px repeat(2,minmax(0,1fr));grid-template-rows:22px repeat(2,minmax(0,1fr));gap:4px;min-height:0;flex:1}
.cm-grid>span{display:grid;place-items:center;text-align:center;font-size:10.7px;line-height:1.2;color:#546e8e;font-weight:900}
.cm-cell{min-width:0;min-height:0;background:#f7faff;border:1px solid #d9e6f4;border-radius:9px;padding:3px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;line-height:1.15}
.cm-cell.ok{background:#f2fbf6}.cm-cell.bad{background:#fff7ee}

.cm-cell b{font-size:11px;line-height:1.14;color:#315b97;white-space:nowrap}
.cm-cell small{font-size:10.2px;color:#62788f;white-space:nowrap}
.cm-score{padding:11px 10px;justify-content:center;align-items:center;text-align:center;gap:7px;background:#f9fbff}
.cm-score-name{font-size:15.2px;font-weight:950;color:#315c98}
.cm-score-number{font-size:35px;line-height:1;color:#248365;font-weight:950;font-variant-numeric:tabular-nums}
.cm-score-formula{font-size:13.6px;line-height:1.2;color:#305e96;font-weight:900}
.cm-score-calc{font-size:11.2px;line-height:1.25;color:#516b8b;background:#e9f2ff;padding:5px;border-radius:8px;width:100%;font-weight:800}

.cm-foot{flex:0 0 23px;font-size:10.9px;color:#577391;background:#eff5ff;padding:4px 7px;border-radius:8px;text-align:center;line-height:1.35}

/* English: A side-by-side interactive example shows why leaking the label invalidates testing. */
/* 中文：利用可切換的對照圖，說明將答案欄位放進輸入為何會讓測試結果失真。 */
.leak-modes{flex:0 0 36px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.leak-modes .action{padding:8px 9px;font-size:12.4px}
.leak-compare{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:10px}
.leak-data,.leak-score{background:#fff;border:1px solid #dce6f1;border-radius:14px;padding:12px 13px;min-width:0;min-height:0;display:flex;flex-direction:column;gap:9px}
.leak-subhead{font-size:13px;font-weight:950;color:#345c95}
.leak-fields{display:flex;flex-direction:column;gap:5px;flex:1;min-height:0}
.leak-field{border:1px solid #cce7d9;background:#f2fbf5;border-radius:10px;padding:6px 9px;display:flex;gap:8px;align-items:center;justify-content:space-between;min-height:0;flex:1}
.leak-field span{display:flex;flex-direction:column;min-width:0;gap:2px}
.leak-field b{font-size:12px;font-family:ui-monospace,Consolas,monospace;color:#365873;white-space:nowrap}
.leak-field small{font-size:10.7px;color:#6f8497}
.leak-field strong{font-size:11.5px;font-weight:900;color:#318064;white-space:nowrap}

.leak-field.leaked{background:#fff0e8;border-color:#e8b2a1;box-shadow:inset 0 0 0 1px #e0a18e}.leak-field.leaked strong{color:#b5543d}
.leak-caption{margin:0;font-size:10.8px;line-height:1.32;color:#667b91;min-height:26px}
.leak-score{align-items:center;justify-content:center;text-align:center;gap:8px;background:#f4fbf7;border-color:#cce9d8}
.leak-score.warning{background:#fff7f1;border-color:#ebc6b7}
.leak-scoretitle{font-size:12px;font-weight:850;color:#637a97}
.leak-big{font-size:52px;line-height:1;font-variant-numeric:tabular-nums;color:#238067;font-weight:950}
.leak-score.warning .leak-big{color:#cb644a}
.leak-fraction{font-size:14px;font-weight:850;color:#365977}
.leak-result{border-radius:10px;padding:6px 9px;font-size:12px;font-weight:950;background:#dff4e7;color:#246d54}
.leak-score.warning .leak-result{background:#fce2d6;color:#a54b38}
.leak-score p{margin:0;font-size:11.6px;line-height:1.55;color:#567084}
.leak-bottom{flex:0 0 28px;background:#fff4df;color:#845e2b;border:1px solid #f2e1c5;border-radius:9px;padding:6px 9px;font-size:11.7px;line-height:1.3;font-weight:850;text-align:center}

/* Grid Search: use the 3-fold training-set validation results, not the held-out test scores. */

.gs-steps{flex:0 0 31px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.gs-steps span{display:grid;place-items:center;border-radius:9px;background:#edf5ff;border:1px solid #d9e6f6;color:#3f669c;font-size:11px;font-weight:850;white-space:nowrap}
.gs-steps span:last-child{background:#edf8ef;border-color:#c6e6d5;color:#367a5b}
.gs-table{flex:1;min-height:0;display:grid;grid-template-columns:95px repeat(3,minmax(0,1fr));grid-template-rows:27px repeat(3,minmax(0,1fr));gap:6px}
.gs-table .gs-head{display:grid;place-items:center;border-radius:8px;background:#eff4fb;color:#45678d;font-size:11.5px;font-weight:900;text-align:center;line-height:1.2}
.gs-table .gs-rowhead{background:#f4f7fb}
.gs-cell{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;padding:5px;background:#fff;border:1px solid #dce6f1;border-radius:11px;min-width:0;min-height:0;color:#315d96}
.gs-cell strong{font-size:20px;font-weight:950;font-variant-numeric:tabular-nums;line-height:1.1}
.gs-cell small{font-size:10px;color:#607990;font-weight:850}

.gs-summary{flex:0 0 53px;background:#f2f7ff;border-radius:11px;border:1px solid #dce8f7;display:flex;align-items:center;justify-content:center;gap:13px;padding:7px 10px;text-align:center;color:#3f6086;font-size:12px;font-weight:850}

.gs-summary b{color:#315d95}
</style>

function sceneSVM(){
const points=[[1,1,0],[2,1,0],[1,3,0],[2,2,0],[3,1,0],[0,2,0],[4,3,1],[5,3,1],[4,4,1],[3,4,1],[5,5,1],[2,4,1]];
const px=x=>64+x*84,py=y=>272-y*42;
// Place the boundary between integer-valued sample positions, never through a point center.
// 將分界線放在整數座標之間，避免穿過任何樣本點的中心。
const boundary=svmBorder+0.5;
let miss=0;
let out='';
for(let n=0;n<=6;n++){
out+=line(px(n),py(0),px(n),py(6),'#e5ecf5',1)+line(px(0),py(n),px(6),py(n),'#e5ecf5',1);
}
// Draw the boundary first so no line is painted over the samples.
// 先畫分界線，再畫樣本點，讓線條不會覆蓋圓點。
const startX=Math.max(0,boundary-6),endX=Math.min(6,boundary);
out+=line(px(startX),py(boundary-startX),px(endX),py(boundary-endX),'#538a70',4);
for(const [x,y,v] of points){
// Use the same side-of-boundary rule for blue and orange samples.
// 藍色與橘色樣本使用同一套分界線判定規則。
const predicted=x+y>boundary?1:0;
if(v!==predicted)miss++;
out+=`<circle cx="${px(x)}" cy="${py(y)}" r="12" fill="${v?'#eda75f':'#6fa3e5'}" stroke="${v!==predicted?'#b74438':'#fff'}" stroke-width="${v!==predicted?4:2}"/>`;
}
out+=text(335,300,'連結數 →',12,'#6c8197')+text(16,32,'急迫字詞',12,'#6c8197',800,'start');
return svg(out,674,314)+`<div class="actions"><span class="control-text">移動邊界</span><input type="range" min="3" max="9" value="${svmBorder}" oninput="svmBorder=Number(this.value);render()"><span class="control-text">錯分 <b>${miss}</b> 個點</span></div><div class="info">綠線放在點與點之間；兩種顏色都依圓點中心位於哪一側判斷，紅框代表錯分。</div>`;
}

 const row=Math.floor(gridChoice/3),col=gridChoice%3;
 const body=depths.map((depth,i)=>`<span class="gs-head gs-rowhead">深度 ${depth}</span>`+
  counts.map((n,j)=>{const k=i*3+j;return `<button class="gs-cell ${k===bestIndex?'winner':''} ${k===gridChoice?'selected':''}" onclick="gridChoice=${k};render()" aria-label="深度 ${depth}、${n} 棵樹，驗證正確率 ${scores[i][j]}%"><strong>${scores[i][j].toFixed(1)}%</strong><small>${k===bestIndex?'最佳平均分數':'點選比較'}</small></button>`}).join('')).join('');
 return `<div class="gs-steps"><span>① 設候選超參數</span><span>② Train 內做 3 折驗證</span><span>③ 選平均分數最高</span></div>`+
  `<div class="gs-table"><span class="gs-head">深度 ↓　棵數 →</span>${counts.map(n=>`<span class="gs-head">${n} 棵樹</span>`).join('')}${body}</div>`+
  `<div class="gs-summary"><span>選到：<b>深度 ${depths[row]}、${counts[col]} 棵樹</b></span><span>驗證平均：<strong>${scores[row][col].toFixed(1)}%</strong></span><span>${gridChoice===bestIndex?'目前這 9 組中最佳':'綠色格是最佳'}</span></div>`;
}
function scenePredict(){const m=mailExamples[chosenMail];return `<div class="mailbox">${mailExamples.map((x,i)=>`<button class="mail ${i===chosenMail?'active':''}" onclick="selectMail(${i})"><span class="mhead">新郵件 ${i+1}</span><strong>${esc(x.title)}</strong><small>連結 ${x.link_count} · 緊急用語 ${x.urgent_words}</small></button>`).join('')}</div><div class="statstrip"><div class="stat"><label>寄件者</label><b>${m.sender_known?'已知':'陌生'}</b></div><div class="stat"><label>模型預測</label><b class="${m.pred?'orange':'green-t'}">${m.pred?'1 垃圾':'0 正常'}</b></div></div>`}
function quizScene(id){let bank=quizBank[id],i=quizPos[id],q=bank[i],solved=quizSolved[id][i]===true;let msg=quizFeedback[id]||'選擇答案；答錯會得到提示，答對才顯示解析。';return `<div class="quiz"><div class="counter-q">第 ${i+1} / 3 題</div><h3>${esc(q.q)}</h3><div class="options">${q.opts.map((a,j)=>`<button class="${quizState[id]&&Number(quizState[id])===j+1?(solved?'correct':'wrong'):''}" onclick="answer('${id}',${j})">${String.fromCharCode(65+j)}　${esc(a)}</button>`).join('')}</div><div class="feedback ${quizState[id]?(solved?'correct':'wrong'):''}">${esc(msg)}</div><div class="quiz-bottom"><button onclick="quizMove('${id}',-1)" ${i===0?'disabled':''}>上一題</button><span class="control-text">完成 ${Object.keys(quizSolved[id]).filter(x=>quizSolved[id][x]).length} / 3 題</span><button onclick="quizMove('${id}',1)" ${!solved?'disabled':''}>${i===2?'已完成':'下一題'}</button></div></div>`}
function answer(id,i){let q=quizBank[id][quizPos[id]];if(quizSolved[id][quizPos[id]])return;quizState[id]=String(i+1);if(i===q.ans){quizSolved[id][quizPos[id]]=true;quizFeedback[id]='答對了！'+q.exp}else{quizFeedback[id]='再試一次：'+q.hint}render()}
function quizMove(id,step){let i=quizPos[id];let n=Math.min(2,Math.max(0,i+step));if(n>i&&!quizSolved[id][i])return;quizPos[id]=n;quizFeedback[id]='';quizState[id]='';render()}
function draw(s){switch(s.kind){case'mail':return sceneMail();case'table':return sceneTable();case'confusion':return sceneConfusion();case'leakage':return sceneLeakage();case'tree':return sceneTree();case'votes':return sceneVotes();case'bars':return sceneBars();case'folds':return sceneFolds();case'svm':return sceneSVM();case'gridsearch':return sceneGridSearch();case'quiz1':return quizScene('quiz1');case'quiz2':return quizScene('quiz2')}}
function render(){const s=slides[page],deck=$('#deck');deck.innerHTML=`<header><div class="brand"><span class="avatar"><img src="${logo}" alt="課程原有角色頭像"></span><div><strong>教學主題｜資料預測與模型實作</strong><small>看圖操作 · 說出結果 · 用程式驗證</small></div></div><span class="sectionchip">第 ${s.part} 節 · 實作與觀察</span></header><div class="heading"><span class="eyebrow">${esc(s.tag)}</span><h1>${esc(s.title)}</h1><p>${esc(s.sub)}</p></div><div class="layout"><div class="visual"><div class="scene-label">${esc(s.key)}<span>${s.kind.includes('quiz')?'即時練習':'可操作圖解'}</span></div><div class="scene">${draw(s)}</div></div><div class="side"><div class="tag">這頁只記一件事</div><h2>${esc(s.side)}</h2><ul>${s.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul><div class="hint">${esc(s.hint)}</div></div></div><footer><span>← / → 切換投影片</span><div class="progress"><i style="width:${(page+1)/slides.length*100}%"></i></div><span class="pages">${page+1} / ${slides.length}</span><div class="nav"><button onclick="goto(page-1)" ${page===0?'disabled':''}>← 上一頁</button><button class="next" onclick="goto(page+1)" ${page===slides.length-1?'disabled':''}>下一頁 →</button></div></footer>`;resize()}
function goto(i){if(i<0||i>=slides.length)return;page=i;render()}
function resize(){let scale=Math.min(innerWidth/1280,innerHeight/720);$('#deck').style.transform=`translate(-50%,-50%) scale(${scale})`}
addEventListener('resize',resize);addEventListener('keydown',e=>{if(e.target?.tagName==='INPUT')return;if(e.key==='ArrowRight'){e.preventDefault();goto(page+1)}if(e.key==='ArrowLeft'){e.preventDefault();goto(page-1)}});
window.__lessonTest={slides,goto,quizBank,get page(){return page},get chosenMail(){return chosenMail}};
render();
</script></body></html>
