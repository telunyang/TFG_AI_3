/* Reference-aligned classroom design: calm textbook colors and centered hierarchy. */
:root{color-scheme:light;--paper:#fbf7ee;--ink:#2d3142;--muted:#6d7485;--navy:#2a5aa5;--blue:#6ca8ff;--mint:#d8f4ea;--gold:#ffe2a8;--rose:#ffd4c7;--green:#58a687;--teal:#3568b2;--coral:#e59c65;--line:#e1e7ef;--positive:#25977b;--negative:#db886f;font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",Arial,sans-serif}
html,body{background:linear-gradient(180deg,#f5efe3,#ece8f5);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",Arial,sans-serif}
body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(rgba(112,126,160,.1) 1px,transparent 1px);background-size:16px 16px;opacity:.6;pointer-events:none}
#deck{width:1280px;height:720px;background:linear-gradient(180deg,#fffdf8,#fbf7ee);border:1px solid rgba(100,110,140,.15);border-radius:24px;box-shadow:0 18px 48px rgba(39,53,80,.14)}

.header{position:absolute;left:58px;right:58px;top:27px;height:56px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.brandline{display:flex;align-items:center;gap:14px;letter-spacing:0}
.brand-icon{width:46px;height:46px;flex:0 0 46px;border:1px solid rgba(110,130,170,.18);border-radius:16px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 8px 18px rgba(78,107,164,.14)}
.brand-icon img{width:100%;height:100%;display:block;object-fit:cover}
.brand-text{display:flex;flex-direction:column;gap:2px}
.brand-text strong{font-size:17px;color:#2f384f;font-weight:900;line-height:1.2}
.brand-text small{font-size:12px;color:#798398;line-height:1.4}
.lesson{background:#effbf6;color:#287d63;border-radius:999px;padding:9px 14px;font-weight:800;font-size:13px;border:1px solid rgba(96,121,173,.18);box-shadow:0 4px 10px rgba(81,103,147,.06)}
.slideTitle{position:absolute;left:80px;right:80px;top:100px;text-align:center;z-index:2}
.eyebrow{font-size:12px;letter-spacing:2px;color:#8b7339;font-weight:900;line-height:1.3}
.slideTitle h1{font-size:38px;line-height:1.16;margin:8px auto 7px;color:#26324a;letter-spacing:.2px;font-weight:900;max-width:1160px}
.slideTitle h1.medium{font-size:34px}.slideTitle h1.compact{font-size:30px}
.slideTitle p{color:#727b8d;font-size:16px;margin:0;line-height:1.35}
.stage{position:absolute;left:58px;right:58px;top:202px;height:389px;display:grid;grid-template-columns:minmax(0,738px) minmax(0,404px);gap:22px}
.visual-shell,.side{height:100%;min-height:0;border-radius:24px;border:1px solid rgba(122,137,169,.18);box-shadow:0 12px 30px rgba(37,55,85,.08);overflow:hidden}
.visual-shell{position:relative;display:flex;flex-direction:column;background:linear-gradient(180deg,#fff,#fffcf5);border-color:rgba(122,137,169,.18)}
.visual-shell::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(90deg,#ffd89b,#a9e4d0,#a9c8ff);z-index:2}
.visual-head{height:auto;min-height:0;flex:0 0 40px;padding:12px 19px 3px;display:flex;align-items:center;justify-content:space-between}
.visual-head b{font-size:13px;letter-spacing:1.2px;font-weight:900;color:#56667c}
.visual-tag{font-size:11px;font-weight:900;color:#4361a8;background:#f1f6ff;border:1px solid #dde8f8;padding:5px 11px}
.scene{position:relative;height:auto;flex:1;min-height:0;padding:0 11px 3px;overflow:hidden}
.scene>svg,.scene .scene-inner{height:100%;width:100%}
.control-strip{position:relative;left:auto;right:auto;bottom:auto;min-height:0;height:auto;flex:0 0 47px;padding:6px 10px;gap:9px;justify-content:center;border-top:1px solid #e9eef5;background:rgba(255,255,255,.72);border-radius:0 0 23px 23px}
.control-strip label{color:#536782;gap:8px;font-size:12.6px;font-weight:850;white-space:nowrap}
.control-strip input[type=range]{width:165px;accent-color:#456fbc}
.control-strip select{font-size:12.5px;padding:6px 8px;border-color:#cad9ee;color:#385f9a}
.control-strip button,.btn{background:#eef4ff;color:#345fae;border:1px solid #dce7f7;border-radius:10px;font-size:12px;padding:7px 10px;min-width:0;font-weight:900;box-shadow:none}
.control-strip button:hover,.btn:hover{background:#dceaff}
.readout{color:#265ba1;font-size:14px;white-space:nowrap}
.side{display:flex;flex-direction:column;gap:9px;background:linear-gradient(180deg,#fffefb,#f8fbff);padding:17px 20px 16px}
.label{font-size:12px;letter-spacing:1.1px;color:#4261a8;font-weight:900}
.side-idea{font-size:17px;line-height:1.53;font-weight:760;color:#455066;letter-spacing:0}
.side-divider{background:#e4eaf4;margin:0}
.side-bullets{margin:0;padding:0;list-style:none;min-height:0;overflow:visible}
.bullet{font-size:13.5px;line-height:1.5;color:#526278;gap:7px;margin:0 0 6px}
.bullet-dot{width:7px;height:7px;margin-top:7px;border-radius:50%;background:#f0bf79}
.reference-example{padding:9px 11px;border-radius:13px;background:#fff5e8;border:1px solid rgba(222,191,135,.35);font-size:12.3px;line-height:1.5;color:#67583d;min-height:0}
.reference-example strong{font-weight:900;color:#926a37}
.q-card{margin-top:auto;padding:10px 12px;border-radius:14px;background:#edf8f4;border:1px solid rgba(141,212,184,.45);border-left:1px solid rgba(141,212,184,.45);color:#266b55;font-size:12.6px;font-weight:790;line-height:1.5}
.q-card strong{display:inline;font-size:12.6px;color:#266b55;margin-right:4px}
.side-step{display:none}
.stepzone{position:absolute;left:58px;right:58px;top:601px;height:48px;display:flex;gap:10px;align-items:stretch}
.steps{display:flex;gap:10px;align-items:stretch;width:100%;flex:1}
.step-pill{max-width:none;min-width:0;flex:1;height:48px;display:flex;gap:8px;align-items:center;padding:7px 12px;background:rgba(255,255,255,.78);border:1px solid rgba(125,140,170,.18);border-radius:14px;color:#596477;font-size:12.6px;font-weight:800;white-space:normal;text-overflow:clip;overflow:hidden;opacity:.22;filter:blur(1px);transform:translateY(5px);transition:opacity .25s,transform .25s,filter .25s}
.step-pill span{flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:50%;background:#eff4ff;color:#2d5ba6;font-size:11px;font-weight:900}
.step-pill.active{opacity:1;filter:none;transform:none;color:#234f9f;background:#eef5ff;border-color:#cfe0ff;box-shadow:0 6px 13px rgba(86,119,179,.12)}
.step-pill.done{opacity:1;filter:none;transform:none;color:#596477;background:#fff;border-color:#d9e4ef}
.footer{position:absolute;left:58px;right:58px;bottom:11px;height:53px;border-top:1px solid rgba(124,140,170,.18)}
.footer-top{height:0;position:static}
.navbuttons{position:absolute;right:0;bottom:4px;display:flex;gap:8px;margin:0}
.navbuttons button{border-radius:12px;border:1px solid rgba(124,140,170,.18);background:#fff;color:#54667f;padding:9px 12px;font-weight:900;font-size:12px}
.navbuttons .next{background:#345fae;border-color:#345fae;color:#fff}
.footer-bottom{height:45px;width:calc(100% - 284px);display:flex;align-items:center;gap:14px;color:#8995a9;font-size:11px}
.track{height:5px;background:#e7e9ef;border-radius:999px;flex:1}
.bar{background:linear-gradient(90deg,#f2c66d,#6bb394,#5b8be8)}
.counter{position:absolute;right:133px;bottom:17px;min-width:96px;text-align:right;font-size:12px;color:#55657e}
.stat{border-color:#e2e9f5;border-radius:13px;background:#fff}.stat b{color:#2758a2}.stat.emphasis{background:#ecf7f1;border-color:#a8dec7}
.formula-line{color:#315da4}
.data-code{height:267px;background:#24324a;color:#eaf1fa;font-size:11.7px;line-height:1.46;padding:13px 16px;margin:0 5px;border-radius:15px;white-space:pre;overflow:auto}
.code-annotations{font-size:11.8px;padding:4px 12px}
.quiz-box{margin:4px 12px 0;padding:10px 12px;border-radius:16px}
.quiz-progress{font-size:12px;color:#315da4;margin-bottom:4px}
.quiz-question{font-size:18px;line-height:1.35;min-height:35px;margin-bottom:8px}
.answers{gap:7px}
.answer{min-height:47px;font-size:13.6px;line-height:1.3;padding:9px 11px;border-radius:11px}
.quiz-feedback{font-size:11.8px;line-height:1.35;padding:7px;margin-top:6px;min-height:34px}
.quiz-controls button{padding:5px 11px;font-size:12px}
.modal{background:rgba(29,38,57,.68)}.modal-panel{width:860px;max-height:620px;background:#fff;padding:24px 28px;border-radius:24px}.modal-head h2{color:#26344d}.modal-close{background:#eef4ff;color:#315baf}.jump{background:#f4f8ff;color:#456180;border-color:#dce6f5}.jump small{color:#345fae}
.screen-status{display:none}

/* Open each lesson with a question-led teaching scene, matching the provided example. */
.scene:has(.cover-layout){padding:0 14px 3px}
.cover-layout{display:grid;grid-template-columns:1.03fr .97fr;gap:13px;height:100%;min-height:0}
.cover-question{background:#fff;border:1px solid #e2e9f3;border-radius:18px;box-shadow:0 6px 14px rgba(62,86,120,.06);display:flex;flex-direction:column;justify-content:center;padding:18px;gap:8px;min-width:0}
.cover-lesson{font-size:11px;letter-spacing:.5px;font-weight:900;color:#446fae}
.cover-prompt{font-size:13px;font-weight:900;color:#4375bb;margin-top:2px}
.cover-question h2{font-size:22px;line-height:1.35;margin:1px 0 2px;color:#293e60}
.cover-question p{font-size:13px;line-height:1.6;margin:0;color:#576b84}
.cover-callout{font-size:12.2px;line-height:1.5;font-weight:850;background:#fff2db;color:#885d2b;border-radius:12px;padding:8px 10px}
.cover-agenda{min-width:0;display:flex;flex-direction:column;gap:8px;justify-content:center}
.cover-agenda-header{font-size:16px;font-weight:900;color:#475f7d}
.cover-item{flex:1;min-height:0;background:#fff;border:1px solid #e0e8f2;border-radius:14px;padding:8px 10px;display:flex;gap:9px;align-items:center;transition:box-shadow .2s}
.cover-item.focus{border-color:#b4cfef;box-shadow:0 0 0 2px rgba(108,168,255,.15)}
.cover-num{flex:0 0 32px;width:32px;height:32px;display:grid;place-items:center;font-weight:900;font-size:12px;color:#3868af;border-radius:10px;background:#e9f2ff}
.cover-item:nth-child(3) .cover-num{background:#fff0d9;color:#b07b32}
.cover-item:nth-child(4) .cover-num{background:#e5f7ee;color:#327c60}
.cover-agenda-text{min-width:0;display:flex;flex-direction:column;gap:2px}
.cover-agenda-text strong{font-size:13.6px;color:#3a526d;line-height:1.3}
.cover-agenda-text small{font-size:11px;color:#77879d;line-height:1.35}
.footer-bottom{width:calc(100% - 223px)}.counter{position:static;flex:0 0 115px;min-width:115px;text-align:right;font-size:11px}.footer-bottom .track{min-width:100px}
/* Keep navigation and legends separate from diagrams. */
.control-strip{gap:15px;flex-wrap:nowrap}
.control-strip label{display:flex;align-items:center;gap:8px;white-space:nowrap}
.control-strip select{min-width:110px;font-size:13px}
.scene svg .svgtext{paint-order:stroke;stroke:rgba(255,255,255,.72);stroke-width:.45px;stroke-linejoin:round}

.kernel-map-wrap{height:100%;display:flex;flex-direction:column;justify-content:flex-start;gap:0;min-height:0}
.kernel-map-card{width:100%;height:100%;min-height:0;background:#fff;border:1px solid #dfe7f1;border-radius:16px;box-shadow:0 6px 14px rgba(62,86,120,.06);padding:10px 12px 8px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;overflow:hidden}
.kernel-map-image{display:block;flex:none;width:100%;height:auto;max-height:204px;object-fit:contain;border-radius:12px;background:#fff;border:1px solid #e0e8f0}
.kernel-map-callouts{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:stretch}
.kernel-callout{min-width:0;min-height:65px;background:#f7faf8;border:1px solid #dde8e3;border-radius:13px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;opacity:.5;transform:none;transition:opacity .18s,border-color .18s}
.kernel-callout.active{opacity:1;transform:none;border-color:#bed8d0;box-shadow:0 0 0 2px rgba(124,184,164,.10)}
.kernel-callout strong{font-size:13px;line-height:1.2;color:#355a70}
.kernel-callout p{margin:0;font-size:11.5px;line-height:1.4;color:#536779}

/* 2026-10 revised classroom interaction: arrows change slides, all concept notes appear immediately. */
.step-pill,.step-pill.active,.step-pill.done{opacity:1!important;filter:none!important;transform:none!important;background:rgba(255,255,255,.88)!important;border-color:#d9e4ef!important;color:#52647b!important;box-shadow:none!important;cursor:default!important;pointer-events:none}
.step-pill.active{background:#edf5ff!important;border-color:#cadcf4!important;color:#294f91!important}
.stepzone:has(+.footer) .step-pill{line-height:1.3}
.side{gap:7px;padding:14px 17px 13px}
.side-idea{font-size:16px;line-height:1.46}
.bullet{font-size:12.7px;line-height:1.43;margin:0 0 4px}
.reference-example{font-size:11.9px;line-height:1.42;padding:7px 9px}
.q-card{font-size:12.1px;line-height:1.4;padding:8px 9px}
.mode-choice{background:#f1f5ff!important;color:#3663a4!important;border:1px solid #cbdcf3!important;white-space:nowrap}
.mode-choice.selected{background:#315fae!important;color:#fff!important;border-color:#315fae!important;box-shadow:0 3px 8px rgba(51,92,171,.16)!important}
.control-strip:has(.mode-choice){gap:6px;padding:5px 8px;overflow:hidden}
.control-strip:has(.mode-choice) label{gap:3px;font-size:11px}
.control-strip:has(.mode-choice) select{font-size:10.8px;min-width:60px;padding:5px 4px}
.control-strip:has(.mode-choice) button{font-size:11.1px;padding:6px 7px}
.control-strip:has(.mode-choice) .readout{font-size:12px}
.quiz-box{height:auto;margin:3px 8px 0;padding:8px 12px 7px;display:flex;flex-direction:column;gap:5px}
.quiz-progress{margin:0}.quiz-question{font-size:17px;margin:0;min-height:0;line-height:1.38}
.answers{gap:6px;grid-template-columns:1fr 1fr}
.answer{min-height:44px;font-size:13px;padding:7px 11px}
.quiz-feedback{padding:8px 10px;font-size:12px;line-height:1.4;min-height:48px;margin:0}
.quiz-feedback.is-wrong{background:#fff4e6;color:#8b632a;border:1px solid #ecd5a6}
.quiz-feedback.is-correct{background:#eaf8f0;color:#236c55;border:1px solid #b8dfc9}
.quiz-controls button{padding:5px 14px}
.scene:has(.quiz-box){overflow:visible}
.scene:has(.quiz-box)>.quiz-box{max-height:100%}
.control-strip:has(.mode-choice) .scene-control-hint{font-size:11px}

/* English: Fit six metric concepts and an optional extension slider in one navigation strip. */
/* 中文：分類指標與門檻延伸共用一張投影片，操作控制不得擠出邊界。 */
.control-strip:has([data-mode="metricKind"]){gap:4px;padding:5px 6px}
.control-strip:has([data-mode="metricKind"]) .mode-choice{font-size:10.3px;padding:6px 5px;letter-spacing:0}
.control-strip:has([data-mode="metricKind"]) label{font-size:10.6px;gap:3px}
.control-strip:has([data-mode="metricKind"]) input[type="range"]{width:104px}
/* English: Keep all explanatory text legible even for longer combined concepts. */
/* 中文：側欄採安全高度與內部捲動，避免內容互相遮蓋。 */
.side{min-height:0;overflow-y:auto;scrollbar-width:thin}
.side .side-bullets{flex:0 0 auto}

const slides = [{"l":1,"m":2,"kind":"cover","title":"分類模型準不準？從校園信箱開始","sub":"第 1 節｜先看預測錯在哪裡，再比較不同分類模型","idea":"學校信箱每天收到活動通知，也可能收到垃圾郵件。AI 要幫忙分類，但「猜對多少」還不足以判斷是否好用。","bullets":["從真實信件與模型預測，分清四種結果","同一份資料比較 Accuracy、Precision、Recall、F1","觀察 SVM 與決策樹如何分出兩類"],"q":"如果一封重要的校慶通知被誤丟到垃圾郵件匣，你最在意哪種錯誤？","steps":["觀察模型的輸入與預測","將預測與真實答案比對","提出「預測好」的衡量標準"],"note":"重點提醒：能輸出分類，不代表分類結果可靠。今日所有機率資料若未特別註明，均為教學假設。"},{"l":1,"m":3,"kind":"matrix","title":"混淆矩陣：預測和真實有哪四種結果？","sub":"將 TP、FP、FN、TN 放進同一張表；正類設定為「垃圾郵件」","idea":"混淆矩陣（Confusion Matrix）把「真實類別」和「模型預測」交叉對照。以垃圾郵件為正類：TP＝True Positive（抓對）、FP＝False Positive（誤報）、FN＝False Negative（漏抓）、TN＝True Negative（排除正確）。","bullets":["真實正類＝TP＋FN；預測正類＝TP＋FP","FP：正常郵件誤判垃圾；FN：垃圾郵件被放過","這四格會用來計算接下來的四項評估指標"],"q":"一封真正的垃圾郵件被誤判「正常」，應該記入哪一格？","steps":["先看預測軸與真實軸","顯示正確的兩格","強調 FP／FN 的不同錯誤"],"note":"本例 16 筆資料，門檻 0.50，結果是 TP=5、FP=3、FN=2、TN=6；使用和後續指標一致的資料。"},{"l":1,"m":3,"kind":"metric","metric":"all","title":"四項分類指標：Accuracy、Precision、Recall、F1","sub":"四項指標同頁比較；也可切換「門檻延伸」觀察 Precision／Recall 取捨","idea":"四個指標回答的是四種不同問題：Accuracy 看整體答對；Precision 看預測正類有多可信；Recall 看真正正類找回多少；F1 同時考慮 Precision 與 Recall。","bullets":["Accuracy＝(TP＋TN)／全部；類別不平衡時可能失真","Precision 看 FP；Recall 看 FN；F1＝2PR／(P＋R)","依據任務選評估重點，不能只挑看起來最高的數字"],"q":"校園信箱中，若「漏掉垃圾信」與「誤擋重要信」都在意，可同時參考哪個指標？","steps":["四項指標各回答不同的問題","同一份混淆矩陣計算四個分數","延伸：門檻只影響預測分組，重點仍是 Precision／Recall"],"note":"16 筆假設的信件分數，按需切換門檻延伸，非獨立教學頁。"},{"l":1,"m":3,"kind":"imbalance","title":"Accuracy 的陷阱：96% 也可能全漏掉","sub":"100 封校園信，只有 4 封垃圾郵件：全部猜正常會怎樣？","idea":"當某一類很少時，模型可以只猜多數類來獲得很高的 Accuracy。若 100 封中 4 封垃圾，全部猜正常仍有 96% 準確率，但 Recall＝0%。","bullets":["全部猜正常：TN＝96、FN＝4、TP＝0、FP＝0","Accuracy＝96%，卻一封垃圾也沒找出來","類別不平衡時，搭配混淆矩陣、Precision、Recall、F1 才公平"],"q":"如果模型「96% 正確」但一封垃圾信都抓不到，它適合單獨當過濾器嗎？","steps":["看見 96 個正常與 4 個垃圾","全部預測正常並計算 Accuracy","揭示 4 個完全被漏抓的正類"],"note":"Precision 因完全沒有預測正類而不定義；使用 scikit-learn 可顯式設定 zero_division=0 以便報表呈現。"},{"l":1,"m":3,"kind":"scenario","title":"不同情境，該優先看哪一種錯誤？","sub":"校園重要通知被誤擋 vs. 危險警示被漏掉","idea":"好的分類模型不只是分數高，更要考慮錯誤代價。校園重要郵件被誤攔，重點是控制 FP；校園安全警示漏掉，則要降低 FN。","bullets":["FP 代價高：重視 Precision，避免誤報太多","FN 代價高：重視 Recall，避免漏掉真正警訊","沒有一項指標適合所有情境；必要時多項一起比較"],"q":"校園防災警報「寧可多檢查，也不要漏掉」，應更重視 Precision 還是 Recall？","steps":["比較兩個案例的 FP 成本","比較 FN 成本","將業務目標連回指標"],"note":"生活情境僅為風險取捨的教材例子；沒有單一指標能代表所有任務。"},{"l":1,"m":3,"kind":"svmMerge","title":"SVM 與支援向量：誰決定分類邊界？","sub":"同一張圖切換「間隔與 C」及「重要資料點」","idea":"軟間隔 SVM 不只把邊界附近的點列為支援向量：進入間隔、甚至分錯的訓練點也可能是支援向量，並影響邊界。","bullets":["金色圈是模型實際的支援向量；紅圈是被錯分的點","軟間隔中「被錯分」不等於「不是支援向量」","可點選紅圈，再切換 C 看哪些點被選中"],"q":"為何被分錯的點仍可能是支援向量？","steps":["看兩類資料與 SVM 的間隔","改變 C，觀察邊界與違規點","點選一個樣本，了解支援向量"],"note":"實際使用 sklearn SVC(kernel=linear) 在 14 筆資料上訓練，視覺化其 decision_function=0 與 ±1。C=0.1 時全部 14 筆都是 scikit-learn 回傳的 support_，這在軟間隔強正則化下可以發生，不應宣稱支援向量僅是剛好踩到金色虛線的點。"},{"l":1,"m":2,"kind":"kernelmap","title":"Kernel Trick：為什麼能做彎曲的分類？","sub":"原始平面不容易分開，換個特徵空間再找界線","idea":"Kernel Trick（核技巧）讓 SVM 能以「特徵空間中的相似度」處理非線性問題。概念圖展示原始資料、特徵映射與彎曲分界；實際 Kernel SVM 不必逐筆顯式建立高維座標。","bullets":["原本的二維資料可能無法用直線分開","映射到新特徵空間後，可能更容易找線性邊界","回看原始平面，就可能得到彎曲的分類區域"],"q":"校園社團分組的兩群資料交錯時，直線分不開，可以考慮什麼方法？","steps":["先看原始空間：直線切不開","映到高維特徵空間：可用平面分隔","映回原始空間：形成彎曲邊界"],"note":"此頁改為本投影片自繪示意圖：原始空間 → 特徵空間 → 映回原始空間。圖像只用來說明 kernel trick 的概念流程；實務中常直接以 kernel function 間接完成運算。"},{"l":1,"m":4,"kind":"xor","title":"Linear 與 RBF：不同的分類邊界","sub":"同一批資料，切換直線與非線性 Kernel","idea":"Linear Kernel 形成線性分界；RBF（徑向基底函數，Radial Basis Function）Kernel 可以形成彎曲邊界。切換時資料點不應改變，只比較分類區域。","bullets":["Linear：適合大致能用直線區分的兩群","RBF：可處理彎曲或局部的分類邊界","RBF 不一定更好，仍需驗證新資料的表現"],"q":"四個角落的兩種顏色交錯時，一條直線通常能完美分開嗎？","steps":["先看交錯資料","切換 Linear／RBF 觀察分類底色","解讀模型在訓練資料的分類結果"],"note":"底色依真實 sklearn SVC 的決策函數算出，使用合成 XOR 訓練資料，不代表實測泛化表現。"},{"l":1,"m":4,"kind":"tree","title":"Decision Tree：像問問題一樣做分類","sub":"兩個特徵軸加上數值刻度（0 題起算、出席率以百分比表示），動手改變切分條件","idea":"決策樹（Decision Tree）像「如果……就……」的流程圖：每個節點問一個問題，依據特徵切分資料，最後的葉節點給出預測類別。","bullets":["橫軸：練習題數，從 0 題開始","縱軸：出席率（%），從 55% 到 95%","改變切分線，觀察葉節點與 Gini／Entropy"],"q":"如果只問一次「練習題數至少 5 題嗎？」，所有同學都一定能正確分類嗎？","steps":["看 12 位同學的兩種標籤","移動切分線並計算 Gini","比較切分前後的不純度"],"note":"此頁用合成教學資料，並以 0 表示最純、Gini 最大 0.5／Entropy 最大 1.0 表示最混雜。切分後若不純度下降，代表資料被切得更單純。"},{"l":1,"m":4,"kind":"depth","title":"樹越深，為什麼反而可能考不好？","sub":"比較簡單與複雜的分類邊界：訓練好不等於泛化好","idea":"決策樹深度（max_depth）愈大，通常愈容易把訓練資料切得很細，但也可能把偶然雜訊記住。要用驗證資料決定適合的複雜度。","bullets":["深度小：規則太簡單，可能欠擬合","深度太大：貼著訓練資料，可能過度擬合","模型是否可靠，要看未參與訓練的資料"],"q":"一位同學背熟練習題，卻考不好新題：較像欠擬合還是過度擬合？","steps":["同時看深度 1 與目前設定","逐步加深觀察新切分區塊","比較同一資料的 Train／Test 正確率"],"note":"根據 sklearn make_moons 合成資料，預先分割訓練／測試並實際訓練五種 max_depth。"},{"l":1,"m":3,"kind":"quiz","title":"第 1 節：3 題快速檢核","sub":"請先作答，再看理由","idea":"完成這 3 題，確認自己能辨認分類錯誤、選擇指標，以及理解 SVM／決策樹。","bullets":["直接點選答案，不用方向鍵換題","答錯會提供提示，允許重新作答","答對後提供完整解釋，右方向鍵直接進入下一節"],"q":"選完一題，按下方「下一題」。","steps":["第 1 題｜分類錯誤類型","第 2 題｜指標選擇","第 3 題｜模型特性"],"note":"答案依題目動態核對；也可先比較不同選項的判斷理由。","quiz":[{"q":"實際是垃圾郵件，模型卻判成正常郵件，屬於哪一格？","choices":["TP","FP","FN","TN"],"correct":2,"why":"垃圾郵件是正類，正常郵件是負類。真實為垃圾（正）但模型判正常（負），就是 False Negative（FN，假陰性／漏抓）；FP 則是正常郵件被誤判成垃圾。","hint":"先找出「真實」欄：它確實是垃圾信，所以真實為正；再看模型把它判成正常，所以預測為負。"},{"q":"若任務的首要目標是減少漏掉正類，應特別關注哪項指標？","choices":["Recall","訓練集 Accuracy","模型參數數量","特徵平均數"],"correct":0,"why":"Recall（召回率）＝TP／(TP＋FN)，分母是全部真正的正類。因此想減少漏抓，要特別注意 FN 和 Recall；Precision 衡量的則是被判為正類者有多可信。","hint":"想想分母要算「所有真正應該抓到的正類」，以及有幾筆漏掉（FN）。"},{"q":"下列關於 SVM 與決策樹的敘述，哪個正確？","choices":["SVM 一定只能畫直線","決策樹越深一定越準","RBF Kernel 可以形成非線性邊界","支援向量完全不影響邊界"],"correct":2,"why":"RBF Kernel 能讓 SVM 形成彎曲的非線性分類邊界，不只限於直線。決策樹深度愈大未必更好；無論哪種模型，都應以驗證資料檢查泛化能力。","hint":"請找出能處理彎曲分界的模型；不要把「訓練更複雜」誤認為「測試一定更準」。"}]},{"l":2,"m":2,"kind":"cover","title":"選模型，不是比誰剛好考最高分","sub":"第 2 節｜交叉驗證、超參數搜尋與集成學習","idea":"同一種分類模型換一組設定，成績可能不同；同一個模型換一批資料，成績也可能不同。這一節學習更公平的比較方式。","bullets":["Train／Validation／Test 要分工，避免偷看答案","透過 CV 和 Grid Search 選擇超參數","比較 Bagging、Random Forest 與 Boosting"],"q":"如果你一直看同一份模擬考答案來修正方法，最後得分還能當公平評估嗎？","steps":["回顧單次資料切分","看看換驗證資料是否仍穩定","用多模型降低單一模型的侷限"],"note":"第二節為 55 分鐘；使用相同 digits（二元分類：數字 8）作為真實程式實作案例。"},{"l":2,"m":2,"kind":"params","title":"挑選校慶志工：模型參數與超參數","sub":"訓練前設定最多能問幾層；模型再從資料學會「問什麼、如何分類」","idea":"把決策樹想成挑選校慶志工的小幫手：訓練前先設定「最多問幾層問題」（超參數 max_depth），模型才從歷屆資料學出要問哪個特徵、在哪個數字切分，以及每個結果應判哪類（模型參數）。","bullets":["超參數：訓練前設定「最多問幾層」，例如 max_depth＝2","模型參數：訓練後學到「練習題數 ≥ 幾題」等切分規則","調整上限是改變模型的學習空間，不等於手動指定學到的答案"],"q":"如果將決策樹最大深度從 1 改成 3，是否等於已替模型學好切分數字？","steps":["先設定決策樹的深度上限","觀察模型可學到的判斷層次","分清「上限」和「從資料學到的規則」"],"note":"教學避免將 C 和 gamma 誤稱為訓練得到的係數。"},{"l":2,"m":3,"kind":"splitMerge","title":"Train、Validation、Test：如何公平選模型？","sub":"同一頁切換「三份資料分工」與「偷看測試集的後果」","idea":"訓練集（Train）負責學習；驗證集（Validation）用來挑模型與設定；測試集（Test）必須保留到最後，評估對新資料的能力。","bullets":["Train：模型學規則與參數","Validation／CV：比較不同模型與超參數","Test：流程選定之後，才做最後公平評估"],"q":"如果用正式考試答案調整讀書方法，再用同一張考卷證明學得好，公平嗎？","steps":["理解訓練、驗證與測試的角色","比較正確的訓練與評估流程","觀察測試資料洩漏為何不公平"],"note":"避免資料洩漏：標準化、特徵選擇等需在每個 CV fold 的訓練部分內 fit，使用 Pipeline 有幫助。"},{"l":2,"m":4,"kind":"cvMerge","title":"五折交叉驗證：輪流驗證、每折重練","sub":"同一頁切換「25 筆如何分折」與「每折如何重新訓練」","idea":"交叉驗證（Cross-Validation, CV）將訓練資料切成 K 折，輪流拿一折做驗證。每一折必須重新進行訓練前處理及模型訓練，避免資料洩漏。","bullets":["五折：每回合 20 筆訓練、5 筆驗證","同一筆資料恰好做一次驗證，其餘四次可參與訓練","切換圖解：先看資料分配，再看重新 fit 的步驟"],"q":"如果先用全部 25 筆算平均數，再做交叉驗證，會不會偷看到驗證資料？","steps":["把 25 筆教學樣本分成 5 份","選第 1 折當驗證集","按「下一折」走完全部 5 折"],"note":"示意的 25 張卡代表五等分的教學樣本；真實任務中的 stratified 交叉驗證可保留各折標籤比例。"},{"l":2,"m":3,"kind":"cvsummary","title":"五折成績：平均高，還要看穩不穩","sub":"切換「一般波動／某折特別低」，觀察平均值和最低折，推測資料問題","idea":"五折交叉驗證就像五次模擬考：除了平均分數，也要檢查有沒有某一折突然很差。可能原因包含那折的資料較難、類別比例不同、樣本太少或品質問題；單靠一個低分還不能確定原因。","bullets":["切換情境，看其中一折突然掉分會如何拖低平均","檢查每折類別比例與樣本數，避免稀有類別只集中在某折","平均高仍不夠：低分折提醒模型對某些資料可能不穩定"],"q":"若其中一折的 F1 特別低，你會先檢查那一折的哪些資料特性？","steps":["比較五折各自的 F1","切換有低分折的情境","思考可能的資料差異，不能直接下結論"],"note":"使用 digits 8-vs-rest 的 70% 訓練子集，在 sklearn Pipeline 上以 StratifiedKFold(5,shuffle=True,random_state=42) 實算。"},{"l":2,"m":3,"kind":"gridMerge","title":"Grid Search：比較設定，找出適合的組合","sub":"同一頁切換 3×3 熱圖與依驗證分數排序的結果","idea":"網格搜尋（Grid Search）把候選超參數排成格子：每個格子用相同的交叉驗證方法評分，再比較平均 F1。這只是目前資料與搜尋範圍下的最佳設定。","bullets":["此例是 RBF SVM 的 C × gamma，共 3×3＝9 種組合","每格都經過同樣五折 CV，才能公平比較","切換「排名」看選中的格子是否真的較好"],"q":"改成用 Recall 排名時，最高分的那組參數是否可能改變？","steps":["先建立 3 × 3 搜尋網格","選格子，查看該組驗證分數","比較九個格子中的最高分"],"note":"表中數值是 sklearn GridSearchCV 於 digits 8-vs-rest 訓練子集真實實算（共 45 次擬合）。"},{"l":2,"m":3,"kind":"params","title":"SVM 的 C 與 gamma 怎麼影響分類？","sub":"拖曳兩個設定，觀察同一批點的分界形狀","idea":"RBF SVM 的 C 控制訓練錯誤的懲罰；gamma 控制單筆資料影響範圍。把兩個都調得很大，模型可能過度貼合訓練樣本。","bullets":["C：訓練錯誤懲罰；γ：局部影響範圍","比較相同點、相同座標下不同設定的結果","應依交叉驗證選設定，而不是選曲線最花俏的"],"q":"gamma 太大，決策邊界可能變得很彎、只記住訓練資料嗎？","steps":["先觀察 C 的影響","再觀察 gamma 的影響","連結 Grid Search 的驗證分數"],"note":"此頁使用實算 GridSearchCV 分數視覺化，不將網格分數誤當作參數單調性的保證。"},{"l":2,"m":3,"kind":"forestMerge","title":"集成學習入門：先投票，再認識隨機森林","sub":"先知道 Ensemble Learning 的意思，再理解 Bagging 和 Boosting","idea":"集成學習（Ensemble Learning）把多個模型的預測整合在一起。就像班級討論：先讓多人獨立判斷，再用投票決定。隨機森林是一種由許多決策樹組成的集成模型；下一頁 Bagging 再深入解釋「讓樹不一樣」的方法。","bullets":["先切換五位模型投票，了解多數決","再切換七棵決策樹，認識 Random Forest","下一頁才進一步拆解 Bagging 的放回抽樣"],"q":"如果五位同學中三位判斷是垃圾信，集成投票會輸出哪個類別？","steps":["讓七棵樹各自預測","觀察多數票與少數票","手動切換其中一棵樹的投票"],"note":"投票畫面是可操作示意；下一個真實比較頁使用 RandomForestClassifier(n_estimators=120, random_state=42)。"},{"l":2,"m":3,"kind":"bootstrap","title":"Bagging：同一批資料，抽出不同練習卷","sub":"承接集成學習：每棵樹使用不同抽樣，才有機會互相補足","idea":"袋裝集成（Bagging, Bootstrap Aggregating）以放回抽樣建立多份訓練資料，各訓練一個基模型，最後彙整結果，降低依賴單一樣本組合的風險。","bullets":["放回抽樣可重複抽到同一位同學","不同樹看不同訓練樣本組合，再整合預測","隨機森林除了抽樣，通常還隨機挑選候選特徵"],"q":"抽出十筆時有人重複，有人沒出現，這符合放回抽樣嗎？","steps":["觀察原始的八筆資料","按「再抽一次」產生新樣本","看出重複與未抽到的資料"],"note":"使用決定性偽亂數產生有放回抽樣，呈現真實八次抽出的索引；不是只改變一句文字。"},{"l":2,"m":3,"kind":"boosting","title":"Boosting：後一輪補強前一輪沒學會的","sub":"先有集成投票，再比較 Bagging（平行抽樣）與 Boosting（依序補強）","idea":"Boosting（提升法）將多個較簡單的分類器依序組合。以 AdaBoost 為例，前一輪判錯的樣本，在下一輪通常獲得較高權重。","bullets":["觀察紅圈：本輪哪些樣本被判錯","下一輪會提高這些樣本的權重","和 Bagging 的平行抽樣不同，Boosting 強調接續修正"],"q":"如果校園垃圾郵件裡某種新格式一直被漏掉，下一輪應更重視哪些範例？","steps":["看每筆初始權重都相同","按下一輪，加重三筆常錯樣本","觀察不同輪次的權重重分配"],"note":"這裡以可解釋的示意權重更新呈現基本觀念；不宣稱等同 sklearn AdaBoost 或 Gradient Boosting 的精確更新。"},{"l":2,"m":7,"kind":"benchmark","title":"公平比較：決策樹、森林與 SVM","sub":"相同資料、相同評分方式，才知道各模型差在哪裡","idea":"比較 Decision Tree、Random Forest 與 SVM 時，必須用相同的資料切分及指標。集成模型常有幫助，但在不同資料上不保證一定第一。","bullets":["切換模型，比較真實的測試混淆矩陣","同時觀察 Accuracy、Precision、Recall、F1","別把最高 Accuracy 當成唯一勝負標準"],"q":"如果某模型抓得很準卻漏掉很多正類，該再查看哪個指標？","steps":["查看三個模型 F1 直條","切換模型讀取混淆矩陣","把 FP、FN 與 Precision、Recall 對起來"],"note":"預先在本環境以 scikit-learn 依指定 random_state 真實計算。SVM 採訓練子集內 GridSearchCV，所有模型共用相同 Test。"},{"l":2,"m":5,"kind":"results","title":"讀懂模型結果：把分數變成下一步行動","sub":"從數值回到使用情境，而不只是比賽第一名","idea":"模型評估應回答：「哪種錯誤比較難接受？」「這個成績在新資料是否可靠？」「下一步該改資料、特徵還是設定？」","bullets":["看 TP、FP、FN、TN，知道錯誤分布","看 Precision、Recall、F1，對應任務代價","記下切分、設定及指標，讓結果可重現"],"q":"如果學校信箱不能漏掉重要通知，應先追查 FP 還是 FN？","steps":["先看 TP、FP、FN、TN","再看 Precision、Recall 和 F1","思考不同任務的錯誤代價"],"note":"真實數字使用同一份 sklearn 執行結果；避免主張此例的排名可套用所有資料集。"},{"l":2,"m":3,"kind":"quiz","title":"第 2 節：3 題快速檢核","sub":"完成模型選擇與集成學習的理解測試","idea":"三題分別檢查測試集使用時機、五折交叉驗證，以及隨機森林的核心機制。","bullets":["答錯只提供提示，不直接公布答案","答對顯示完整理由，確認真正理解","此頁是第二節最後一張投影片"],"q":"試著在不看解釋前先選答案。","steps":["第 1 題｜資料角色","第 2 題｜交叉驗證","第 3 題｜集成學習"],"note":"最後一題結束即可回到總覽，或複習任意前頁。","quiz":[{"q":"用 Grid Search 選完超參數，保留測試集應在什麼時候使用？","choices":["每調一次 C 就用一次","最後評估時才使用","與驗證集混在一起","先對全部資料 fit 再分割"],"correct":1,"why":"測試集（Test）就像最後的正式考試，用於評估選定流程對未見資料的能力。若每次調 C 都看測試分數，測試集就被拿來選模型，結果不再是公平的新資料評估。","hint":"測試集的功能像正式考試；若拿來反覆修正設定，就不再是全新的題目。"},{"q":"5-fold Cross-Validation 中，每一筆訓練資料通常擔任幾次驗證？","choices":["0 次","1 次","5 次","每次都當驗證"],"correct":1,"why":"五折交叉驗證把訓練資料分成五組：每回合用一組驗證、另外四組訓練。跑完五次後，每筆資料剛好當過一次驗證；每回合應重新進行前處理與模型訓練。","hint":"五折代表輪流換五個驗證組；每筆資料只屬於其中一個驗證組。"},{"q":"下列何者正確描述 Random Forest？","choices":["完全相同的同一棵樹複製多次","多棵樹可由不同抽樣與特徵選擇建立差異","一定比任何 SVM 都好","只會做回歸，不會做分類"],"correct":1,"why":"隨機森林（Random Forest）由多棵決策樹組成，透過不同的資料抽樣與特徵候選，讓各棵樹有所差異，再整合預測。它可以做分類和回歸，但不保證勝過所有單一模型。","hint":"想想「森林」裡的多棵樹為何要不同；全部一模一樣的樹投票有幫助嗎？"}]}];

// Escape authored labels before inserting them into SVG and HTML.
// 在將標籤插入 SVG 或 HTML 前先處理特殊字元。
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');}
function tx(x,y,s,size=15,color=ink,weight=600,anchor='middle'){return `<text class="svgtext" x="${x}" y="${y}" fill="${color}" font-size="${size}" font-weight="${weight}" text-anchor="${anchor}">${esc(s)}</text>`;}
function rc(x,y,w,h,fill,rx=12,stroke='none',sw=1){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;}
function ln(x,y,X,Y,color='#d0deda',width=2,dash=''){return `<line x1="${x}" y1="${y}" x2="${X}" y2="${Y}" stroke="${color}" stroke-width="${width}" ${dash?`stroke-dasharray="${dash}"`:''}/>`;}
function dot(x,y,r,fill,stroke='#fff',sw=2){return `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;}
function sv(inner){return `<svg aria-label="本頁互動圖解" role="img" viewBox="0 0 810 340" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;}
function pct(v){return (100*v).toFixed(1)+'%';}
function statsHTML(entries,mark=''){return `<div class="stat-ribbon">${entries.map(([k,v])=>`<div class="stat ${mark===k?'emphasis':''}"><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join('')}</div>`;}
// Recalculate the confusion matrix directly from probabilities and labels.
// 直接由分數與真實標籤重新計算混淆矩陣。
function calc(t){let tp=0,fp=0,fn=0,tn=0;for(const [p,y] of examples){const yes=p>=t;if(yes&&y)tp++;else if(yes)fp++;else if(y)fn++;else tn++;}const P=tp+fp?tp/(tp+fp):0;const R=tp+fn?tp/(tp+fn):0;return {tp,fp,fn,tn,accuracy:(tp+tn)/examples.length,precision:P,recall:R,f1:P+R?2*P*R/(P+R):0};}
function matrixPicture(c,focus='all',px=135,py=40,cellW=133,cellH=91){

  out+=tx(px+cellW*.5,py+2,'正類',13,muted)+tx(px+cellW*1.5,py+2,'負類',13,muted);
  const lx=px-31;
  out+=tx(lx,py+cellH*.65,'判正',14,muted)+tx(lx,py+cellH*1.65,'判負',14,muted);
  const rotateX=Math.max(12,px-70),rotateY=py+cellH+15;

  const cells=[['TP',c.tp,teal,0,0],['FP',c.fp,coral,1,0],['FN',c.fn,coral,0,1],['TN',c.tn,teal,1,1]];
  for(const [name,n,color,col,row] of cells){
    const x=px+col*cellW,y=py+row*cellH+15;
    const emphasis=focus==='all'||focus===name||(focus==='accuracy'&&(name==='TP'||name==='TN'))||(focus==='precision'&&(name==='TP'||name==='FP'))||(focus==='recall'&&(name==='TP'||name==='FN'))||(focus==='f1'&&name!=='TN');
    out+=rc(x+3,y+3,cellW-7,cellH-8,emphasis?(color===teal?'#e5f6f0':'#fff0e8'):'#f0f3f2',14,emphasis?color:'#e2e9e6',emphasis?2:1);
    out+=tx(x+cellW/2,y+32,name,18,emphasis?color:muted,850)+tx(x+cellW/2,y+66,n,31,emphasis?ink:'#9aa8a9',900);

}

const CODE_A = `# Load a built-in handwritten-digits dataset.
# 載入 scikit-learn 內建手寫數字資料集。
from sklearn.datasets import load_digits
# Split data reproducibly while preserving class proportions.
# 固定亂數種子切分資料，保留各類別的比例。
from sklearn.model_selection import train_test_split
# Import a single decision tree for the baseline.
# 匯入單一決策樹作為比較基準。
from sklearn.tree import DecisionTreeClassifier
# Import a random forest ensemble for comparison.
# 匯入隨機森林集成模型進行比較。
from sklearn.ensemble import RandomForestClassifier
# Import evaluation metrics for predictions.
# 匯入預測結果的評估指標。
from sklearn.metrics import f1_score, confusion_matrix

# Load images as features and digits as labels.
# 取得影像特徵與數字標籤。
X, digits = load_digits(return_X_y=True)
# Use digit 8 as the positive binary class.
# 將數字 8 設為二元分類的正類。
y = (digits == 8).astype(int)
# Hold out 30% of the dataset for the final test.
# 保留 30% 資料作為最後才使用的測試集。
X_train, X_test, y_train, y_test = train_test_split(
    X, y, test_size=0.3, random_state=42, stratify=y
)
# Create models with fixed and reproducible settings.
# 建立使用固定參數且可重現的比較模型。
models = {
    "Decision Tree": DecisionTreeClassifier(max_depth=5, random_state=42),
    "Random Forest": RandomForestClassifier(n_estimators=120, random_state=42),
}
# Fit each model on exactly the same training split.
# 讓各模型在完全相同的訓練資料上學習。
for name, model in models.items():
    # Learn decision rules from training labels.
    # 從訓練資料的標籤學習分類規則。
    model.fit(X_train, y_train)
    # Predict labels of the untouched test data.
    # 預測尚未參與訓練的測試資料。
    pred = model.predict(X_test)
    # Display the F1 score and confusion matrix.
    # 顯示 F1 分數與混淆矩陣。
    print(name, "F1:", f1_score(y_test, pred))
    print(confusion_matrix(y_test, pred, labels=[1, 0]))`;
const CODE_B = `# Keep data scaling and the SVM inside one pipeline.
# 將標準化與 SVM 包成同一個 Pipeline。
from sklearn.pipeline import Pipeline
# Import a feature scaler and SVM classifier.
# 匯入特徵標準化工具與 SVM 分類器。
from sklearn.preprocessing import StandardScaler
from sklearn.svm import SVC
# Import stratified folds and hyperparameter search.
# 匯入分層交叉驗證與超參數搜尋。
from sklearn.model_selection import StratifiedKFold, GridSearchCV

# Standardize within each fold before training the SVM.
# 在每一折的訓練部分進行標準化，再訓練 SVM。
pipe = Pipeline([("scale", StandardScaler()), ("svc", SVC(kernel="rbf"))])
# Search nine candidate C and gamma combinations.
# 搜尋九種 C 與 gamma 的候選組合。
params = {"svc__C": [0.1, 1, 10], "svc__gamma": [0.0005, 0.002, 0.008]}
# Create five reproducible, stratified validation folds.
# 建立五折、固定種子且保留類別比例的驗證流程。
cv = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)
# Rank each parameter setting by mean validation F1.
# 依照每組參數的平均驗證 F1 分數排序。
search = GridSearchCV(pipe, params, scoring="f1", cv=cv)
# Search using training data only, never the test set.
# 只使用訓練資料搜尋參數，絕不使用測試集。
search.fit(X_train, y_train)
# Predict the test set exactly once after selection.
# 選好參數後，才在測試集進行最後預測。
pred = search.predict(X_test)
# Report the selected setting, CV F1, and final Test F1.
# 分開報告最佳參數、交叉驗證 F1 與最終測試 F1。
print("Best params:", search.best_params_)
print("CV F1:", search.best_score_)
print("Test F1:", f1_score(y_test, pred))
print(confusion_matrix(y_test, pred, labels=[1, 0]))`;

function observationFor(s){
 if(s.kind==='metric')return ({tradeoff:'延伸：試拖曳門檻，觀察 Precision／Recall 與 TP、FP、FN、TN 是否同步改變。',all:'四項指標從相同的 TP、FP、FN、TN 計算，但解讀目的不同。',accuracy:'請看混淆矩陣的 TP、TN，及全部樣本的總數。',precision:'比較 TP 與 FP：其中多少「預測正類」判對？',recall:'比較 TP 與 FN：其中多少「真實正類」找到了？',f1:'Precision 與 Recall 其中一項偏低時，F1 也不容易高。'})[state.metricKind]||s.bullets[0];
 if(s.kind==='params'&&s.title.includes('校慶志工'))return `決策樹最大深度設為 ${state.paramDepth} 層；題數、切分位置與預測結果仍須從資料學習。`;
 if(s.kind==='svmMerge')return state.svmView?'看金圈標示的支援向量；點選任一筆樣本可查詢位置與狀態。':'改變 C，觀察同一批樣本的黑色分界線與金色間隔線。';
 if(s.kind==='cvsummary')return state.cvCase?'警訊：某一折特別低，可能是資料難度、比例或品質不同；須檢查，不能直接下結論。':'平均值不代表全部；切換低分情境，觀察第 2 折與平均 F1 變化。';
 if(s.kind==='splitMerge')return state.splitMode?'錯誤流程：依據 Test 分數反覆調整模型；正確流程：最後才測 Test。':'Train 學習、Validation 選設定、Test 留到最後才驗收。';
 if(s.kind==='cvMerge')return state.cvMode?'每一折：先用 20 筆 fit 前處理與模型，再對 5 筆 transform 並驗證。':'五折：每回合 20 筆訓練、5 筆驗證；每筆資料驗證一次。';
 if(s.kind==='gridMerge')return state.gridMode?'排名只使用相同五折的平均 F1；最高不代表所有資料都最好。':'此例 RBF SVM 共 3×3＝9 種 C × gamma 設定。';
 if(s.kind==='forestMerge')return state.forestMode?'七棵樹的多數票決定目前類別；試著點樹改票。':'先認識 Ensemble：五模型多數決 → 七棵樹的森林；下一頁再解析 Bagging。';
 return s.bullets[0]||s.idea;

function updateVisual(){const s=slides[idx],el=document.getElementById('scene');if(el)el.innerHTML=renderScene(s);applySideDetail(s);for(const el of document.querySelectorAll('[data-read]')){const k=el.dataset.read;let v=state[k];if(k==='threshold'||k==='cut')v=Number(v).toFixed(2);if(k==='round'||k==='fold')v=`第 ${Number(v)+1} ${k==='fold'?'折':'輪'}`;el.textContent=v;}}
function next(){if(idx<slides.length-1){idx++;resetLocal();renderPage();}else openModal('overview');}
function prev(){if(idx>0){idx--;resetLocal();renderPage();}}
function goto(i){idx=Math.max(0,Math.min(slides.length-1,i));resetLocal();renderPage();}
function openModal(type){const m=document.getElementById('modal'),title=document.getElementById('modalTitle'),content=document.getElementById('modalContent');if(!m)return;if(type==='overview'){title.textContent='投影片總覽';content.innerHTML=`<div class="overview-grid">${slides.map((s,i)=>`<button class="jump" data-jump="${i}"><small>${String(i+1).padStart(2,'0')} · 第 ${s.l} 節</small>${esc(s.title)}</button>`).join('')}</div>`;}else{title.textContent='操作說明';content.innerHTML=`<div class="help-grid"><div><span class="key">→</span> 直接下一張投影片</div><div><span class="key">←</span> 直接上一張投影片</div><div><span class="key">G</span> 投影片總覽／快速跳頁</div><div><span class="key">H／?</span> 顯示此操作說明</div><div><span class="key">F</span> 切換全螢幕</div><div><span class="key">Esc</span> 關閉視窗</div><div>在滑桿／下拉選單輸入時，方向鍵優先調整元件。</div></div>`;}m.classList.add('open');}
function modalType(){return document.getElementById('modalTitle')?.textContent;}
function toggleModal(t){if(document.getElementById('modal')?.classList.contains('open')&&modalType()===(t==='overview'?'投影片總覽':'操作說明'))closeModal();else openModal(t);}
function closeModal(){document.getElementById('modal')?.classList.remove('open');}
async function copyCode(){const text=slides[idx].code===1?CODE_A:`${CODE_A}\n\n${CODE_B}`;try{await navigator.clipboard.writeText(text);}catch(e){const input=document.createElement('textarea');input.value=text;document.body.appendChild(input);input.select();document.execCommand('copy');input.remove();}const btn=document.querySelector('[data-action=copyCode]');if(btn){btn.textContent='已複製程式碼';}}
// Handle all active controls with event delegation so scene re-renders remain safe.
// 透過事件委派處理所有互動，讓圖解重新繪製後仍能正常操作。
document.addEventListener('click',e=>{const jump=e.target.closest('[data-jump]');if(jump){goto(Number(jump.dataset.jump));return;}const svpt=e.target.closest('[data-sv-point]');if(svpt){state.svPoint=Number(svpt.dataset.svPoint);updateVisual();return;}const svmcell=e.target.closest('[data-svmcell]');if(svmcell){const [c,g]=svmcell.dataset.svmcell.split('_');state.svmC=({1:0,3:1,20:2})[Number(c)];state.svmGamma=({'0.1':0,'1':1,'8':2})[g];updateVisual();return;}const vote=e.target.closest('[data-vote]');if(vote){const i=Number(vote.dataset.vote);state.votes[i]=1-state.votes[i];updateVisual();return;}const forest=e.target.closest('[data-forest]');if(forest){const i=Number(forest.dataset.forest);state.forest[i]=1-state.forest[i];updateVisual();return;}const mode=e.target.closest('[data-mode]');if(mode){const key=mode.dataset.mode;const val=mode.dataset.value;state[key]=key==='metricKind'?val:Number(val);renderPage();return;}const answer=e.target.closest('[data-answer]');if(answer){quizAnswers[phase]=Number(answer.dataset.answer);updateVisual();return;}const step=e.target.closest('[data-step]');if(step){if(slides[idx].kind==='quiz'){phase=Number(step.dataset.step);renderPage();}return;}const btn=e.target.closest('[data-action]');if(!btn)return;switch(btn.dataset.action){case'next':next();break;case'prev':prev();break;case'overview':toggleModal('overview');break;case'closeModal':closeModal();break;case'quizPrev':if(phase>0){phase--;renderPage();}break;case'quizNext':if(phase<2){phase++;renderPage();}break;case'foldPrev':state.fold=(state.fold+4)%5;updateVisual();break;case'foldNext':state.fold=(state.fold+1)%5;updateVisual();break;case'foldReset':state.fold=0;updateVisual();break;case'bestGrid':state.gi=2;state.gj=2;renderPage();break;case'draw':state.draw++;updateVisual();break;case'drawReset':state.draw=0;updateVisual();break;case'roundNext':state.round=Math.min(4,state.round+1);updateVisual();break;case'roundPrev':state.round=Math.max(0,state.round-1);updateVisual();break;case'roundReset':state.round=0;updateVisual();break;case'restore':state.votes=[1,0,1,1,0];state.forest=[1,0,1,1,0,1,0];updateVisual();break;case'copyCode':copyCode();break;}});
document.addEventListener('input',e=>{const key=e.target.dataset?.set;if(!key)return;const val=e.target.value;state[key]=['threshold','cut'].includes(key)?Number(val):['cIndex','depth','gi','gj','svmC','svmGamma'].includes(key)?Number(val):val;updateVisual();});
document.addEventListener('change',e=>{const key=e.target.dataset?.set;if(!key)return;const val=e.target.value;state[key]=['threshold','cut','cIndex','depth','gi','gj','svmC','svmGamma'].includes(key)?Number(val):val;updateVisual();});
document.addEventListener('keydown',e=>{const modal=document.getElementById('modal');if(e.key==='Escape'){closeModal();return;}const node=e.target;const isInput=node.matches?.('input,select,textarea,[contenteditable="true"]');if(isInput)return;if(e.key==='g'||e.key==='G'){e.preventDefault();toggleModal('overview');return;}if(e.key==='h'||e.key==='H'||e.key==='?'){e.preventDefault();toggleModal('help');return;}if(e.key==='f'||e.key==='F'){e.preventDefault();if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.();return;}if(modal?.classList.contains('open'))return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next();}else if(e.key==='ArrowLeft'){e.preventDefault();prev();}});
// Center and uniformly scale the actual 16:9 canvas for different projectors.
// 依據視窗尺寸等比例縮放並置中 16:9 畫布，適應不同投影環境。
function resize(){const scale=Math.min(window.innerWidth/BASE_W,window.innerHeight/BASE_H);deck.style.transform=`translate(-50%, -50%) scale(${scale})`;}
window.addEventListener('resize',resize);
resetLocal();renderPage();resize();
// Export lightweight instrumentation for numerical and browser acceptance tests.
// 輸出少量測試介面，供數學檢核與瀏覽器驗收使用。
window.__lessonTest={calc,renderScene,slides,scores,goto,resetLocal,get idx(){return idx;},get phase(){return phase;},get state(){return state;}};
