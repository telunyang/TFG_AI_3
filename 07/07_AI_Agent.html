const slides = [{"type":"cover","unit":"課程總覽","title":"AI Agent｜從模型連線到 Vibe Coding","subtitle":"把一句自然語言需求，變成真正會分工、會測試、會交付的 AI 應用。"},{"type":"architecture","unit":"第一節｜模型連線","title":"模型、Agent、工具，各在哪裡？","subtitle":"模型負責產生決策；工具負責真的執行。它們可以位在不同電腦。"},{"type":"commands","unit":"第一節｜模型連線","title":"① 準備 GPU 並啟動 Ollama","subtitle":"先確認模型能回答，再處理 Web 或 Agent 連線。"},{"type":"endpoint","unit":"第一節｜模型連線","title":"② HTTPS 網址：只填基底網址","subtitle":"同一個 Ollama 網址下有兩組用途不同的 API。"},{"type":"agentconnect","unit":"第一節｜模型連線","title":"③ 讓自訂 Agents 使用 Ollama API","subtitle":"Flask 後端透過 AG2 呼叫 ngrok HTTPS，再由 Ollama 模型完成推論。"},{"type":"quiz","unit":"第一節｜快速檢核","title":"三題檢核：模型、網址與工具","subtitle":"直接選答案；答錯先看提示，答對會出現解釋。","questions":[{"q":"Web 使用者輸入任務後，哪個部分應呼叫 Ollama 模型？","choices":["瀏覽器直接連線 ngrok 並管理模型憑證","Flask 後端的 AG2 Agent，經 HTTPS 呼叫 Ollama","ngrok 自動決定 Router 與 Sub-Agent 的分工"],"answer":1,"hint":"Web 負責操作；AG2 的 Agent 應在後端執行。","why":"Web 呼叫自己的 Flask API；後端依 Agent 模型設定向 Ollama 請求推論，ngrok 只轉送連線。"},{"q":"Ollama HTTPS URL 應該填哪個？","choices":["https://xxxx.ngrok-free.app","https://xxxx.ngrok-free.app/v1/chat/completions","https://xxxx.ngrok-free.app/api/tags"],"answer":0,"hint":"輸入的是「基底網址」，API 用戶端再加入路徑。","why":"模型推論可使用 /v1；原生管理可使用 /api，不能只填某個 API 路徑。"},{"q":"AG2 Agent 想執行 Python 程式，需要什麼？","choices":["只在 System Prompt 寫「請執行」","讓程式設計師 Agent 取得受限工具的執行能力","再建立一個同名 Agent 即可"],"answer":1,"hint":"模型能提出工具呼叫，但還要有真正的工具執行環境。","why":"Tool Calling 不等於 Tool Execution；後端必須提供實際執行工具及權限。"}]},{"type":"vibe","unit":"第二節｜Vibe Coding","title":"從一句話，打造自己的 AI 程式開發團隊","subtitle":"學生描述作品與預期成果；Coding Agent 負責建立專屬應用並進行測試。"},{"type":"team","unit":"第二節｜Agent 分工","title":"Router → PM → 程式設計師 → 測試","subtitle":"委派工作、內部呼叫工具、退回修正與最終回傳，是不同的關係。"},{"type":"debug","unit":"第二節｜Agent 分工","title":"寫程式不是終點：執行、除錯、再驗收","subtitle":"PM 依測試證據驗收；失敗時附上錯誤回報，退回設計師修改。"},{"type":"requirements","unit":"第二節｜需求設定","title":"只要填寫需求、角色與模型設定","subtitle":"產生器把學生的選擇整理成一份完整的開發指令。"},{"type":"generator","unit":"第二節｜操作實作","title":"實作：填完設計，交給 Coding Agent","subtitle":"直接使用最新版「AI 專題需求產生器」，產出可編輯的 Prompt。"},{"type":"quiz","unit":"第二節｜成果檢核","title":"最後檢核：Agent 分工與 Vibe Coding","subtitle":"確認你知道怎麼驗收作品，以及發生錯誤後該做什麼。","questions":[{"q":"Router 委派 PM，PM 再委派程式設計師，完成後結果會怎樣？","choices":["自動下載到學生電腦，無須程式實作","子任務回到呼叫者，再由 Router 統整回覆 Web","所有 Agent 都直接同時回答 Web"],"answer":1,"hint":"想想「委派並回傳」與「交出控制權」的不同。","why":"AG2 的 Agent.as_tool() 支援委派並回傳，Web 的結果顯示仍需後端處理。"},{"q":"哪一份檔案應該存放真正的雲端模型 API Key？","choices":[".env（學生自行準備，並排除版本控制）",".env.example（公開範本）","index.html（前端 JavaScript）"],"answer":0,"hint":"公開範本不能填真實金鑰；瀏覽器前端也不能存密鑰。","why":"Coding Agent 建立空白 .env.example；學生自行提供 .env；後端以環境變數讀取。"},{"q":"Web 顯示「pytest 失敗」，下一步最合適的是？","choices":["隱藏錯誤，仍顯示完成","複製錯誤報告，交給 Coding Agent 修正並重新驗收","先刪掉所有專案檔案"],"answer":1,"hint":"Vibe Coding 需要能夠重現與修正的真實錯誤資訊。","why":"保留 traceback、失敗步驟與測試結果，修正後重新執行驗收。"}]}];

// Normalize only display paths; do not make network calls.
// 僅組合展示用的 API 路徑，不進行網路請求。
function endpointSlide(){let base=urlText.replace(/\/+$/,'');let suffix=/(\/v1(?:\/.*)?|\/api(?:\/.*)?)$/i.test(base);let ok=/^https:\/\/[a-z0-9.-]+(?::\d+)?$/i.test(base)&&!suffix;return `<div class="api-grid"><div class="card card-pad col"><span class="tag">Ollama HTTPS 基底網址</span><label for="baseUrl" class="strong bodytext">只填 ngrok 網址，不要加 /v1</label><input id="baseUrl" class="url-input" value="${esc(urlText)}" spellcheck="false" aria-label="Ollama HTTPS 基底網址"><div class="mini ${ok?'valid':'invalid'}" id="urlStatus">${ok?'✓ 格式正確：可由程式加入不同 API 路徑':'請填完整 HTTPS 基底網址，不能附加 /api 或 /v1'}</div><div class="feature" style="margin-top:auto"><b>授課提醒</b><p>ngrok Token 只驗證隧道代理，不能取代公開 API 的使用者授權。不要向全班公開無存取保護的模型入口。</p></div></div><div class="card card-pad col"><div><b class="bodytext">系統自行組合 API 路徑</b><div class="api-path"><b>模型清單｜Native API</b><span id="tagsUrl">${esc(base)}/api/tags</span></div><div class="api-path"><b>模型推論｜OpenAI-compatible API</b><span id="chatUrl">${esc(base)}/v1/chat/completions</span></div></div><div class="feature" style="margin-top:auto"><button class="secondary" data-act="ngrok-help" style="padding:7px 12px;font-size:15px">查看 HTTPS 通道設定</button><p>經授權的主機上啟動 Ollama 與 HTTPS 通道；本機用戶端使用相同基底網址測試。下載模型需另確認原生 API 權限。</p></div></div></div>`;}
// Explain how the Flask backend supplies Ollama to different AG2 agents.
// 說明 Flask 後端如何將 Ollama 模型提供給不同的 AG2 Agent。
function agentConnectSlide(){let steps=[
{title:'① 提供 Ollama 網址與模型',text:'在專題產生器填入 ngrok 的 HTTPS 基底網址，以及 Ollama 已安裝的模型名稱。不要在網址後面加 /v1。',sample:'OLLAMA_BASE_URL=https://xxxx.ngrok-free.app\nOLLAMA_MODEL=YOUR_MODEL'},
{title:'② Flask 後端設定 AG2',text:'Coding Agent 會讓 Flask 後端讀取模型設定，使用 AG2 的 OpenAICompletionsConfig，並且只附加一次 /v1。Router 和不同 Sub-Agent 可共用或各自選擇模型。',sample:'AG2 Model Config\nmodel = OLLAMA_MODEL\nbase_url = OLLAMA_BASE_URL + /v1\napi_key = ollama（本機相容 API 佔位值）'},
{title:'③ 驗證 Web 到模型的往返',text:'從 Web 送出測試問題，確認 Router 能取得 Ollama 的真實回覆，再確認工具及 Sub-Agent 執行。ngrok 只負責轉送；Agent 工作流程由 Flask／AG2 管理。',sample:'Web → Flask API → Router／Sub-Agent\n       ↓ HTTPS 請求\nngrok → Ollama + GPU\n       ↓ 推論結果\nFlask → Web（JSON／即時事件）'}
];let d=steps[choice];return `<div class="agent-connect-steps"><div class="step-buttons">${steps.map((x,i)=>`<button data-act="select" data-key="${i}" class="${choice===i?'active':''}">${esc(x.title)}</button>`).join('')}</div><div class="card step-detail"><span class="tag blue">AG2 接入流程 ${choice+1} ／ 3</span><span class="big">${esc(d.title)}</span><p>${esc(d.text)}</p><div class="mini-code connect-sample" style="margin-top:auto">${esc(d.sample)}</div><div class="mini muted">所有真實請求由產生的 Flask 專案執行；這一頁是架構說明。</div></div></div>`;}
// Provide immediate feedback for selected quiz options.
// 讓作答立即得到提示，答對後才顯示詳細解釋。
function quizSlide(s){let q=s.questions[quizStep];let right=quizCorrect[quizStep]===true;let wrong=quizMistake[quizStep];let feedback=right?`<b>答對了。</b><br>${esc(q.why)}`:wrong!==undefined?`<b>還不正確。</b><br>${esc(q.hint)}`:'選一個你認為最合理的答案。';return `<div class="quiz-pane"><div class="card card-pad"><span class="tag">第 ${quizStep+1} 題／共 3 題</span><div class="quiz-question" style="margin-top:15px">${esc(q.q)}</div>${q.choices.map((text,i)=>`<button class="quiz-choice ${right&&i===q.answer?'correct':!right&&wrong===i?'wrong':''}" data-act="quiz" data-key="${i}">${String.fromCharCode(65+i)}．${esc(text)}</button>`).join('')}</div><div class="card quiz-feedback"><div><h2>即時回饋</h2><p style="margin-top:20px">${feedback}</p></div><div><p class="mini muted" style="margin-bottom:14px">答對 ${Object.values(quizCorrect).filter(Boolean).length}／3 題</p><div class="quiz-nav">${button('上一題','quiz-back',0)}${button(quizStep===2?'再看第一題':'下一題','quiz-next',0,'primary')}</div></div></div></div>`;}
// Let learners compare three concrete task descriptions.
// 讓學生比較三種不同精確程度的需求描述。
function vibeSlide(){let item=vibeCases[choice];return `<div class="vibe-grid"><div class="card card-pad col"><span class="tag gold">學生輸入的需求</span><div class="vibe-action">${vibeCases.map((v,i)=>`<button class="pill ${choice===i?'active':''}" data-act="select" data-key="${i}">${esc(v.label)}</button>`).join('')}</div><div class="prompt-box">${esc(item.text)}</div><p class="bodytext muted" style="margin:0">${esc(item.value)}</p></div><div class="card card-pad vibe-result"><span class="tag">Coding Agent 需要完成</span><div class="output-row"><span>①</span><span>建立 Flask Web 與 AG2 Agents</span></div><div class="output-row"><span>②</span><span>執行 Python、pytest 與錯誤修正</span></div><div class="output-row"><span>③</span><span>回傳執行狀態與下載成果</span></div><div class="mini muted" style="margin-top:auto">Coding Agent 需要可操作檔案與終端機的環境；一般聊天視窗不等於已建立完整專案。</div></div></div>`;}
// Show the team roles as a clickable simplified workflow.
// 將角色責任以可點選的簡化工作流程呈現。
function teamSlide(){let a=agents[choice];return `<div class="team-stage"><div class="card team-map"><div class="team-row"><span class="tag blue">Web 請求</span><span class="connector">→</span><button class="team-node ${choice===0?'active':''}" data-act="select" data-key="0">Router<small>總控</small></button></div><div class="team-row"><span class="connector">↓ 委派／回傳 ↑</span></div><div class="team-row"><button class="team-node ${choice===1?'active':''}" data-act="select" data-key="1">PM<small>專案經理／驗收</small></button><span class="connector">⇄</span><button class="team-node ${choice===2?'active':''}" data-act="select" data-key="2">Coder<small>Python 設計師</small></button></div><div class="team-row"><span class="connector">工具呼叫 ↘</span><button class="team-node ${choice===3?'active':''}" data-act="select" data-key="3">Tools<small>執行／搜尋</small></button></div><div class="mini muted" style="margin-top:13px;text-align:center">PM 退回修正 → Coder 再測 → PM 通過後回 Router → Web</div></div><div class="card team-detail"><span class="tag blue">點選左側工作角色</span><h2>${esc(a.name)}</h2><div class="pill"><b>主要工作：</b>${esc(a.role)}</div><p>${esc(a.detail)}</p><div class="team-note">${esc(a.tech)}</div></div></div>`;}
// Present four editable phases as an explicit teaching simulation.
// 用四個可切換階段示範除錯迴圈，並明確標示為教學示意。
function debugSlide(){let d=debugStates[choice];return `<div class="debug-layout"><div class="card card-pad col"><span class="tag gold">教學流程示意：不是實際 Agent 執行</span><div class="debug-timeline">${debugStates.map((x,i)=>`<button class="debug-row ${choice===i?'active':''}" data-act="select" data-key="${i}"><span>${esc(x.title)}</span><div class="small">${esc(x.sub)}</div></button>`).join('')}</div></div><div class="card card-pad col"><span class="tag">目前事件紀錄</span><div class="debug-console">${esc(d.log)}</div><div class="debug-notice">${esc(d.note)}</div></div></div>`;}
// Summarize the three form areas, including how secrets are handled.
// 彙整表單三類重點，並說明真正密鑰的處理方式。
function requirementsSlide(){return `<div class="require-grid"><div class="card require-card"><span class="tag gold">① 專題需求</span><b>要做什麼？</b><p>例如：讓使用者輸入一句話，就能完成 9×9 乘法表，並能下載 .py 檔案。</p><div class="require-footer">講清楚目標與成果，不需要先寫程式。</div></div><div class="card require-card"><span class="tag blue">② 工作角色</span><b>誰負責什麼？</b><p>Router 接需求、PM 訂驗收條件、Coder 寫程式；工具負責執行與測試。</p><div class="require-footer">連線要包含委派、回傳、修正條件。</div></div><div class="card require-card"><span class="tag">③ 模型與檔案</span><b>模型設定怎麼填？</b><div class="mini-code">Ollama：HTTPS 基底網址\n雲端：模型 ID＋.env 變數名稱</div><p style="font-size:15px">Coding Agent 產生 <b>requirements.txt</b>、空白 <b>.env.example</b>；真正的 <b>.env</b> 由學生自行填寫。</p></div></div>`;}
// Show the live generator screenshot and export an embedded copy.
// 展示產生器實際畫面，並可匯出內嵌的最新版檔案。
function generatorSlide(){return `<div class="generator-grid"><div class="preview"><img src="${generatorPreview}" alt="AI 專題需求產生器，第一步描述專題的實際介面"></div><div class="card card-pad generator-steps"><span class="tag">跟著四步驟完成</span><div class="feature">① 描述想做的專題與成果</div><div class="feature">② 設定 Router、PM、Coder 與工具</div><div class="feature">③ 拖曳並編輯委派／回傳／修正連線</div><div class="feature">④ 複製或下載可手動修改的 Prompt</div><div class="generator-buttons">${button('下載產生器 HTML','download-generator',0,'primary')}${button('另開產生器','open-generator',0)}</div><div class="mini muted">另開功能若遭瀏覽器阻擋，請先下載 HTML，再直接開啟。</div></div></div>`;}
// Select only the requested slide type.
// 僅依目前頁面選擇相對應的互動內容。
function slideContent(s){switch(s.type){case 'cover':return cover();case 'architecture':return architectureSlide();case 'commands':return commandsSlide();case 'endpoint':return endpointSlide();case 'agentconnect':return agentConnectSlide();case 'quiz':return quizSlide(s);case 'vibe':return vibeSlide();case 'team':return teamSlide();case 'debug':return debugSlide();case 'requirements':return requirementsSlide();case 'generator':return generatorSlide();default:return '';}}
// Render a complete slide, including header and predictable controls.
// 一次繪製標題、內容和頁碼控制，維持固定的導覽方式。
function render(){const s=slides[page];document.getElementById('deck').innerHTML=`<div class="header"><div class="brand"><span class="avatar"><img src="${avatar}" alt="教學人物圖示"></span><span>AI Agent 與 Vibe Coding<small>07｜互動式課程教材</small></span></div><div class="header-right"><span class="section-pill">${esc(s.unit)}</span><button class="head-btn" data-act="overview">目錄</button><button class="head-btn" data-act="help">操作說明</button></div></div><div class="progress"><div class="progress-fill" style="width:${((page+1)/slides.length)*100}%"></div></div>${heading(s)}<main class="content">${slideContent(s)}</main><footer class="footer"><div class="page-num">${String(page+1).padStart(2,'0')} / ${slides.length}　<span class="mini muted">← → 切換投影片</span></div><div class="foot-actions"><button class="secondary" data-act="prev" ${page===0?'disabled':''}>← 上一頁</button><button class="primary" data-act="next" ${page===slides.length-1?'disabled':''}>下一頁 →</button></div></footer><div class="modal-layer" id="modal"><div class="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button class="secondary" data-act="close">關閉 ×</button></div><div id="modalContent"></div></div></div>`;scaleDeck();}
// Keep interaction selection independent for each slide.
// 切換頁面時重設各頁專屬的互動選項。
function go(index){if(index<0||index>=slides.length)return;page=index;choice=0;quizStep=0;quizCorrect={};quizMistake={};render();}
// Scale the fixed classroom canvas without cropping any content.
// 將固定尺寸的教學畫面完整縮放至瀏覽器視窗。
function scaleDeck(){document.getElementById('deck').style.transform=`translate(-50%,-50%) scale(${Math.min(window.innerWidth/1300,window.innerHeight/740)})`;}
// Keep the in-slide modal usable for both navigation and references.
// 提供可以跳頁的目錄與操作說明對話框。
function openModal(type){if(type==='ngrok'){document.getElementById('modalTitle').textContent='HTTPS 通道｜設定與驗收';document.getElementById('modalContent').innerHTML=`<p><b>適用前提：</b>請只在允許對外提供 API 的主機建立通道；Colab 受管執行階段有服務與遠端 Proxy 使用限制。</p><ol><li>先確認 Ollama Server 已啟動，且模型可在主機上正常回覆。</li><li>依 <a target="_blank" rel="noopener noreferrer" href="https://ngrok.com/download">ngrok 官方說明</a>安裝 Agent，使用私人的 Authtoken 設定。</li><li>確認 API 已受到存取保護；必要時設定 Host 改寫 Traffic Policy。</li><li>於授權主機執行 <code>ngrok http 11434</code>，或依 Traffic Policy 設定加入 <code>--traffic-policy-file</code>。</li><li>取得 HTTPS 基底網址後，驗證 <code>/api/tags</code> 與 <code>/v1/models</code> 回傳真正的 JSON，並確認授權機制有效。</li></ol><p><b>安全重點：</b>ngrok Authtoken 不等於模型 API 的存取保護。不要在公開簡報或程式碼中貼出金鑰。</p>`;document.getElementById('modal').classList.add('open');return;}let title=type==='overview'?'課程目錄':'操作說明與官方資料';let body=type==='overview'?`<div class="modal-grid">${slides.map((s,i)=>`<button data-act="jump" data-key="${i}">${String(i+1).padStart(2,'0')}　${esc(s.title)}</button>`).join('')}</div>`:`<p>使用鍵盤 ←／→ 或投影片下方按鈕換頁。點選角色、流程與程式頁籤，可以查看不同工作階段。</p><p>指令複製後請先確認執行位置、授權及目前系統版本。課堂互動僅為模擬，不會連線外部模型或執行 Python。</p><p><b>官方參考：</b> <a href="https://docs.ag2.ai/docs/user-guide/subagents/" target="_blank" rel="noopener noreferrer">AG2 Subagents</a>、<a href="https://docs.ag2.ai/docs/user-guide/tools/local_shell/" target="_blank" rel="noopener noreferrer">AG2 SandboxShellTool</a>、<a href="https://docs.ollama.com/api/" target="_blank" rel="noopener noreferrer">Ollama API</a>、<a href="https://research.google.com/colaboratory/intl/zh-TW/faq.html" target="_blank" rel="noopener noreferrer">Colab 使用規範</a>。</p>`;document.getElementById('modalTitle').textContent=title;document.getElementById('modalContent').innerHTML=body;document.getElementById('modal').classList.add('open');}
// Create generator bytes from the embedded UTF-8 source.
// 從內嵌的 UTF-8 原始檔還原產生器位元組。
function generatorBlob(){const binary=atob(generatorBase64);const bytes=Uint8Array.from(binary,ch=>ch.charCodeAt(0));return new Blob([bytes],{type:'text/html;charset=utf-8'});}
// Download a complete offline copy of the companion generator.
// 下載可以離線使用的完整產生器 HTML。
function downloadGenerator(){const url=URL.createObjectURL(generatorBlob());const anchor=document.createElement('a');anchor.href=url;anchor.download='07_AI_專題需求產生器.html';document.body.appendChild(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);}
// Open the embedded generator in a separate tab on a direct click.
// 使用者直接點選時，嘗試在新分頁開啟內嵌產生器。
function openGenerator(){const url=URL.createObjectURL(generatorBlob());const tab=window.open(url,'_blank');if(!tab)downloadGenerator();setTimeout(()=>URL.revokeObjectURL(url),60000);}
// Copy the current command block while reporting clipboard failures.
// 複製目前指令，若瀏覽器不允許則回報實際情況。
async function copyCommand(btn){try{await navigator.clipboard.writeText(commands[choice].code);btn.textContent='已複製 ✓';}catch(e){btn.textContent='無法直接複製，請手動選取';}}
// Delegate UI actions without duplicating event listeners on each page.
// 使用單一事件監聽器處理整份投影片的操作。
document.getElementById('deck').addEventListener('click',event=>{const btn=event.target.closest('[data-act]');if(!btn)return;const act=btn.dataset.act;const k=Number(btn.dataset.key||0);if(act==='next')go(page+1);else if(act==='prev')go(page-1);else if(act==='select'){choice=k;render();}else if(act==='quiz'){const q=slides[page].questions[quizStep];if(k===q.answer){quizCorrect[quizStep]=true;delete quizMistake[quizStep];}else if(!quizCorrect[quizStep])quizMistake[quizStep]=k;render();}else if(act==='quiz-next'){quizStep=(quizStep+1)%3;render();}else if(act==='quiz-back'){quizStep=(quizStep+2)%3;render();}else if(act==='overview'||act==='help'||act==='ngrok-help')openModal(act==='ngrok-help'?'ngrok':act);else if(act==='close')document.getElementById('modal').classList.remove('open');else if(act==='jump')go(k);else if(act==='copy-command')copyCommand(btn);else if(act==='download-generator')downloadGenerator();else if(act==='open-generator')openGenerator();});
// Update endpoint previews while the learner types, without network traffic.
// 學生輸入網址時即時更新路徑，不會向網址發送任何請求。
document.getElementById('deck').addEventListener('input',event=>{if(event.target.id!=='baseUrl')return;urlText=event.target.value.trim();const base=urlText.replace(/\/+$/,'');const valid=/^https:\/\/[a-z0-9.-]+(?::\d+)?$/i.test(base)&&!/(\/v1(?:\/.*)?|\/api(?:\/.*)?)$/i.test(base);document.getElementById('tagsUrl').textContent=base+'/api/tags';document.getElementById('chatUrl').textContent=base+'/v1/chat/completions';const el=document.getElementById('urlStatus');el.textContent=valid?'✓ 格式正確：可由程式加入不同 API 路徑':'請填完整 HTTPS 基底網址，不能附加 /api 或 /v1';el.className='mini '+(valid?'valid':'invalid');});
// Respect focused inputs and open dialogs when navigating by keyboard.
// 鍵盤翻頁需避開文字輸入及已開啟的對話框。
document.addEventListener('keydown',event=>{if(document.getElementById('modal')?.classList.contains('open')){if(event.key==='Escape')document.getElementById('modal').classList.remove('open');return;}if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(event.key==='ArrowRight'){event.preventDefault();go(page+1);}if(event.key==='ArrowLeft'){event.preventDefault();go(page-1);}});
// Adapt the slide canvas to the available display size.
// 當視窗尺寸改變時重新計算教學畫面的縮放比例。
window.addEventListener('resize',scaleDeck);
// Draw the first slide immediately when opening the standalone HTML.
// 開啟單檔 HTML 後立即顯示第一張投影片。
render();
</script>
</body>
</html>
