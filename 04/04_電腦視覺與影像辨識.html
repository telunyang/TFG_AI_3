/* PSM choices change both the text-layout example and the explanation. */
/* PSM 按鈕會同步更換文字排版範例與使用情境。 */
.psm-buttons{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.psm-buttons .btn{font-size:11.5px;padding:7px 4px;white-space:nowrap}
.psm-panel{display:grid;grid-template-columns:1.06fr .94fr;gap:10px;flex:1;min-height:0}
.psm-preview,.psm-detail{min-height:0;border-radius:13px;border:1px solid #dbe5f2;padding:11px;display:flex;flex-direction:column;gap:7px}
.psm-preview{background:#eff5ff;text-align:center;justify-content:space-around}
.psm-photo-label{font-size:10px;color:#597498;font-weight:850}
.psm-preview>div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:white;border:1px solid #d4e2f5;border-radius:10px;padding:10px 6px;flex:1;min-height:0}
.psm-preview p{font-size:18px;line-height:1.25;font-weight:900;letter-spacing:.5px;color:#274d80;margin:0}
.psm-preview.line p{font-family:Consolas,monospace;font-size:27px;letter-spacing:4px}
.psm-preview.word p{font-family:Consolas,monospace;font-size:36px;letter-spacing:7px}
.psm-preview.block p,.psm-preview.page p{font-size:15px;letter-spacing:0}
.psm-preview.orientation p{font-size:30px;color:#bd8038}
.psm-detail{background:#fffdf8;justify-content:center}
.psm-detail strong{font-size:22px;color:#2f62a4}
.psm-detail h3{font-size:16px;color:#334e76;line-height:1.35;margin:0}
.psm-detail p{font-size:12px;color:#536b85;line-height:1.55;margin:0}
.psm-output{background:#edf7f1;color:#2f765e;padding:8px;border-radius:8px;font-size:11.5px;font-weight:850;line-height:1.38}
.fine-workshop{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0;background:#f8fbff;border:1px solid #dce7f4;border-radius:13px;padding:14px}
.fine-head{display:grid;grid-template-columns:1fr 200px;gap:16px;align-items:center}
.fine-head strong{display:block;font-size:21px;color:#295d9c}
.fine-head small{display:block;font-size:11px;line-height:1.5;color:#657b96}
.fine-head input{width:100%;accent-color:#3978c6}
.fine-track{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.fine-epoch{display:grid;place-items:center;height:31px;border-radius:8px;border:1px solid #dde5f0;background:#eff2f6;color:#8b9bb0;font-size:12px;font-weight:900}
.fine-epoch.completed{background:#dbf3e6;color:#267358;border-color:#8acfa9}
.fine-amount{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fine-amount>div{display:flex;align-items:center;flex-direction:column;gap:3px;background:#fff;border:1px solid #dce6f2;border-radius:10px;padding:10px 2px}
.fine-amount small{font-size:10.5px;color:#6c829b;font-weight:800}
.fine-amount strong{font-size:31px;color:#286b9b;line-height:1.1}
.fine-amount span{font-size:10.7px;color:#698098}
.fine-progress{display:flex;align-items:center;gap:8px;font-size:10.5px;color:#6c8298;font-weight:800}
.fine-progress>div{flex:1;height:10px;border-radius:10px;background:#e6ecf6;overflow:hidden}
.fine-progress i{display:block;height:100%;background:linear-gradient(90deg,#c2e9d5,#54b48c);border-radius:10px;transition:width .18s}
.fine-warning{padding:8px 10px;background:#fff5e9;color:#865e34;border:1px solid #ecd8ba;border-radius:8px;font-size:11px;line-height:1.45}
.compare-switch{display:flex;gap:8px;justify-content:center}
.compare-switch .btn{font-size:11px;padding:6px 12px}
.compare-two{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0}
.compare-card{background:#f6f9ff;border:1px solid #dce7f4;border-radius:13px;padding:9px;min-height:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.compare-card strong{color:#315d97;font-size:13px}
.compare-card p{font-size:11px;color:#546e8b;font-weight:800;margin:0;text-align:center}
.compare-card.custom-card{background:#f2fbf7;border-color:#cbe6d8}
.compare-card.custom-card strong{color:#277960}
.compare-picture{position:relative;min-height:0;flex:1;width:100%;background:#e8eff7;border-radius:9px;overflow:hidden}
.compare-picture>img{display:block;width:100%;height:100%;object-fit:fill}
.bbox{position:absolute;border:3px solid #ffc469;color:#573910;font-size:10px;font-weight:900;line-height:1.2;text-align:left;box-shadow:0 0 0 1px #0002}
.bbox.base{background:rgba(246,180,61,.10)}
.bbox.custom{border-color:#60f2c6;color:#154633;background:rgba(71,202,148,.12)}
.bbox::first-line{background:#ffdd83}
.compare-disclaimer{font-size:10.3px;line-height:1.4;border-radius:8px;padding:7px 9px;text-align:center;background:#fff3e4;color:#80562b;border:1px solid #f0d9b8}
.scene:has(.fine-workshop){gap:4px}
.scene:has(.psm-panel){gap:7px}
.scene:has(.compare-two){gap:7px}


/* Make the labels and boxes refer to the same supplied animal photograph. */
/* 讓文字與方框確實對應同一張教材中的動物照片。 */
.pet-switch{display:flex;gap:8px;justify-content:center}
.pet-switch .btn{padding:7px 16px;font-size:13px}
.annotate-demo{flex:1;min-height:0;display:grid;grid-template-columns:1.12fr .9fr;gap:13px}
.pet-image-pane{min-width:0;min-height:0;display:flex;justify-content:center;align-items:center;background:#ecf2f7;border-radius:13px;overflow:hidden}
.pet-photo-svg{display:block;max-width:100%;width:auto;height:100%;max-height:100%;background:#e2e9f0}
.annotate-explain{display:flex;flex-direction:column;gap:8px;min-height:0}
.annotate-label{flex:1;border-radius:10px;background:#eef6fe;border:1px solid #d5e6f6;padding:11px 12px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.annotate-label small{font-size:11px;font-weight:850;color:#416d9a}
.annotate-label strong{font-size:21px;color:#265e98}
.annotate-label span{font-size:11px;color:#536d87;line-height:1.4}
.annotate-label.simple{background:#e9f7ed;border-color:#ccead6;flex:0 0 58px;gap:2px}
.annotate-label.simple b{font-size:14px;color:#257454}
.pet-caption{font-size:11px;color:#486484;line-height:1.45;background:#f7fafc;border:1px solid #dce7f4;border-radius:8px;padding:5px 9px;text-align:center}
.scene:has(.annotate-demo){gap:7px}

/* Keep the learning curve readable at presentation scale. */
/* 維持學習曲線在投影片尺寸下的辨識度。 */
.fit-workshop{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px}
.fit-head{display:flex;gap:13px;align-items:center;background:#f4f9ff;padding:11px 13px;border-radius:10px;border:1px solid #dce8f5}
.fit-head strong{color:#2d6397;font-size:16px;min-width:168px}
.fit-head input{flex:1;min-width:0;accent-color:#357dc4}
.fit-head span{font-size:11px;color:#697f99;min-width:70px}
.fit-chart{position:relative;flex:1;min-height:0;background:#fff;border:1px solid #dde8f2;border-radius:12px;padding:5px 9px 12px}
.fit-chart svg{height:100%;width:100%;display:block}
.fit-legend{position:absolute;right:24px;top:11px;display:flex;gap:17px;background:#ffffffc9;border-radius:7px;padding:4px 6px}
.fit-legend span{display:flex;gap:5px;align-items:center;font-size:11px;font-weight:850;color:#536982}
.fit-legend i{display:block;width:15px;height:4px;border-radius:4px}
.fit-report{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:10px;border:1px solid #d8e7ed;background:#f6f9fd;padding:7px 13px;min-height:54px}
.fit-report>div:first-child{display:flex;flex-direction:column;gap:3px}
.fit-report strong{font-size:15px}
.fit-report span{color:#62738b;font-size:11.5px}
.fit-values{display:flex;gap:11px}
.fit-values span{font-size:11px;white-space:nowrap}
.fit-values b{font-size:15px;color:#354e68}
.fit-caution{font-size:10.2px;line-height:1.25;color:#785f38;background:#fff6e8;border:1px solid #edd6b7;border-radius:8px;padding:6px 9px;text-align:center}
.scene:has(.fit-chart){gap:7px}

/* Preserve the image aspect ratio and highlight differences between mock detections. */
/* 保留照片比例，清楚呈現假設的微調前後差異。 */
.compare-picture{display:flex;align-items:center;justify-content:center;background:#e7eff5}
.compare-picture .pet-photo-svg{height:100%;max-width:100%;width:auto}
.compare-card p{font-size:11.3px;line-height:1.3;min-height:27px;display:flex;align-items:center;justify-content:center}
.compare-card strong{font-size:12.8px}
.compare-disclaimer{font-size:10.7px;line-height:1.33;padding:6px 9px}

  const x=Math.min(box.x,d.width-tagW-3);
  const y=Math.max(0,box.y-2);
  const outline=miss?'':`<rect x="${box.x}" y="${box.y}" width="${box.w}" height="${box.h}" fill="none" stroke="${color}" stroke-width="5"/><rect x="${x}" y="${y}" width="${tagW}" height="27" rx="4" fill="${color}"/><text x="${x+8}" y="${y+19}" font-size="18" font-weight="bold" fill="#19344c">${tag}</text>`;
  const notice=miss?`<rect x="12" y="14" width="179" height="35" rx="7" fill="#344358" opacity=".9"/><text x="25" y="38" font-size="21" font-weight="bold" fill="white">未偵測到貓</text>`:'';
  return `<svg class="pet-photo-svg" viewBox="0 0 ${d.width} ${d.height}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${animal==='cat'?'貓':'狗'}的${mode==='base'?'假設原始預測':'正確方框示意'}"><image href="${IMG[animal+'Sample']}" width="${d.width}" height="${d.height}"/>${outline}${notice}</svg>`;
}
function sceneAnnotate(){
  const d=PET_SAMPLES[annotCase];
  const animal=d.label==='cat'?'貓':'狗';
  return `<div class="pet-switch">${btn('看貓的框',annotCase==='cat',"annotCase='cat';render()")}${btn('看狗的框',annotCase==='dog',"annotCase='dog';render()")}</div><div class="annotate-demo"><div class="pet-image-pane">${petSvg(annotCase,'label')}</div><div class="annotate-explain"><div class="annotate-label"><small>① 牠是什麼？</small><strong>${d.label}＝類別 ${d.id}</strong><span>這是物件的名稱（Class）</span></div><div class="annotate-label"><small>② 牠在哪裡？</small><strong>綠色方框</strong><span>框住整隻${animal}的範圍（Bounding Box）</span></div><div class="annotate-label simple"><small>教給 YOLO 的答案</small><b>${d.label} ＋ 方框位置</b></div></div></div><div class="pet-caption">此綠框依教材的已標註貓狗資料繪製；每個物件需要正確的類別和位置。</div>`;
}
function sceneDataset(){const train=dataSplit==='train',n=train?100:30;return `<div class="btnbar">${btn('Train｜200 張',train,`dataSplit='train';render()`)}${btn('Val｜60 張',!train,`dataSplit='val';render()`)}</div><div class="foldergrid"><div class="folder active"><b>▣</b>${train?'Train':'Val'} · 貓<small>${n} 張照片<br>cat · 類別 0</small></div><div class="folder active"><b>▣</b>${train?'Train':'Val'} · 狗<small>${n} 張照片<br>dog · 類別 1</small></div><div class="folder"><b>▤</b>Bounding Box<small>每張圖片搭配<br>YOLO 座標標註</small></div></div><div class="caption">${train?'200 張 Train 用來更新權重':'60 張 Val 用來觀察未參與更新的辨識表現'}；貓狗各佔一半，兩組不重複。</div>`}
function sceneFineTune(){
  const train=e=>0.13+1.12*Math.exp(-0.21*e);
  const val=e=>0.26+0.88*Math.exp(-0.35*e)+0.0055*(e-9)**2;
  const x=e=>48+(e-1)*30;
  const y=l=>187-l*105;
  const curve=f=>Array.from({length:20},(_,i)=>`${i?'L':'M'} ${x(i+1).toFixed(1)} ${y(f(i+1)).toFixed(1)}`).join(' ');
  const phase=epochs<=4?['學不夠 · Underfitting','Train 和 Val 都還在改善','#c17b36']:epochs<=12?['適當學習 · Fitting','Val Loss 已接近最低，表現較穩定','#21866c']:['可能過度擬合 · Overfitting','Train 繼續下降，但 Val 卻上升','#bd5656'];
  return `<div class="fit-workshop"><div class="fit-head"><strong>訓練 <span id="fitEpoch">${epochs}</span> Epoch</strong><input aria-label="調整訓練輪數" type="range" min="1" max="20" step="1" value="${epochs}" oninput="epochs=Number(this.value);updateFineTune()"><span>1 ～ 20 輪</span></div><div class="fit-chart"><svg viewBox="0 0 660 211" preserveAspectRatio="none" aria-label="訓練和驗證 Loss 的示意曲線" role="img"><line x1="48" y1="187" x2="630" y2="187" stroke="#aac0d3" stroke-width="2"/><line x1="48" y1="20" x2="48" y2="187" stroke="#aac0d3" stroke-width="2"/><line x1="48" y1="130" x2="630" y2="130" stroke="#e5edf4"/><line x1="48" y1="75" x2="630" y2="75" stroke="#e5edf4"/><text x="9" y="20" font-size="13" fill="#677e95">Loss</text><text x="40" y="202" font-size="13" fill="#677e95">1</text><text x="338" y="202" font-size="13" fill="#677e95">11</text><text x="613" y="202" font-size="13" fill="#677e95">20</text><text x="555" y="204" font-size="12" fill="#677e95">Epoch</text><path d="${curve(train)}" stroke="#357dc4" stroke-width="4" fill="none"/><path d="${curve(val)}" stroke="#e18f48" stroke-width="4" fill="none"/><line id="fitGuide" x1="${x(epochs)}" x2="${x(epochs)}" y1="22" y2="187" stroke="#56677f" stroke-width="2" stroke-dasharray="5 5"/><circle id="fitTrainDot" cx="${x(epochs)}" cy="${y(train(epochs))}" r="7" fill="#357dc4" stroke="white" stroke-width="3"/><circle id="fitValDot" cx="${x(epochs)}" cy="${y(val(epochs))}" r="7" fill="#e18f48" stroke="white" stroke-width="3"/></svg><div class="fit-legend"><span><i style="background:#357dc4"></i>Train Loss</span><span><i style="background:#e18f48"></i>Val Loss</span></div></div><div class="fit-report"><div><strong id="fitPhase" style="color:${phase[2]}">${phase[0]}</strong><span id="fitExplain">${phase[1]}</span></div><div class="fit-values"><span>Train <b id="fitTrainValue">${train(epochs).toFixed(2)}</b></span><span>Val <b id="fitValValue">${val(epochs).toFixed(2)}</b></span></div></div><div class="fit-caution">曲線與數值是<b>假設的教學情境</b>，不是本課 YOLO 的實測結果；真實最佳 Epoch 要由 Val 表現決定。</div></div>`;
}
function updateFineTune(){
  const train=e=>0.13+1.12*Math.exp(-0.21*e);
  const val=e=>0.26+0.88*Math.exp(-0.35*e)+0.0055*(e-9)**2;
  const x=48+(epochs-1)*30;
  const phase=epochs<=4?['學不夠 · Underfitting','Train 和 Val 都還在改善','#c17b36']:epochs<=12?['適當學習 · Fitting','Val Loss 已接近最低，表現較穩定','#21866c']:['可能過度擬合 · Overfitting','Train 繼續下降，但 Val 卻上升','#bd5656'];
  $('#fitEpoch').textContent=epochs;
  $('#fitPhase').textContent=phase[0];
  $('#fitPhase').style.color=phase[2];
  $('#fitExplain').textContent=phase[1];
  $('#fitTrainValue').textContent=train(epochs).toFixed(2);
  $('#fitValValue').textContent=val(epochs).toFixed(2);
  $('#fitGuide').setAttribute('x1',x);
  $('#fitGuide').setAttribute('x2',x);
  $('#fitTrainDot').setAttribute('cx',x);
  $('#fitTrainDot').setAttribute('cy',187-train(epochs)*105);
  $('#fitValDot').setAttribute('cx',x);
  $('#fitValDot').setAttribute('cy',187-val(epochs)*105);
}
function sceneCompare(){
  const isCat=compareCase==='cat';
  const animal=isCat?'cat':'dog';
  const note=isCat?'原始模型：假設漏框，沒有辨識出貓':'原始模型：假設只框到狗的頭部';
  return `<div class="compare-switch">${btn('比較貓 cat',isCat,"compareCase='cat';render()")}${btn('比較狗 dog',!isCat,"compareCase='dog';render()")}</div><div class="compare-two"><div class="compare-card"><strong>原始 YOLO11 · 假設情境</strong><div class="compare-picture">${petSvg(animal,'base')}</div><p>${note}</p></div><div class="compare-card custom-card"><strong>微調後 YOLO11 · 假設情境</strong><div class="compare-picture">${petSvg(animal,'fine')}</div><p>假設微調後：成功框出${isCat?'整隻貓':'整隻狗'}（${animal}）</p></div></div><div class="compare-disclaimer">照片取自本課貓狗資料；<b>左右框是「假設結果」而非模型實測</b>。微調也可能退步，應用真正未參與訓練的圖片驗證。</div>`;
}
function sceneQuiz(id){const questions=QUESTIONS[id],q=questions[qpos[id]],done=qsolved[id][qpos[id]],status=qstatus[id];return `<div class="quiz"><div class="qcount">第 ${qpos[id]+1} / 3 題</div><h3>${esc(q.q)}</h3><div class="options">${q.opts.map((o,i)=>`<button class="${status===String(i)?(done?'correct':'wrong'):''}" onclick="answer('${id}',${i})">${String.fromCharCode(65+i)}　${esc(o)}</button>`).join('')}</div><div class="qfeedback ${status?(done?'correct':'wrong'):''}">${esc(qfeedback[id]||'選擇一個答案。答錯會得到提示，答對會顯示完整解析。')}</div><div class="qnav"><button onclick="qmove('${id}',-1)" ${qpos[id]===0?'disabled':''}>上一題</button><span>完成 ${Object.values(qsolved[id]).filter(Boolean).length} / 3 題</span><button onclick="qmove('${id}',1)" ${!done||qpos[id]===2?'disabled':''}>下一題</button></div></div>`}
function answer(id,i){if(qsolved[id][qpos[id]])return;const q=QUESTIONS[id][qpos[id]];qstatus[id]=String(i);if(i===q.ans){qsolved[id][qpos[id]]=true;qfeedback[id]='答對！'+q.explain}else{qfeedback[id]='再試一次：'+q.hint}render()}
function qmove(id,d){const next=Math.min(2,Math.max(0,qpos[id]+d));if(next>qpos[id]&&!qsolved[id][qpos[id]])return;qpos[id]=next;qstatus[id]='';qfeedback[id]='';render()}
function scene(s){switch(s.kind){case 'tasks':return sceneTasks();case 'pipeline':return scenePipeline();case 'processing':return sceneProcessing();case 'crop':return sceneCrop();case 'captcha':return sceneCaptcha();case 'detect':return sceneDetect();case 'annotate':return sceneAnnotate();case 'dataset':return sceneDataset();case 'finetune':return sceneFineTune();case 'compare':return sceneCompare();case 'quiz1':return sceneQuiz('quiz1');case 'quiz2':return sceneQuiz('quiz2')}}
function render(){const s=SLIDES[page];$('#deck').innerHTML=`<header><div class="brand"><div class="avatar"><img src="${IMG.avatar}" alt="課程人物頭像"></div><div><strong>教學主題｜電腦視覺與影像辨識</strong><small>看實際照片 · 改參數 · 自己上傳測試</small></div></div><span class="chip">第 ${s.part} 節 · 實作與觀察</span></header><div class="heading"><label>${esc(s.tag)}</label><h1>${esc(s.title)}</h1><p>${esc(s.sub)}</p></div><div class="layout"><div class="main"><div class="mainheader"><span>${esc(s.key)}</span><span>${s.kind.startsWith('quiz')?'即時問答':'可操作圖解'}</span></div><div class="scene">${scene(s)}</div></div><div class="aside"><div class="tag">這頁只記一件事</div><h2>${esc(s.lead)}</h2><ul>${s.points.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="hint">${esc(s.hint)}</div></div></div><footer><span>←／→ 切換整張投影片</span><div class="progress"><i style="width:${(page+1)/SLIDES.length*100}%"></i></div><span class="count">${page+1} / ${SLIDES.length}</span><div class="nav"><button onclick="goto(page-1)" ${page===0?'disabled':''}>← 上一頁</button><button onclick="goto(page+1)" ${page===SLIDES.length-1?'disabled':''}>下一頁 →</button></div></footer>`;resize();if(s.kind==='processing')drawProcess()}
function goto(n){if(n<0||n>=SLIDES.length)return;page=n;render()}
function resize(){const z=Math.min(innerWidth/1280,innerHeight/720);$('#deck').style.transform=`translate(-50%,-50%) scale(${z})`}
window.addEventListener('resize',resize);window.addEventListener('keydown',e=>{if(e.target?.tagName==='INPUT')return;if(e.key==='ArrowRight'){e.preventDefault();goto(page+1)}if(e.key==='ArrowLeft'){e.preventDefault();goto(page-1)}});
window.__lessonTest={goto,slides:SLIDES,questions:QUESTIONS,get page(){return page}};
render();
</script></body></html>
