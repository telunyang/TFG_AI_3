<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Selector 校園公告練習站</title>
  <style>
    :root { font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; color: #15213c; background: #edf3fa; }
    body { max-width: 920px; margin: 0 auto; padding: 45px 25px; }
    h1 { font-size: 42px; margin: 0 0 10px; }
    p { font-size: 21px; line-height: 1.65; }
    .note { background: white; padding: 16px 24px; border-left: 6px solid #2477e8; border-radius: 12px; }
    #news-list { list-style: none; margin: 24px 0; padding: 0; display: grid; gap: 16px; }
    li.card { background: white; border: 2px solid #d4e1f0; padding: 22px 25px; border-radius: 14px; }
    li.card.dynamic { border-color: #1aa79b; background: #edfffb; }
    li.card a { font-size: 26px; color: #124bbb; font-weight: 700; }
    li.card.dynamic a { color: #087b74; }
    .marker { display: inline-block; margin-left: 12px; padding: 4px 12px; font-size: 16px; background: #e8eeff; border-radius: 30px; }
    li.dynamic .marker { background: #d1f8ee; }
    button { font-size: 21px; padding: 13px 25px; border: 0; border-radius: 10px; color: white; background: #155fd5; cursor: pointer; }
    #status { font-size: 20px; color: #456; }
    code { background: #dce9f8; padding: 1px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">校園公告｜CSS Selector 練習站</h1>
    <p class="note">原始 HTML 先有 <strong>2 筆公告</strong>。頁面打開後，JavaScript 會透過 <code>fetch("posts.json")</code> 再增加 <strong>2 筆公告</strong>。</p>
  </header>

  <main>
    <h2>公告列表</h2>
    <ul id="news-list">
      <li id="static-1" class="card static"><a href="#static-1">社團成果發表日</a><span class="marker">原始 HTML</span></li>
      <li id="static-2" class="card static"><a href="#static-2">校園閱讀週開跑</a><span class="marker">原始 HTML</span></li>
    </ul>
    <button id="reload" type="button">重新載入動態公告</button>
    <p id="status" role="status">等待 JavaScript 下載 posts.json…</p>
    <p>試著比較：<code>ul#news-list &gt; li.card</code>、<code>ul#news-list a[href]</code>、<code>li.card.dynamic &gt; a</code></p>
  </main>

  <script>
    // Fetch announcement data from a separate JSON file after a short delay.
    // 短暫延遲後，透過 fetch 向另一個 JSON 檔案取得公告資料。
    async function loadPosts() {
      // Remove previous dynamic items so repeated clicks do not duplicate them.
      // 先移除舊的動態公告，避免重複點擊時新增相同資料。
      document.querySelectorAll("#news-list > li.dynamic").forEach(item => item.remove());
      // Show that new items have not yet been inserted into the DOM.
      // 顯示動態元素目前尚未加入 DOM 的狀態。
      document.querySelector("#status").textContent = "正在透過 fetch 載入公告…";
      // Start the asynchronous fetch request after the demonstration delay.
      // 經過示範用的延遲後，再發出非同步 fetch 請求。
      await new Promise(resolve => setTimeout(resolve, 1200));
      // Handle network errors without leaving students with an unexplained blank screen.
      // 妥善處理網路錯誤，避免學生看到空白畫面卻不清楚原因。
      try {
        // Send an HTTP request for the JSON response.
        // 發送 HTTP 請求，取得 JSON 回應。
        const response = await fetch("posts.json");
        // Reject unsuccessful HTTP status codes.
        // HTTP 狀態碼不成功時，主動拋出錯誤。
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        // Convert the response body to JavaScript objects.
        // 將回應內容轉換成 JavaScript 物件。
        const posts = await response.json();
        // Locate the announcement list that will receive new children.
        // 找出要新增子元素的公告列表。
        const list = document.querySelector("#news-list");
        // Add one new list item for each record returned by the API.
        // 對 API 回傳的每筆公告，建立並加入一個 li 元素。
        for (const post of posts) {
          // Create a list item with a different CSS class for dynamic records.
          // 為動態公告建立帶有 dynamic 類別的 li。
          const item = document.createElement("li");
          // Set the ID used by the in-page anchor link.
          // 設定供頁內超連結使用的 ID。
          item.id = post.id;
          // Distinguish fetched records from records in the original HTML.
          // 用 class 區分後續取得的資料與原始 HTML。
          item.className = "card dynamic";
          // Build the link with textContent so data is not interpreted as HTML.
          // 使用 textContent 建立連結，避免將資料當作 HTML 解析。
          const link = document.createElement("a");
          // Link to the new card itself.
          // 連結指向此公告本身。
          link.href = `#${post.id}`;
          // Show the announcement title safely.
          // 安全地顯示公告標題。
          link.textContent = post.title;
          // Add a small origin label for visual comparison.
          // 增加資料來源標籤，方便上課比較。
          const marker = document.createElement("span");
          // Apply the label's CSS class.
          // 指定標籤的 CSS 類別。
          marker.className = "marker";
          // Explain where this record came from.
          // 標示該筆資料為後續載入。
          marker.textContent = "fetch 動態新增";
          // Assemble the DOM structure in the same order as the static records.
          // 依照靜態公告的結構組合 DOM 元素。
          item.append(link, marker);
          // Insert the new element into the live document.
          // 把新元素加入目前瀏覽器的 DOM。
          list.append(item);
        }
        // Display the final total so students can verify the outcome.
        // 顯示最終筆數，讓學生核對擷取結果。
        document.querySelector("#status").textContent = `載入完成：目前共 ${list.querySelectorAll("li.card").length} 筆公告。`;
      // Handle a missing file or an unavailable local server.
      // 處理 JSON 遺失或本機伺服器未啟動的情況。
      } catch (error) {
        // Explain why the asynchronous records did not appear.
        // 顯示動態公告未出現的原因。
        document.querySelector("#status").textContent = `載入失敗：${error.message}。請使用 http://127.0.0.1:8000/ 開啟本頁。`;
      }
    }
    // Load records as soon as the page's initial HTML is ready.
    // 網頁初始 HTML 準備完成後，啟動資料載入。
    loadPosts();
    // Allow students to repeat the comparison without manually refreshing.
    // 讓學生不用重新整理頁面，也能重複觀察動態新增。
    document.querySelector("#reload").addEventListener("click", loadPosts);
  </script>
</body>
</html>
