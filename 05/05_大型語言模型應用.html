dius:13px;border:1px solid #caddec;background:white;padding:14px 12px;display:flex;align-items:center;gap:9px;font-size:14px;font-weight:900;color:#355a7e;word-break:break-all}.file .ico{font-size:22px}.wide-file{padding:18px}.stepnum{background:#d6e8ff;width:25px;height:25px;flex:0 0 25px;border-radius:50%;display:grid;place-items:center;font-size:13px;color:#2a60a1}.filewrap{display:flex;flex-direction:column;gap:12px}.fakebrowser{border:1px solid #c8dae7;background:white;border-radius:15px;overflow:hidden;height:325px;display:flex;flex-direction:column}.browserbar{background:#edf3f7;padding:11px 14px;display:flex;align-items:center;gap:7px;color:#6b8194;font-size:13px;font-weight:900}.dot{width:10px;height:10px;border-radius:50%;background:#f2ad87}.dot:nth-child(2){background:#f5d68d}.dot:nth-child(3){background:#8acbb3}.browserbody{padding:13px 17px;flex:1;overflow:auto;background:#f9fbff;display:flex;flex-direction:column;gap:10px}.browserbody .bubble{font-size:14px;padding:10px 12px}.browserfoot{padding:10px 14px;background:white;border-top:1px solid #e1eaf2;display:flex;gap:10px;align-items:center;color:#8a9aaf;font-size:13px}.badge{display:inline-block;background:#e7f3ff;border-radius:30px;padding:6px 11px;color:#2c74ad;font-size:12px;font-weight:900}.checkrow{display:flex;gap:12px;align-items:center;background:white;border:1px solid #dce8f1;border-radius:14px;padding:11px 13px;margin-bottom:10px;font-size:15px;font-weight:900;color:#48627e;width:100%;text-align:left}.checkrow .sq{height:26px;width:26px;border:2px solid #abc3d8;border-radius:7px;display:grid;place-items:center;font-size:20px;color:white}.checkrow.done{background:#ebf9f1;border-color:#98d7b4;color:#216a49}.checkrow.done .sq{background:#4caf7f;border-color:#4caf7f}.quiz-question{font-size:20px;font-weight:900;color:#284f79;line-height:1.5;margin:8px 0 17px}.options{display:grid;gap:10px}.option{display:block;text-align:left;width:100%;padding:12px 15px;border:1px solid #cbddec;border-radius:12 /* Large visual objects for concept lessons. */
.display{padding:18px 21px}
.display h2{font-size:17px;margin:0 0 14px}
.info .lead{font-size:20px}
.info li{font-size:16px;line-height:1.46}
.tip{font-size:14px}
.chip{font-size:15px;padding:10px 14px}
.demo-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.demo-prompt{font-size:18px;font-weight:900;padding:16px;background:#e9f4ff;border-radius:14px;color:#2b5d8a}
.word-options{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.word-option{padding:15px 6px;border:2px solid #dce7f4;border-radius:12px;color:#345d88;font-weight:900;font-size:19px;background:white}
.word-option.active{border-color:#50ac87;background:#e3f8ec;color:#206a49}
.answer-card{background:#f3f8fd;border-radius:12px;padding:12px 16px;color:#415e78;font-size:17px;line-height:1.5}
.role-block{display:grid;grid-template-columns:112px 1fr;align-items:center;gap:10px;margin:8px 0}
.role-label{font-size:16px;color:#26669e;font-weight:900;text-align:center;padding:12px 6px;border-radius:10px;background:#e6f2fe}
.role-label.sys{color:#9b6b24;background:#fff0d3}.role-label.ai{color:#267850;background:#e2f5ea}
.role-message{padding:11px 14px;font-size:17px;line-height:1.36;border:1px solid #dbe5f0;border-radius:11px;background:white;color:#405c78}
.example-block{font-size:17px;line-height:1.57;background:white;border:1px solid #dae7f3;border-radius:14px;padding:18px;white-space:pre-wrap;min-height:148px;color:#3b5973}
.example-block b{color:#276ba6}
.metric{display:inline-block;border-radius:10px;background:#eef4fa;padding:8px 12px;font-size:16px;color:#39658c;font-weight:900}
.barchart{display:flex;flex-direction:column;gap:11px;margin:16px 3px 12px}
.bar-row{display:grid;grid-template-columns:112px 1fr 52px;align-items:center;gap:10px;font-size:17px;color:#42607c;font-weight:800}
.bar-track{height:22px;background:#e9eef5;border-radius:9px;overflow:hidden}
.bar-fill{height:100%;background:#6c9fd7;border-radius:9px;transition:width .25s}
.bar-row.filtered{opacity:.32}
.bar-row.filtered .bar-fill{background:#b9c7d2}
.bar-row.kept .bar-fill{background:#66b895}
.sample-pill{font-weight:900;background:#dff4e8;color:#286f50;border-radius:11px;padding:10px 14px;font-size:18px}
.note-line{color:#657d94;font-size:14px;margin-top:9px;line-height:1.5}
.historyline{position:relative;display:flex;flex-direction:column;gap:8px;margin:8px 0}
.history-role{display:flex;align-items:center;gap:12px;border-radius:12px;border:1px solid #dce7f0;background:white;padding:12px}
.history-role .role-dot{border-radius:10px;padding:8px 10px;min-width:105px;text-align:center;background:#deeeff;color:#27649e;font-size:15px;font-weight:900}
.history-role.system .role-dot{background:#ffeed7;color:#9a6a20}
.history-role.assistant .role-dot{background:#e1f5e9;color:#287d52}
.history-role span:last-child{font-size:16px;color:#48647e;line-height:1.35}
.window{border:2px solid #a4c7e8;background:#f5f9ff;border-radius:17px;padding:12px 14px;margin:12px 0}
.window-title{font-weight:900;color:#2e6fa1;font-size:15px;margin-bottom:9px}
.window-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.window-slot{background:#d9edff;border:1px solid #a7cce9;border-radius:10px;padding:22px 5px;text-align:center;color:#285e86;font-weight:900;font-size:15px}
.window-slot.faded{background:#f2e7e4;border-color:#e8c7bb;color:#a1796a;opacity:.6;text-decoration:line-through}
.window-slot.summary{background:#e4f5e9;border-color:#a7dab8;color:#29774d}
.flowbox{border:1px solid #cadcec;background:#fff;border-radius:12px;padding:18px 10px;text-align:center;flex:1;color:#2b5e88;font-weight:900;font-size:17px;min-width:0}
.flowbox small{display:block;font-size:13px;font-weight:700;color:#71849a;margin-top:10px;line-height:1.5}
.flow-arrow{font-size:27px;font-weight:900;color:#78a4c5}
.speech-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:9px}
.speech-row .speaker{font-size:14px;color:#527694;font-weight:900;min-width:75px;padding-top:9px}
.speech-row .message{font-size:17px;line-height:1.4;background:white;border:1px solid #d9e8f2;padding:9px 13px;border-radius:12px;flex:1;color:#47627d}
.speech-row .message.green{background:#e6f7ee;border-color:#bfe6d1}

.turn-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0}
.turn-card{background:#fff;border:1px solid #d6e4f0;border-radius:15px;padding:13px 13px 11px;min-width:0;position:relative}
.turn-card.later{border-color:#b6d9c8;background:#fbfffd}
.turn-head{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-bottom:12px;font-size:17px;color:#32638a;font-weight:900}
.turn-tag{font-size:12px;font-weight:900;color:#487b5c;background:#e6f5ea;border-radius:99px;padding:5px 8px;white-space:nowrap}
.turn-tag.missing{background:#fff0dc;color:#a16a30}
.turn-bubble{font-size:16px;line-height:1.38;border-radius:11px;padding:10px 11px;margin-top:7px;color:#415d78;border:1px solid #dce8f3;background:#edf5ff;min-height:68px}
.turn-bubble.ai{background:#ecf9f1;border-color:#cae6d4}
.turn-bubble b{display:block;font-size:13px;color:#376c92;margin-bottom:5px}
.turn-bubble.ai b{color:#327e51}
.turn-summary{font-size:15px;line-height:1.4;color:#45667f;background:#edf4fc;padding:10px 12px;border-radius:10px;margin-top:9px}
.historyline.compact{gap:5px;margin:6px 0}
.historyline.compact .history-role{padding:5px 9px;min-height:41px;border-radius:9px}
.historyline.compact .history-role .role-dot{min-width:94px;padding:5px 6px;font-size:14px}
.historyline.compact .history-role span:last-child{font-size:15px}
.historyline.compact + .history-note{font-size:13px;padding:5px 10px;margin-top:4px}
.history-role.new{border:2px solid #83c6a3;background:#f5fff8}
.history-role.new .role-dot{background:#c1ead1;color:#186d42}
.history-note{font-size:14px;color:#617b91;background:#edf5fd;border-radius:10px;padding:10px 12px;margin:8px 0 0;line-height:1.4}
.verify-message{border:1px solid #d6e5f1;background:#f4f8fd;border-radius:13px;padding:14px 16px;color:#41637e;font-size:18px;line-height:1.5;margin:10px 0}
.verify-message.wrong{background:#fff5e8;border-color:#f2cf9f}
.verify-result{border:1px solid #a9d8bf;background:#e9f9f0;border-radius:13px;padding:13px 15px;color:#376b52;font-size:17px;line-height:1.5;margin-top:13px}
.info{padding:20px 23px}
.info ul{gap:12px}
.quiz-question{font-size:21px}
.options{gap:10px}
.option{font-size:17px}

const SLIDES=[{"unit":1,"title":"LLM 怎麼產生一句話？","sub":"第一節｜先理解 AI 回答文字的方式","kind":"tokens","lead":"LLM 會參考前面的內容，一段接一段產生回答。","points":["AI 不是從固定答案表中挑選整句話。","它會估計下一個 token 的可能性，再繼續往下產生。","token 可以是一個字、詞的一部分或標點，不一定是完整詞語。"],"tip":"例子是教學示意；選項和機率不是實際模型的結果。"},{"unit":1,"title":"System 與 User Prompt","sub":"第一節｜同一個問題，也能有不同回答方式","kind":"roles","lead":"System 設定回答原則；User 提出這次的問題。","points":["System Prompt：例如「請用小學生懂的方式解釋」。","User Prompt：例如「什麼是黑洞？」","Assistant 是 AI 產生的回答；實際應用還可能有其他角色。"],"tip":"切換 System Prompt，看看同一個 User 問題如何改變呈現方式。"},{"unit":1,"title":"Zero-shot、One-shot、Few-shot","sub":"第一節｜可以直接問，也可以先給範例","kind":"shots","lead":"「shot」指的是放在 Prompt 中的示範範例數。","points":["Zero-shot：不附範例，直接交代任務。","One-shot：先給一個做法範例。","Few-shot：提供幾個範例，讓 AI 模仿規則或格式。"],"tip":"給範例是為了幫 AI 理解任務，不代表重新訓練模型。"},{"unit":1,"title":"Temperature：回答能有多少變化？","sub":"第一節｜改變下一個 token 的取樣分布","kind":"temperature","lead":"Temperature 影響抽取下一個 token 時的隨機程度。","points":["較低：通常更集中在高機率選項。","較高：較低機率選項也可能被選到。","數值高不保證更有創意，數值低也不保證正確。"],"tip":"調整滑桿，再按「抽一次」。機率以自訂數字示範，不是模型預測。"},{"unit":1,"title":"Top-k 與 Top-p：先選候選名單","sub":"第一節｜限制哪些 token 有機會被選到","kind":"sampling","lead":"兩種方法都先縮小下一個 token 的候選範圍。","points":["Top-k：只留下機率最高的 k 個選項。","Top-p：留下累積機率達到 p 的最小候選集合。","Temperature 會影響機率；Top-k / Top-p 負責篩選候選選項。"],"tip":"不同模型與 API 支援的設定不完全相同，不一定能同時調整三者。"},{"unit":1,"title":"第一節｜3 題概念練習","sub":"請直接選擇答案，檢查基本理解","kind":"quiz","lead":"先分清楚 Prompt、範例與生成參數的作用。","points":["System 與 User 的用途。","Zero-shot、One-shot、Few-shot 的差別。","Temperature、Top-k 與 Top-p 的意義。"],"tip":"可直接點選答案；選錯後會看到提示。","questions":[["希望 AI「用 12 歲學生懂的方式解釋」，適合放在哪種指示？",["System Prompt","Top-k 數值","對話頁面的字體大小"],0,"System 可設定整體回答原則；User 負責提出當次問題。","想想：哪個是指示 AI 如何回答，而不是選 token 的參數？"],["先給 AI 兩個分類範例，再請它分類新物品，屬於哪一種？",["Zero-shot","Few-shot","Temperature"],1,"Few-shot 就是提供幾個範例；One-shot 則只給一個。","題目明確說先提供兩個範例。"],["哪個說法正確？",["Top-k 是保留前 k 個候選 token","Temperature 愈低就一定答對","Top-p 是限制回答最多 p 個字"],0,"Top-k 保留機率最高的 k 個候選；其他兩種說法都不正確。","Top-k 的 k 代表候選選項的「數量」。"]]},{"unit":2,"title":"單輪與多輪，差在哪裡？","sub":"第二節｜重點是有沒有把前面的對話帶進來","kind":"turns","lead":"兩種模式都要有完整問答；差別在第二輪能否讀到第一輪。","points":["第一輪：User 發問，AI 回答，形成一次完整問答。","單輪：第二輪只收到新問題，不知道第一輪聊過什麼。","多輪：第二輪包含先前問答，才可以接續話題。"],"tip":"切換單輪／多輪，觀察右邊第二輪的 AI 回答有何不同。"},{"unit":2,"title":"多輪對話如何把歷史帶上？","sub":"第二節｜認識 User、Assistant 的問答紀錄","kind":"history","lead":"第二輪完成後，歷史中會多出新的一組 User 與 AI 問答。","points":["第一輪完成：System、User①、AI①。","第二輪送出：前面的歷史，再加 User②。","AI 回答後，才把 AI② 加入對話歷史。"],"tip":"切換兩輪，比較完整歷史；AI② 是生成後才存入的。"},{"unit":2,"title":"AI 的對話記憶不是無限的","sub":"第二節｜Context Window：模型一次能看的內容","kind":"context","lead":"模型每次能處理的文字長度有上限。","points":["聊天很長時，舊內容可能超出 Context Window。","應用程式可以選擇保留重點、摘要或刪減舊訊息。","網頁保存歷史，不代表每次都把所有歷史送給模型。"],"tip":"按下「對話變長」，看看舊內容可能如何離開可用範圍。"},{"unit":2,"title":"怎麼讓 Prompt 更容易得到想要的答案？","sub":"第二節｜任務、對象、限制、格式","kind":"betterprompt","lead":"Prompt 說清楚，輸出通常更容易符合需求。","points":["任務：你希望 AI 做什麼？","對象與限制：給誰看、長度多少？","輸出格式：表格、條列或固定欄位？"],"tip":"比較「幫我做計畫」和「幫國中生安排 20 分鐘複習」。"},{"unit":2,"title":"LLM 的回答一定正確嗎？","sub":"第二節｜AI 也可能產生看似合理的錯誤資訊","kind":"verify","lead":"AI 回答得很肯定，也不表示內容一定正確。","points":["LLM 可能產生不正確或沒有根據的答案。","重要資訊應比對可信的資料，而不是只看語氣。","查證後發現錯誤，可以要求 AI 修正，並再次核對。"],"tip":"按「對照資料」，找出這段 AI 示範回答哪裡錯了。"},{"unit":2,"title":"第二節｜3 題概念練習","sub":"從聊天方式到網頁應用，確認你真的理解","kind":"quiz","lead":"分清楚歷史訊息、Context Window，以及 AI 回答的可信度。","points":["單輪與多輪對話。","Context Window 的限制。","對 AI 回答進行查證。"],"tip":"每題都可直接作答，不需要逐步展開。","questions":[["第二次問「我喜歡什麼動物？」，要讓 AI 知道是貓，最需要什麼？",["只換成較高 Temperature","把上一輪「我喜歡貓」一併傳給 AI","把聊天視窗放大"],1,"多輪對話的關鍵，是模型能接收到相關的前文。","要回答關於先前內容的問題，就要提供先前內容。"],["聊天歷史很長、超出 Context Window 時，可能需要什麼做法？",["摘要重要內容","不再允許輸入任何問題","調大網頁字體"],0,"摘要或選擇性保留歷史，是處理上下文長度的一種方式。","Context Window 是模型一次能處理的文字範圍。"],["AI 很肯定地說了一件事，但你不確定真假，應該怎麼做？",["直接相信，因為 AI 很有信心","調高 Temperature 就會正確","比對可信資料，再判斷是否正確"],2,"AI 可能答錯。重要資訊應查證，不能只看回答是否流暢。","回答的語氣，不等於內容的正確性。"]]}];

let current=0;
const state={};
function slideState(){return state[current]??(state[current]={});}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function chip(label,action,selected=false){return `<button class="chip ${selected?'selected':''}" data-act="${action}">${esc(label)}</button>`;}
function row(role,msg){return `<div class="history-role ${role}"><span class="role-dot">${role==='system'?'System':role==='assistant'?'AI ①':'User ①'}</span><span>${esc(msg)}</span></div>`;}
function qvisual(p,st){
 const qi=st.qi??0, q=p.questions[qi], value=st[`answer${qi}`], ok=value===q[2];
 let feedback='先選一個答案。';
 if(value!==undefined) feedback=ok?'答對了。'+q[3]:'再想想：'+q[4];
 return `<div class="qnav"><span class="badge">第 ${qi+1} / 3 題</span><div class="toolbar" style="margin-top:0">${chip('上一題','qprev')}${chip('下一題','qnext')}</div></div><div class="quiz-question">${esc(q[0])}</div><div class="options">${q[1].map((v,i)=>`<button class="option ${value===i?(ok?'good':'bad'):''}" data-act="answer:${i}">${String.fromCharCode(65+i)}　${esc(v)}</button>`).join('')}</div><div class="feedback ${ok?'good':''}">${esc(feedback)}</div>`;
}
function bars(labels,probs,limit,percent=true){
 return `<div class="barchart">${labels.map((name,i)=>`<div class="bar-row ${limit?limit[i]?'kept':'filtered':''}"><span>${esc(name)}</span><span class="bar-track"><span class="bar-fill" style="display:block;width:${Math.round(probs[i]*100)}%"></span></span><span>${percent?Math.round(probs[i]*100)+'%':''}</span></div>`).join('')}</div>`;
}
function visual(p,st){
 switch(p.kind){
 case 'tokens':{
   const words=['打球','公園','看書','散步'];const n=st.token??-1;
   return `<h2>AI 正在接下一段文字（簡化示意）</h2><div class="demo-prompt">下課後，我想去 <span style="color:#e6a44e">＿＿＿</span></div><div class="word-options">${words.map((w,i)=>`<button class="word-option ${n===i?'active':''}" data-act="token:${i}">${w}</button>`).join('')}</div><div class="answer-card"><b>選出的下一段：</b>${n<0?'請選一個可能的接續內容。':`「下課後，我想去${words[n]}。」`}</div><div class="callout" style="margin-top:13px">LLM 依前文估計下一個 token，再反覆進行，形成完整回答。</div>`;
 }
 case 'roles':{
   const n=st.role??0;const sys=n===0?'請用 12 歲學生聽得懂的方式，簡單說明。':'請用兩個條列重點回答。';
   const answer=n===0?'黑洞就像宇宙中的超強吸引區，連光靠太近也很難逃走。':'① 黑洞是重力極強的天體區域。\n② 事件視界內的光無法逃離。';
   return `<h2>兩種 System 設定，User 問題完全相同</h2><div class="demo-row">${chip('容易理解','role:0',n===0)}${chip('條列重點','role:1',n===1)}</div><div class="role-block"><div class="role-label sys">System</div><div class="role-message">${esc(sys)}</div></div><div class="role-block"><div class="role-label">User</div><div class="role-message">什麼是黑洞？</div></div><div class="role-block"><div class="role-label ai">Assistant</div><div class="role-message" style="white-space:pre-line;background:#eff8f1">${esc(answer)}</div></div>`;
 }
 case 'shots':{
   const n=st.shots??0;const demo=[
     '任務：把物品分成「文具」或「生活用品」。\n請分類：水壺 →',
     '任務：把物品分成「文具」或「生活用品」。\n範例：鉛筆 → 文具\n請分類：水壺 →',
     '任務：把物品分成「文具」或「生活用品」。\n範例：鉛筆 → 文具\n範例：橡皮擦 → 文具\n範例：雨傘 → 生活用品\n請分類：水壺 →'
   ];
   return `<h2>同一個分類任務，只改示範範例數</h2><div class="demo-row">${chip('Zero-shot：0 個','shots:0',n===0)}${chip('One-shot：1 個','shots:1',n===1)}${chip('Few-shot：3 個','shots:2',n===2)}</div><div class="example-block">${esc(demo[n])}</div><div class="answer-card" style="margin-top:12px"><b>期待回答：</b>生活用品 <span class="small">（這是示意答案，不是即時模型輸出）</span></div>`;
 }
 case 'temperature':{
   const t=Number(st.temp??'0.7');const base=[.52,.28,.14,.06];
   const weight=base.map(x=>Math.pow(x,1/t)),sum=weight.reduce((a,b)=>a+b,0), probs=weight.map(x=>x/sum);
   const labels=['公園','圖書館','電影院','游泳池'];
   let choice=st.sample;
   return `<h2>下一個詞可能出現的機率（教學模擬）</h2><div class="demo-row">${['0.3','0.7','1.0','1.5'].map(v=>chip('T = '+v,'temp:'+v,Number(v)===t)).join('')}<span class="metric">Temperature ${t.toFixed(1)}</span></div><div class="small">句子：「週末下午，大家一起去＿＿＿」</div>${bars(labels,probs,null)}<div class="demo-row" style="margin-top:9px"><button class="chip selected" data-act="sample">抽一次</button>${choice===undefined?'<span class="small">按一下，看會抽到哪個候選詞。</span>':`<span class="sample-pill">這次抽到：${esc(labels[choice])}</span>`}</div>`;
 }
 case 'sampling':{
   const n=st.method??0;const names=['公園','圖書館','球場','海邊','夜市'],probs=[.40,.30,.15,.10,.05];
   const keep=n===0?[true,true,false,false,false]:n===1?[true,true,true,true,false]:n===2?[true,true,false,false,false]:[true,true,true,true,false];
   const explanation=[
    'Top-k = 2：只保留機率最高的 2 個選項。',
    'Top-k = 4：只保留機率最高的 4 個選項。',
    'Top-p = 0.70：前 2 個累積 70%，就先停下。',
    'Top-p = 0.90：前 4 個累積 95%，跨過 90% 門檻。'
   ];
   return `<h2>每次產生下一個 token 時，可以先縮小候選清單</h2><div class="demo-row">${chip('Top-k = 2','method:0',n===0)}${chip('Top-k = 4','method:1',n===1)}${chip('Top-p = 0.70','method:2',n===2)}${chip('Top-p = 0.90','method:3',n===3)}</div>${bars(names,probs,keep)}<div class="callout" style="margin-top:6px">${explanation[n]}</div>`;
 }
 case 'quiz':return qvisual(p,st);
 case 'turns':{
   const n=st.turns??0, multi=n===1;
   return `<h2>同一個話題，第一輪與第二輪都要有「問＋答」</h2><div class="demo-row">${chip('單輪：第二輪不帶前文','turns:0',!multi)}${chip('多輪：第二輪帶上前文','turns:1',multi)}</div><div class="turn-grid"><div class="turn-card"><div class="turn-head"><span>第 1 輪｜完整問答</span><span class="turn-tag">兩種模式相同</span></div><div class="turn-bubble"><b>User 問</b>我最喜歡的動物是貓。</div><div class="turn-bubble ai"><b>AI 答</b>原來你喜歡貓！想知道貓的哪些事情？</div></div><div class="turn-card later"><div class="turn-head"><span>第 2 輪｜再次發問</span><span class="turn-tag ${multi?'':'missing'}">${multi?'有前文':'沒有前文'}</span></div><div class="turn-bubble"><b>User 問</b>我剛才說最喜歡哪種動物？</div><div class="turn-bubble ai"><b>AI 答</b>${multi?'你剛才說最喜歡貓。':'這次的問題沒有提到，請再告訴我。'}</div></div></div><div class="turn-summary">${multi?'多輪：第 2 輪把「第一輪 User＋AI 問答」一起傳入，所以能知道你說過喜歡貓。':'單輪：第 2 輪只傳入新問題；沒有第一輪的 User＋AI 問答，就無法知道你先前說過什麼。'}</div>`;
 }
 case 'history':{
   const second=st.round??0;
   const first=row('system','請簡短而清楚地回答。')+row('user','我最喜歡的動物是貓。')+row('assistant','原來你喜歡貓！想知道貓的哪些事情？');
   const newUser=`<div class="history-role new"><span class="role-dot">User ②</span><span>我剛才說最喜歡哪種動物？</span></div>`;
   const newAssistant=`<div class="history-role new assistant"><span class="role-dot">AI ②</span><span>你剛才說最喜歡貓。</span></div>`;
   return `<h2>完成每輪後，對話歷史會多出一組 User＋AI</h2><div class="demo-row">${chip('第一輪完成','round:0',!second)}${chip('第二輪完成','round:1',!!second)}</div><div class="historyline ${second?'compact':''}">${first}${second?newUser+newAssistant:''}</div><div class="history-note">${second?'第 2 輪開始時：把前面的歷史＋User② 送給模型；模型產生回答後，才把 AI② 加入歷史。':'第 1 輪完成：保存 System、User①、AI①；接著可再加入新的問題。'}</div>`;
 }
 case 'context':{
   const n=st.context??0;const title=['短對話：內容放得下','對話很長：舊訊息可能放不下','整理重點：把重要資訊留下'][n];
   const parts=n===0?['System','第一次','第二次','新問題']:n===1?['很久以前','許多舊問答','最近問答','新問題']:['重點摘要','最近問答','新問題','回答空間'];
   const classNames=n===1?['faded','faded','','']:n===2?['summary','','','']:['','','',''];
   return `<h2>把 Context Window 想成「有限大小的工作桌」</h2><div class="demo-row">${chip('短對話','context:0',n===0)}${chip('對話變長','context:1',n===1)}${chip('保留重點','context:2',n===2)}</div><div class="window"><div class="window-title">${title}</div><div class="window-slots">${parts.map((v,i)=>`<div class="window-slot ${classNames[i]}">${esc(v)}</div>`).join('')}</div></div><div class="callout">${n===0?'內容短，重要資訊都能放進這次的輸入。':n===1?'超過上限時，程式可能必須刪減較舊內容；不是 AI 自動永遠記住。':'把重要資訊整理成摘要，可以減少重複傳送大量舊文字。'}</div><div class="note-line">示意圖：實際 Context Window 是 token 數量上限，容量依模型而異。</div>`;
 }
 case 'betterprompt':{
   const n=st.better??0;
   const q=n===0?'幫我做英文複習計畫。':'幫 12 歲學生安排 20 分鐘英文複習，分成 3 步，每步寫出時間，使用條列。';
   const a=n===0?'可以背單字、練習英文句子，再試著做練習題。':'① 單字 7 分鐘。\n② 簡單句型 7 分鐘。\n③ 自我測驗 6 分鐘。';
   return `<h2>一樣是英文複習，哪個問題更容易執行？</h2><div class="demo-row">${chip('問題 A：較模糊','better:0',n===0)}${chip('問題 B：更完整','better:1',n===1)}</div><div class="role-block"><div class="role-label">User</div><div class="role-message">${esc(q)}</div></div><div class="role-block"><div class="role-label ai">Assistant</div><div class="role-message" style="white-space:pre-line;background:#edf8f2">${esc(a)}</div></div><div class="callout" style="margin-top:14px">${n===0?'缺少對象、時間與輸出格式，回答可能比較籠統。':'有任務＋對象＋時間限制＋格式，較容易檢查成果。'}</div>`;
 }
 case 'verify':{
   const checked=st.verify??false;
   return `<h2>同一個問題：AI 說得肯定，就一定對嗎？</h2><div class="verify-message"><b>User 問：</b>臺灣最高的山是哪一座？</div><div class="verify-message wrong"><b>AI 回答示意：</b>「臺灣最高的山是雪山，海拔 3,886 公尺。」</div><div class="demo-row">${chip('先看 AI 回答','verify:0',!checked)}${chip('對照資料','verify:1',checked)}</div>${checked?'<div class="verify-result"><b>資料核對：</b>玉山 3,952 公尺；雪山 3,886 公尺。<br><b>結論：</b>最高峰是玉山，AI 把「雪山」說錯了。</div>':'<div class="answer-card">這句話讀起來很自然，但內容是否正確？點「對照資料」再判斷。</div>'}<div class="note-line">此為故意設計的錯誤回答，用來練習查證；不是即時 AI 輸出或即時上網查詢。</div>`;
 }
 default:return '';
 }
}
function render(){
 const p=SLIDES[current],st=slideState(),quiz=p.kind==='quiz';
 document.getElementById('deck').innerHTML=`<header><div class="school"><div class="avatar"><img src="${AVATAR}" alt="課程人物圖示"></div><div><b>人工智慧技術應用實作班</b><small>教學主題｜大型語言模型應用</small></div></div><div class="unit">第${p.unit===1?'一':'二'}節</div></header><div class="heading"><h1>${esc(p.title)}</h1><p>${esc(p.sub)}</p></div><main class="stage"><section class="display">${visual(p,st)}</section><aside class="info"><div class="tag">${quiz?'學習檢核':'這一頁的重點'}</div><p class="lead">${esc(p.lead)}</p><ul>${p.points.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="tip">${esc(p.tip)}</div></aside></main><footer class="footer"><span class="hint">← → 換頁｜G 跳頁</span><div class="track"><div class="progress" style="width:${100*(current+1)/SLIDES.length}%"></div></div><span class="count">${String(current+1).padStart(2,'0')} / 12</span><div class="nav"><button data-nav="prev" ${current===0?'disabled':''}>← 上一頁</button><button data-nav="overview">跳頁 G</button><button class="primary" data-nav="next" ${current===11?'disabled':''}>下一頁 →</button></div></footer>`;
}
function go(i){current=Math.max(0,Math.min(SLIDES.length-1,i));render();}
function act(raw){
 const s=slideState(),[a,value]=raw.split(':');
 switch(a){
 case 'token':s.token=Number(value);break;
 case 'role':s.role=Number(value);break;
 case 'shots':s.shots=Number(value);break;
 case 'temp':s.temp=value;delete s.sample;break;
 case 'method':s.method=Number(value);break;
 case 'turns':s.turns=Number(value);break;
 case 'round':s.round=Number(value);break;
 case 'context':s.context=Number(value);break;
 case 'better':s.better=Number(value);break;
 case 'verify':s.verify=value==='1';break;
 case 'sample':{
  const t=Number(s.temp??'0.7'),base=[.52,.28,.14,.06];
  const weights=base.map(v=>Math.pow(v,1/t));let roll=Math.random()*weights.reduce((a,b)=>a+b,0);
  s.sample=weights.findIndex(v=>(roll-=v)<=0);if(s.sample<0)s.sample=3;break;
 }
 case 'answer':s[`answer${s.qi??0}`]=Number(value);break;
 case 'qnext':s.qi=((s.qi??0)+1)%3;break;
 case 'qprev':s.qi=((s.qi??0)+2)%3;break;
 }
 render();
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.act)act(b.dataset.act);
 else if(b.dataset.nav==='prev')go(current-1);
 else if(b.dataset.nav==='next')go(current+1);
 else if(b.dataset.nav==='overview'){
  const listing=SLIDES.map((p,i)=>`${i+1}. ${p.title}`).join('\n');
  const choice=prompt('請輸入頁碼 1–12：\n'+listing,current+1);
  if(choice!==null&&/^\d+$/.test(choice.trim()))go(Number(choice)-1);
 }
});
document.addEventListener('keydown',e=>{
 if(/input|textarea/i.test(e.target.tagName))return;
 if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(current+1);}
 if(e.key==='ArrowLeft'){e.preventDefault();go(current-1);}
 if(e.key.toLowerCase()==='g'){document.querySelector('[data-nav="overview"]').click();}
});
function resize(){const factor=Math.min(innerWidth/1280,innerHeight/720)*.97;document.getElementById('deck').style.transform=`scale(${factor})`;}
window.addEventListener('resize',resize);
render();resize();
</script></body></html>
