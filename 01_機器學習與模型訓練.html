<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>人工智慧技術應用實作班｜機器學習與模型訓練</title>
<style>
:root{
  --paper:#fbf7ee; --ink:#2d3142; --muted:#6d7485; --navy:#2a5aa5; --blue:#6ca8ff; --mint:#d8f4ea;
  --gold:#ffe2a8; --rose:#ffd4c7; --green:#58a687; --shadow:0 18px 48px rgba(39,53,80,.14);
  font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",Arial,sans-serif;
}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:linear-gradient(180deg,#f5efe3,#ece8f5);display:grid;place-items:center;color:var(--ink)}
body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(rgba(112,126,160,.1) 1px,transparent 1px);background-size:16px 16px;opacity:.6;pointer-events:none}
button,input{font:inherit} button{cursor:pointer}
#deck{position:absolute;width:1280px;height:720px;left:50%;top:50%;margin:0;transform:translate(-50%,-50%);transform-origin:center;overflow:hidden;border-radius:24px;background:linear-gradient(180deg,#fffdf8,#fbf7ee);box-shadow:var(--shadow);border:1px solid rgba(100,110,140,.15)}
#deck::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 3% 4%,rgba(255,221,157,.45),transparent 22%),radial-gradient(circle at 94% 15%,rgba(190,230,255,.42),transparent 18%),linear-gradient(90deg,rgba(72,89,130,.06),rgba(72,89,130,0) 110px);pointer-events:none}
header{position:absolute;left:58px;right:58px;top:28px;height:54px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.brand{display:flex;align-items:center;gap:14px}
.brand .icon{width:46px;height:46px;border-radius:16px;background:#fff;display:grid;place-items:center;box-shadow:0 8px 18px rgba(78,107,164,.14);border:1px solid rgba(110,130,170,.18);overflow:hidden}.brand .icon img{width:100%;height:100%;display:block;object-fit:cover}
.brand .txt{display:flex;flex-direction:column;gap:2px}
.brand .txt strong{font-size:17px;letter-spacing:.2px}
.brand .txt span{font-size:12px;color:var(--muted)}
.toplabels{display:flex;align-items:center;gap:10px}
.chip{padding:8px 14px;border-radius:999px;font-size:12px;font-weight:800;border:1px solid rgba(96,121,173,.18);background:#fff;color:#425275;box-shadow:0 4px 10px rgba(81,103,147,.06)}
.chip.primary{background:#eef5ff;color:#2856a2}
.chip.mint{background:#effbf6;color:#287d63}
.slideTitle{position:absolute;left:88px;right:88px;top:104px;text-align:center}
.eyebrow{font-size:12px;letter-spacing:2px;color:#7d6a2f;font-weight:900}
.slideTitle h1{font-size:40px;line-height:1.2;margin:12px 0 8px;color:#26324a}
.slideTitle p{margin:0;color:#727b8d;font-size:17px}
.content{position:absolute;left:58px;right:58px;top:210px;height:354px;display:grid;grid-template-columns:690px 1fr;gap:22px}
.scene,.explain{border-radius:24px;border:1px solid rgba(122,137,169,.18);box-shadow:0 12px 30px rgba(37,55,85,.08);overflow:hidden}
.scene{position:relative;background:linear-gradient(180deg,#fff,#fffcf5);padding:22px 24px;display:flex;flex-direction:column;gap:12px}
.scene::before{content:"";position:absolute;top:0;left:0;right:0;height:8px;background:linear-gradient(90deg,#ffd89b,#a9e4d0,#a9c8ff)}
.explain{background:linear-gradient(180deg,#fffefb,#f8fbff);padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.explain .smallcap{font-size:12px;font-weight:900;color:#4261a8;letter-spacing:1.2px}
.explain .prose{font-size:15px;line-height:1.78;color:#455066;overflow:auto;max-height:164px;padding-right:4px}
.explain .example{padding:10px 12px;border-radius:14px;background:#fff5e8;border:1px solid rgba(222,191,135,.35);font-size:13px;line-height:1.55;color:#69593a}
.explain .check{margin-top:auto;padding:11px 12px;border-radius:14px;background:#edf8f4;border:1px solid rgba(141,212,184,.45);font-size:13px;font-weight:800;line-height:1.52;color:#266b55}
.scene-head{font-size:11px;font-weight:900;letter-spacing:1.5px;color:#8a8f98;text-transform:uppercase}
.scene-grid-3{display:flex;gap:15px;align-items:stretch;justify-content:center;flex:1}
.concept-card{flex:1;min-width:0;background:#fff;border:1px dashed rgba(110,128,164,.35);border-radius:22px;padding:18px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;box-shadow:0 7px 14px rgba(70,93,143,.05)}
.concept-card strong{font-size:24px;color:#2450a0}
.concept-card em{font-style:normal;color:#6d7482;font-size:13px;line-height:1.45}
.concept-card small{font-size:12px;color:#8892a0}
.iconball{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:28px;font-weight:900;background:#eff5ff;color:#2f61b3;box-shadow:inset 0 2px 0 rgba(255,255,255,.7)}
.iconball.yellow{background:#fff4d9;color:#b98018} .iconball.green{background:#eaf9f2;color:#198466}
.flowrow{display:flex;gap:12px;align-items:center;justify-content:center;flex:1}
.flowstep{flex:1;min-width:0;background:#fff;border:1px solid rgba(119,136,173,.18);border-radius:22px;padding:24px 15px;text-align:center;font-size:19px;font-weight:900;color:#39567f;box-shadow:0 10px 20px rgba(72,92,132,.07)}
.flowstep small{display:block;margin-top:8px;font-size:13px;font-weight:600;color:#7f8a9b;line-height:1.5}
.arrow{font-size:26px;color:#9fb0cd;font-weight:900}
.data-table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border-radius:18px;font-size:16px;text-align:center;box-shadow:0 8px 18px rgba(77,98,135,.06)}
.data-table th,.data-table td{padding:10px;border:1px solid rgba(125,141,173,.14)}
.data-table th{background:#ecf3ff;color:#2c5ba4;font-size:15px} .data-table td:first-child{background:#fbfcff;font-weight:800;color:#50617c} .data-table td:last-child,.data-table th:last-child{background:#fff7e8;color:#9b6f1f}
.svgchart{width:100%;flex:1;min-height:0}
.controls-viz{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#667388}
.controls-viz input[type=range]{accent-color:#456fbc;width:200px}
.controls-viz button{border:0;background:#345fae;color:#fff;border-radius:12px;padding:9px 14px;font-weight:900;box-shadow:0 8px 14px rgba(52,95,174,.18)}
.controls-viz .ghost{background:#eef4ff;color:#345fae}
.controls-viz b{color:#234f9f;font-size:18px;font-variant-numeric:tabular-nums}
.statpanel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.statbox{background:#fff;border:1px solid rgba(120,136,166,.17);border-radius:16px;padding:11px 12px;box-shadow:0 6px 12px rgba(73,92,130,.06)}
.statbox .cap{font-size:11px;font-weight:900;letter-spacing:1px;color:#7f8794;text-transform:uppercase} .statbox b{display:block;font-size:24px;color:#264e99;margin-top:4px}
.statbox small{display:block;font-size:12px;line-height:1.4;color:#697486;margin-top:4px}
.mathcard{background:#fffefb;border:1px solid rgba(117,128,160,.16);border-radius:18px;padding:12px 14px}
.mathcard p{margin:0;color:#5a6372;font-size:12px;font-weight:800} math{font-size:1.05em}
.formulaCard{flex:1;background:#fff;border:1px solid rgba(117,129,159,.18);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;text-align:center;box-shadow:0 7px 14px rgba(70,93,143,.05)}
.formulaCard:nth-child(2){background:#f5fff9}
.formulaCard strong{font-size:24px;color:#284f9c} .formulaCard:nth-child(2) strong{color:#1b8b67}
.two-compare{display:flex;gap:16px;align-items:stretch;flex:1} .comparebox{flex:1;background:#fff;border:1px solid rgba(120,136,166,.17);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;justify-content:center;align-items:center;text-align:center}
.comparebox:nth-child(2){background:#f5fff9}
.comparebox h3{margin:0;color:#365792;font-size:22px} .comparebox p{margin:0;color:#59667b;font-size:15px;line-height:1.6}
.splittiles{display:grid;grid-template-columns:repeat(10,1fr);gap:10px;max-width:620px;align-self:center;width:100%}
.splittiles span{height:48px;border-radius:12px;border:1px solid #adc5f4;background:#cfe0fe;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)} .splittiles span.test{background:#ffe2aa;border-color:#efc77d}
.legend{display:flex;justify-content:center;gap:20px;font-size:13px;font-weight:800;color:#617084} .swatch{display:inline-block;width:11px;height:11px;border-radius:4px;background:#9bc0f5;margin-right:5px} .swatch.orange{background:#f1be6c}
.quiz-options{display:flex;gap:12px;flex:1;align-items:stretch} .quiz-options button{flex:1;border-radius:18px;border:1px solid rgba(123,137,166,.18);background:#fff;padding:18px 12px;color:#42546f;font-size:18px;font-weight:900;box-shadow:0 8px 16px rgba(73,92,130,.06)} .quiz-options button.correct{background:#eaf9f2;border-color:#bfe7d4;color:#1f775d} .quiz-options button.wrong{background:#fff0ee;border-color:#ffc7bd;color:#b05643}
.quiz-message{text-align:center;font-size:14px;font-weight:800;color:#6f7b89;padding-top:6px}
.stepzone{position:absolute;left:58px;right:58px;top:580px;height:64px;display:flex;gap:10px;align-items:stretch}
.step{flex:1;min-width:0;border-radius:16px;background:rgba(255,255,255,.76);border:1px solid rgba(125,140,170,.18);padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;color:#596477;opacity:.22;transform:translateY(8px);filter:blur(1px);transition:all .35s}
.step .num{min-width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#eff4ff;color:#2d5ba6;font-size:12px;font-weight:900}
.step.revealed{opacity:1;transform:none;filter:none} .step.active{background:#eef5ff;border-color:#cfe0ff;color:#234f9f;box-shadow:0 10px 16px rgba(86,119,179,.12)}
footer{position:absolute;left:58px;right:58px;bottom:12px;height:52px;display:flex;align-items:center;gap:14px;border-top:1px solid rgba(124,140,170,.18);font-size:12px;color:#7e8794}
.progress-wrap{height:5px;flex:1;border-radius:999px;background:#e7e9ef;overflow:hidden} .progress{height:100%;width:0;background:linear-gradient(90deg,#f2c66d,#6bb394,#5b8be8);transition:width .25s}
.navright{margin-left:auto;display:flex;align-items:center;gap:8px} footer button{border-radius:12px;border:1px solid rgba(124,140,170,.18);background:#fff;color:#54667f;padding:9px 12px;font-weight:900} footer .next{background:#345fae;color:#fff;border-color:#345fae}
.pagecounter{min-width:100px;text-align:center;font-weight:900;color:#55657e;font-variant-numeric:tabular-nums} .tiny{font-size:11px;color:#9098a5}
.overlay{position:absolute;inset:0;background:rgba(29,38,57,.68);display:none;align-items:center;justify-content:center;z-index:50} .overlay.show{display:flex} .modal{width:860px;max-height:620px;background:#fff;border-radius:24px;padding:24px 28px;overflow:auto;box-shadow:0 18px 60px rgba(0,0,0,.25)} .modal h2{margin:0 0 12px;color:#26344d} .modal p{font-size:16px;line-height:1.7;color:#4f5e76} .modal button{border:0;border-radius:12px;background:#eef4ff;color:#315baf;padding:10px 14px;font-weight:900} .slidegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px} .slidegrid button{text-align:left;line-height:1.45} .slidegrid button.curr{background:#dce9ff}
.mini-table{font-size:12px;color:#556276;line-height:1.55;max-height:84px;overflow:auto;border-top:1px dashed rgba(125,140,170,.25);padding-top:8px}
.note-pin{position:absolute;right:18px;top:16px;background:#fff7d8;border:1px solid rgba(214,182,107,.4);padding:4px 10px;border-radius:999px;font-size:11px;font-weight:900;color:#8a6a10;box-shadow:0 4px 10px rgba(166,135,55,.1)}
.cover-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:center;flex:1} .hero-card{background:#fff;border:1px solid rgba(122,137,169,.18);border-radius:24px;padding:20px;box-shadow:0 10px 18px rgba(73,92,130,.06)} .hero-card h3{margin:0 0 10px;color:#294a8c;font-size:28px} .hero-card p{margin:0;color:#59657a;line-height:1.75;font-size:16px} .hero-list{display:grid;gap:10px} .hero-list div{padding:13px 15px;border-radius:16px;background:#fff;border:1px dashed rgba(122,137,169,.26);font-weight:800;color:#4c5c74}

/* 封面為教學導入，不是產品特色介紹。 */
.cover-grid{grid-template-columns:1.05fr .95fr;align-items:stretch;gap:18px;width:100%;min-height:0}
.hero-card{padding:22px 22px 19px;justify-content:center;display:flex;flex-direction:column;gap:10px;border-radius:20px}
.hero-card h3{font-size:26px;line-height:1.32;color:#263956;margin:0}
.hero-card p{font-size:14px;line-height:1.7;color:#52617a;margin:0}
.cover-kicker{font-size:12px;font-weight:900;letter-spacing:1px;color:#5275af}
.cover-mascot{display:flex;align-items:center;gap:10px;color:#ad7b40;font-size:12px;font-weight:900}
.cover-mascot svg{width:37px;height:37px;padding:3px;border-radius:12px;background:#fff0de;border:1px solid #f4dec5}
.cover-note{font-size:13px;color:#826027;background:#fff4df;border-radius:12px;padding:10px 12px;font-weight:750;line-height:1.55}
.lesson-agenda{display:flex;flex-direction:column;justify-content:center;gap:10px;padding:8px 0;min-width:0}
.agenda-title{font-size:16px;font-weight:900;color:#435672;margin:0 0 2px}
.agenda-item{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid #e1e7ef;border-radius:17px;padding:12px;min-width:0}
.agenda-num{display:grid;place-items:center;min-width:32px;width:32px;height:32px;background:#e8f1ff;color:#39629c;border-radius:10px;font-size:12px;font-weight:900}
.agenda-item:nth-of-type(3) .agenda-num{background:#fff1dd;color:#ac7c3d}
.agenda-item:nth-of-type(4) .agenda-num{background:#e7f7ee;color:#397e63}
.agenda-item b{display:block;font-size:15px;color:#344963;margin-bottom:4px}
.agenda-item small{display:block;color:#77859a;font-size:12px;line-height:1.4}

/* 可操作頁面的圖表與滑桿應維持在同一張投影片內。 */
.scene:has(#linearPlot),.scene:has(#pcaPlot),.scene:has(#kmeansPlot){padding:17px 20px 14px;gap:8px}
.scene:has(#linearPlot)>div:nth-child(2),.scene:has(#pcaPlot)>div:nth-child(2),.scene:has(#kmeansPlot)>div:nth-child(2){min-height:0;overflow:hidden}
.scene:has(#linearPlot)>.controls-viz,.scene:has(#pcaPlot)>.controls-viz,.scene:has(#kmeansPlot)>.controls-viz{flex-shrink:0;margin-top:0;min-height:36px;gap:7px}
.scene:has(#linearPlot) .controls-viz input[type=range]{width:92px}
.scene:has(#linearPlot) .controls-viz b{font-size:15px}
.scene:has(#linearPlot) .controls-viz button{padding:7px 10px;font-size:12px}
.scene:has(#linearPlot) .mathcard,.scene:has(#pcaPlot) .mathcard,.scene:has(#kmeansPlot) .mathcard{padding:8px 9px;border-radius:13px}
.scene:has(#linearPlot) .mathcard p,.scene:has(#pcaPlot) .mathcard p,.scene:has(#kmeansPlot) .mathcard p{font-size:11px}
.scene:has(#linearPlot) .mathcard math,.scene:has(#pcaPlot) .mathcard math,.scene:has(#kmeansPlot) .mathcard math{font-size:.93em}
.scene:has(#linearPlot)>div:nth-child(2)>div:nth-child(2),.scene:has(#pcaPlot)>div:nth-child(2)>div:nth-child(2),.scene:has(#kmeansPlot)>div:nth-child(2)>div:nth-child(2){min-height:0;overflow:hidden;gap:7px!important}
.model-readout{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;min-width:0}
.model-readout>div{background:#f7faff;border:1px solid #e0e8f5;padding:6px 5px;border-radius:11px;min-width:0;text-align:center}
.model-readout small{display:block;white-space:nowrap;font-size:10px;font-weight:800;color:#737f91;line-height:1.5}
.model-readout b{display:block;font-size:16px;line-height:1.45;color:#2852a0;font-variant-numeric:tabular-nums;white-space:nowrap}
.concept-mini{font-size:12px;line-height:1.55;color:#53657f;background:#f8fbff;padding:8px 9px;border-radius:11px}
.km-status{font-size:12px;line-height:1.45;color:#53657f;background:#f8fbff;padding:7px 9px;border-radius:11px;min-height:45px;max-height:64px;overflow:auto}
.scene:has(#linearPlot) #linearTable{max-height:48px;font-size:11px;overflow:auto}
.scene:has(#kmeansPlot) #kmPanel{min-width:0}
.scene:has(#pcaPlot) #pcaStats{display:flex;flex-direction:column;gap:7px;min-height:0}
.scene:has(#pcaPlot) #pcaPlot,.scene:has(#kmeansPlot) #kmeansPlot,.scene:has(#linearPlot) #linearPlot{height:100%;min-width:0;min-height:0}

/* ---- 課堂視覺化區塊：圖形主導，操作列固定可見 ---- */
.scene:has(.reg-figure), .scene:has(.fit-matrix),.scene:has(.constraint-panels),.scene:has(.reg-plotrow),.scene:has(.pca-stage){padding:15px 18px 12px;gap:7px}
.scene:has(.reg-figure)>.scene-head,.scene:has(.fit-matrix)>.scene-head,.scene:has(.constraint-panels)>.scene-head,.scene:has(.reg-plotrow)>.scene-head,.scene:has(.pca-stage)>.scene-head{flex:0 0 auto;font-size:12px}
.reg-figure{display:grid;grid-template-columns:minmax(0,1.24fr) minmax(0,.76fr);gap:10px;min-height:0;flex:1}
#linearPlot{height:100%;min-height:0;overflow:hidden}#linearPlot svg{height:100%;width:100%;display:block}
.reg-work{display:flex;flex-direction:column;gap:4px;min-height:0;background:#fafcff;border:1px solid #e4ecf6;border-radius:14px;padding:6px;overflow:hidden}
.reg-equation{font-size:14px;font-weight:850;color:#325ba0;white-space:nowrap;text-align:center}
.reg-mse{display:flex;align-items:center;justify-content:space-between;background:#eaf4ff;border-radius:9px;padding:4px 8px;gap:8px}
.reg-mse small{font-size:11px;font-weight:850;color:#526c93}.reg-mse strong{font-size:19px;font-variant-numeric:tabular-nums;color:#1e568f}
.reg-table-head{font-size:11px;font-weight:800;color:#677a94;text-align:center}
.reg-table{display:grid;grid-template-columns:1fr;gap:1px;min-height:0;overflow:visible;flex:1}
.reg-entry{display:grid;grid-template-columns:44px 1fr 1fr;gap:4px;align-items:center;font-size:10.4px;line-height:1.08;padding:1px 5px;background:white;border:1px solid #edf1f7;border-radius:5px;font-variant-numeric:tabular-nums;color:#526178}
.reg-entry span:first-child{font-weight:850;color:#35589b}
.reg-entry span:last-child{text-align:right;color:#34694e}
.reg-controls,.pca-controls,.constraint-controls{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:7px;min-height:29px;font-size:12px;font-weight:850;color:#536781}
.reg-controls input[type=range]{width:79px;accent-color:#4879c6}.reg-controls b{min-width:24px;font-size:13px;text-align:center;font-variant-numeric:tabular-nums;color:#2455a1}

/* English: Compact confusion-matrix cards so no evaluation metric is clipped. */
/* 中文：縮小混淆矩陣資訊卡間距，確保 F1 與評估解釋完整呈現。 */
.scene:has(.cm-lab) .cm-summary{gap:3px;padding:6px 7px}

/* English: Make actual/predicted labels adjacent and label both confusion-matrix axes. */
/* 中文：縮小真實與模型預測的欄距，混淆矩陣改用有標題的橫縱軸。 */
.scene:has(.cm-lab) .cm-body{grid-template-columns:minmax(0,.93fr) minmax(0,1.07fr);gap:8px}
.scene:has(.cm-lab) .cm-samples{padding:8px 6px;gap:4px}

.scene:has(.cm-lab) .cm-row.heading{min-height:18px;font-size:10px}
.scene:has(.cm-lab) .cm-guess{padding:3px 2px}
.scene:has(.cm-lab) .cm-summary{padding:7px 8px;gap:6px}
.cm-matrix-title{font-size:12px;font-weight:900;color:#315b91;text-align:center}
.scene:has(.cm-lab) .cm-matrix{display:grid;grid-template-columns:17px 35px minmax(0,1fr) minmax(0,1fr);grid-template-rows:16px 17px 42px 42px;gap:3px;flex:0 0 auto;align-items:stretch}

.cm-axis-col-pos{grid-column:3;grid-row:2}.cm-axis-col-neg{grid-column:4;grid-row:2}
.cm-axis-y{grid-column:1;grid-row:3 / 5;writing-mode:vertical-rl;text-orientation:upright;transform:none;display:grid;place-items:center;font-size:10px;font-weight:900;color:#365f90;letter-spacing:.6px}
.cm-axis-row{display:grid;place-items:center;text-align:center;font-size:9.5px;font-weight:850;border-radius:5px;background:#eef3fb;color:#516d8d}
.cm-axis-row-pos{grid-column:2;grid-row:3}.cm-axis-row-neg{grid-column:2;grid-row:4}

.scene:has(.cm-lab) .cm-matrix .cm-cell b{font-size:16px;line-height:1.1}
.scene:has(.cm-lab) .cm-matrix .cm-cell strong{font-size:10px}
.scene:has(.cm-lab) .cm-matrix .cm-cell small{font-size:9px;white-space:nowrap;letter-spacing:-.2px}
.scene:has(.cm-lab) .cm-matrix .cm-cell:nth-last-child(4){grid-column:3;grid-row:3}
.scene:has(.cm-lab) .cm-matrix .cm-cell:nth-last-child(3){grid-column:4;grid-row:3}
.scene:has(.cm-lab) .cm-matrix .cm-cell:nth-last-child(2){grid-column:3;grid-row:4}
.scene:has(.cm-lab) .cm-matrix .cm-cell:nth-last-child(1){grid-column:4;grid-row:4}

/* English: PCA scores are centered projections, not copies of either input feature. */

.pca-stage{grid-template-columns:minmax(0,1.17fr) minmax(0,.83fr);gap:9px}

.pca-info{font-size:10px;line-height:1.32;padding:5px 7px}
.pca-conclusion{font-size:10px;line-height:1.3;padding:5px 6px}


/* English: Align the four metrics in a compact two-by-two grid inside the matrix panel. */
/* 中文：四項分類指標使用固定兩列與一致間距，避免底部卡片超出容器。 */
.scene:has(.cm-lab) .cm-summary{gap:5px;min-width:0;overflow:hidden}

.corr-lab{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}

.corr-values{display:grid;grid-template-columns:1fr;gap:4px}

.corr-formula{font-size:10.6px;line-height:1.43;color:#4e6885;padding:6px 7px;background:#fff3df;border-radius:7px;min-height:49px}
.corr-warning{margin-top:auto;background:#edf8f2;border-radius:7px;padding:6px 7px;font-size:10.6px;line-height:1.43;color:#36674f}

.corr-controls button.selected{background:#3868b4;color:#fff;border-color:#3868b4}
.corr-metric-controls button{flex:0 1 165px;font-size:12px}
.corr-hint{flex:0 0 auto;color:#59738e;font-size:10.4px;line-height:1.3;text-align:center;min-height:12px;white-space:nowrap}
.corr-point{cursor:pointer}
.corr-point:focus{outline:2px solid #d4893c}


/* English: Keep the correlation coefficient summary and interpretation fully inside the fixed 690×354 teaching panel. */
/* 中文：壓縮相關係數小卡、公式與提示的垂直間距，避免底部說明被情境按鈕覆蓋。 */
.scene:has(.corr-lab) .corr-side{padding:7px 8px;gap:3px}
.scene:has(.corr-lab) .corr-side-head{font-size:10.9px;line-height:1.2}
.scene:has(.corr-lab) .corr-values{gap:3px}
.scene:has(.corr-lab) .corr-value{min-height:27px;padding:3px 7px}
.scene:has(.corr-lab) .corr-value span{font-size:11.1px}
.scene:has(.corr-lab) .corr-value strong{font-size:15.7px}
.scene:has(.corr-lab) .corr-formula{padding:4px 6px;min-height:0!important;font-size:10px;line-height:1.3}
.scene:has(.corr-lab) .corr-warning{margin-top:auto;padding:4px 5px;font-size:9.8px;line-height:1.28}
/* English: Two related but distinct correlation questions remain visible without a second slide. */
/* 中文：同頁並列顯示「輸入彼此相關」與「輸入對答案相關」，防止把相關係數誤認為只能比較 X 與 y。 */
.scene:has(.corr-lab) .corr-purpose{display:flex;align-items:center;gap:8px;letter-spacing:0;font-size:11.3px;white-space:nowrap}
.corr-purpose span{display:inline-flex;align-items:center;justify-content:center;min-height:22px;padding:3px 10px;border-radius:7px;border:1px solid #d8e2ee}
.corr-purpose .corr-x-focus{background:#e6f1ff;color:#245998;border-color:#b4cfe9}
.corr-purpose .corr-y-note{background:#fff5e8;color:#866125;border-color:#eddbb8}
.scene:has(.corr-lab) .corr-side{gap:4px}
.scene:has(.corr-lab) .corr-formula{min-height:53px;font-size:10.7px;line-height:1.38}
.scene:has(.corr-lab) .corr-warning{font-size:10.7px;line-height:1.35}
.scene:has(.corr-lab) .corr-figure{min-height:0}
.scene:has(.corr-lab) .corr-hint{font-size:10px;white-space:normal;line-height:1.25}

/* English: Make the Pearson, Spearman, and Kendall findings visibly distinct. */
/* 中文：三種相關係數各有專屬提示外觀，避免把名次關係誤當線性共線性。 */
.corr-warning[data-method="0"]{background:#eaf4ff;color:#24558e}
.corr-warning[data-method="1"]{background:#f3efff;color:#594a91}
.corr-warning[data-method="2"]{background:#e9f7ed;color:#356f56}
/* English: Fit the feature selection experiment into the existing explanation panel. */
/* 中文：在原有右側說明卡放入特徵增減互動，不新增投影片且避免溢出。 */
.explain:has(.corr-feature-demo){padding:13px 17px;gap:6px}
.explain:has(.corr-feature-demo) .prose{font-size:12.35px;line-height:1.42;overflow:auto;min-height:0;padding-right:2px}
.explain:has(.corr-feature-demo) .example{padding:6px 9px;font-size:11.4px;line-height:1.35}
.explain:has(.corr-feature-demo) .check{padding:7px 9px;font-size:11.4px;line-height:1.35}
.corr-prose-intro{color:#4b5c72;font-size:12.25px;line-height:1.42}
.corr-prose-intro b{color:#315b98}
.corr-feature-demo{background:#f6faff;border:1px solid #dce9fb;border-radius:11px;margin:5px 0 3px;padding:7px 8px;display:flex;flex-direction:column;gap:5px}
.corr-feature-title{font-size:12.5px;font-weight:900;color:#2c5997;line-height:1.25}
.corr-feature-title small{font-size:10px;font-weight:650;color:#6f7f97}
.corr-feature-buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.corr-feature-buttons button{border:1px solid #cadbf1;border-radius:7px;background:#fff;color:#45678b;padding:4px 2px;font-size:10.9px;line-height:1.2;font-weight:850;cursor:pointer}
.corr-feature-buttons button.selected{background:#3869b5;border-color:#3869b5;color:#fff}
.corr-feature-buttons button:focus-visible{outline:2px solid #dfaa57;outline-offset:1px}
.corr-feature-preview{display:flex;gap:4px;align-items:center;flex-wrap:wrap;min-height:23px}
.corr-feature-matrix{color:#2b548f;font-weight:900;font-size:10.8px;margin-right:2px;white-space:nowrap}
.corr-feature-chip{font-size:10.35px;font-weight:850;color:#2b608c;background:#e4f2ff;border:1px solid #a8c8ee;border-radius:6px;padding:3px 5px;white-space:nowrap}
.corr-feature-chip.added{background:#e6f7ee;border-color:#9ad3b4;color:#247356}
.corr-feature-advice{font-size:10.5px;line-height:1.35;color:#586d86}
.corr-feature-conclusion{font-size:11.2px;line-height:1.35;color:#486351}

/* English: Two compact explanatory views share the right column without sacrificing the original interactive scatterplot. */
/* 中文：同頁切換選用時機與特徵增減，保留圖表與既有操作並避免文字溢出。 */
.explain:has(.corr-info-tabs){padding:12px 16px;gap:5px}
.explain:has(.corr-info-tabs) .prose{font-size:12px;line-height:1.3;max-height:none;min-height:0;overflow:visible;display:flex;flex-direction:column;gap:5px;flex:1}

.corr-info-tabs button.active{background:#3767b2;color:white;border-color:#3767b2}

.corr-choice-guide{min-height:0;display:flex;flex-direction:column;gap:3px;flex:1}

.corr-choice-note{font-size:10.4px;line-height:1.3;color:#5c6f87;padding-top:2px}

.explain:has(.corr-info-tabs) .corr-feature-demo{margin:0;padding:7px 8px;gap:5px}
.explain:has(.corr-info-tabs) .corr-feature-conclusion{font-size:10.9px}
.explain:has(.corr-info-tabs) .example{margin:0;padding:6px 8px;font-size:10.75px;line-height:1.32;flex:0 0 auto}
.explain:has(.corr-info-tabs) .check{margin-top:0;padding:7px 8px;font-size:10.65px;line-height:1.34;flex:0 0 auto}

/* English: Ordinal categories have an intrinsic order; nominal categories do not. */
/* 中文：序位型類別有自然次序；名目型類別沒有，避免把兩者混淆。 */
.scene:has(.corr-lab) .corr-case-ordinal button{font-size:11.1px}
.corr-level-chip{display:inline-flex;border:1px solid #d5e5f6;border-radius:6px;padding:2px 6px;background:#f5f9ff;color:#315c91;font-size:10px;font-weight:800}
.corr-ordinal-note{font-size:10px;line-height:1.35;color:#5e6f87}

.corr-warning[data-method="1"],.corr-warning[data-method="2"]{font-size:10.2px;line-height:1.36}

.corr-table-banner{width:100%;text-align:center;padding:5px 8px;border:1px solid #d8e4f4;border-radius:8px;background:#f7fbff;color:#45627f;font-size:10.8px;line-height:1.3;font-weight:800}
.corr-html-wrap{width:100%;height:100%;padding:8px 10px;overflow:auto;background:#fff}
.corr-table-demo{display:flex;flex-direction:column;gap:8px}
.corr-table-card{border:1px solid #dbe5f4;border-radius:10px;background:#fcfdff;padding:6px 7px}
.corr-table-caption{font-size:10.8px;line-height:1.3;font-weight:900;color:#2f5a95;margin-bottom:4px}
.corr-table-note{font-size:10px;line-height:1.34;color:#556983;margin-top:4px}
.corr-mini-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9.6px}
.corr-mini-table th,.corr-mini-table td{border:1px solid #2d2d2d;padding:2px 3px;text-align:center;line-height:1.22;vertical-align:middle;word-break:break-word}
.corr-mini-table th{background:#f1f3f6;font-weight:900}
.corr-mini-table td strong{font-weight:900;color:#2c5996}
.corr-mini-table.corr-pair-table th,.corr-mini-table.corr-pair-table td{font-size:9.35px;padding:2px 3px}
.corr-mini-table .ok{color:#247356;font-weight:900}.corr-mini-table .bad{color:#b55d2e;font-weight:900}

/* English: Correlation sidebar must never paint its contents beneath the example or question card. */
/* 中文：相關係數側欄採用可容納字型差異的安全排版，杜絕指南文字被下方卡片覆蓋。 */
#deck:has(.corr-lab) .content{height:373px}
.explain:has(.corr-info-tabs){padding:11px 15px 12px;gap:5px}
.explain:has(.corr-info-tabs) .smallcap{flex:0 0 auto;line-height:1.2}
.explain:has(.corr-info-tabs) .prose{
 display:flex;flex-direction:column;gap:5px;
 flex:1 1 auto;min-height:0;max-height:none;
 overflow-x:hidden;overflow-y:auto;
 scrollbar-width:thin;scrollbar-color:#b6c9e5 #f5f8ff;
 padding-right:4px;overscroll-behavior:contain;
}
.explain:has(.corr-info-tabs) .corr-prose-intro{flex:0 0 auto;font-size:12.1px;line-height:1.4}
.explain:has(.corr-info-tabs) .corr-info-tabs{flex:0 0 auto;gap:6px}
.explain:has(.corr-info-tabs) .corr-info-tabs button{padding:6px 7px;font-size:11.7px}
.explain:has(.corr-info-tabs) .corr-choice-guide{
 flex:0 0 auto;min-height:min-content;display:flex;flex-direction:column;gap:5px
}
.explain:has(.corr-info-tabs) .corr-choice-title{flex:0 0 auto;font-size:11.6px;line-height:1.35}
.explain:has(.corr-info-tabs) .corr-choice-row{
 flex:0 0 auto;min-height:35px;display:grid;
 grid-template-columns:98px minmax(0,1fr);gap:7px;
 padding:5px 8px;align-items:center
}
.explain:has(.corr-info-tabs) .corr-choice-row b{font-size:12.2px;line-height:1.28}
.explain:has(.corr-info-tabs) .corr-choice-row span{font-size:11.6px;line-height:1.38;overflow-wrap:anywhere}
.explain:has(.corr-info-tabs) .corr-feature-demo{flex:0 0 auto;min-height:min-content}
.explain:has(.corr-info-tabs) .example{flex:0 0 auto;margin:0;padding:7px 9px;font-size:11.5px;line-height:1.42}
.explain:has(.corr-info-tabs) .check{flex:0 0 auto;margin:0;padding:7px 9px;font-size:11.5px;line-height:1.4}
/* English: Show each Spearman example as an independent compact numeric cell, never as one overflowing sentence. */
/* 中文：Spearman 的兩組相關係數改為各自的小格子，避免數值與標籤互相擠壓或換行跑版。 */
.scene:has(.corr-lab) .corr-value.corr-value-ordinal{
 display:grid;grid-template-columns:86px minmax(0,1fr);column-gap:4px;
 align-items:center;min-height:32px;padding:4px 6px;
}
.scene:has(.corr-lab) .corr-value-ordinal>span{
 font-size:11px;white-space:nowrap;line-height:1.2;min-width:0;
}
.scene:has(.corr-lab) .corr-rho-pairs{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;
 min-width:0;align-items:stretch;
}
.scene:has(.corr-lab) .corr-rho-pairs>div{
 min-width:0;display:flex;align-items:center;justify-content:center;
 gap:3px;white-space:nowrap;background:rgba(255,255,255,.78);
 border:1px solid #d7e5f7;border-radius:5px;padding:3px 2px;
}
.scene:has(.corr-lab) .corr-rho-pairs small{
 font-size:9.3px;line-height:1.1;color:#54729b;font-weight:850;white-space:nowrap;
}
.scene:has(.corr-lab) .corr-rho-pairs b{
 font-size:12.2px;line-height:1.1;color:#28579a;font-weight:900;
 font-variant-numeric:tabular-nums;white-space:nowrap;
}

/* English: Integrated logistic-regression and accuracy lesson, fixed threshold with no switchable gate. */
/* 中文：同一頁說明 Sigmoid、固定 0.5 判類及 Accuracy，消除重複的分類評估頁。 */
.scene:has(.sig-teach-layout){padding:12px 15px 10px;gap:6px}
.scene:has(.sig-teach-layout)>.scene-head{font-size:11.1px;letter-spacing:.45px;line-height:1.3;flex:0 0 auto}

.sig-graph-panel,.sig-accuracy-panel{min-height:0;min-width:0;background:#fff;border:1px solid #e0e8f3;border-radius:12px;display:flex;flex-direction:column;gap:4px;padding:7px 8px}
.sig-panel-caption{font-size:10.8px;font-weight:900;color:#386293;line-height:1.24;white-space:nowrap}
.sig-teach-plot{flex:1;min-height:0;overflow:hidden}
.sig-teach-plot svg{width:100%;height:100%;display:block}
.sig-formula-small{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:10.9px;font-weight:900;color:#2c5795;white-space:nowrap}
.sig-formula-small .sig-formula-equation{min-width:0;font-size:10.8px;white-space:nowrap}.sig-formula-small #sigDirectDecision{flex:0 0 auto;font-size:10.2px;border-radius:6px;padding:3px 5px;background:#fff0d9;color:#936124}
.sig-accuracy-header,.sig-accuracy-row{display:grid;grid-template-columns:41px 46px minmax(0,1fr) 46px 30px;gap:3px;align-items:center;text-align:center;font-variant-numeric:tabular-nums}
.sig-accuracy-header{font-size:9.8px;color:#6883a1;font-weight:900;padding:3px 1px;border-radius:6px;background:#ebf3ff}
.sig-accuracy-rows{display:flex;flex-direction:column;gap:3px;flex:0 0 auto}
.sig-accuracy-row{font-size:10.3px;line-height:1.32;border:1px solid #e6edf6;border-radius:6px;color:#405875;padding:3px 1px;background:#fcfdff;font-weight:780}
.sig-accuracy-row.focus{background:#fff4e4;border-color:#efca93;color:#835621}
.sig-prob-number{font-size:11.5px;font-weight:900;color:#245eaf}
.sig-right{font-size:15px;color:#268468;font-weight:950}
.sig-wrong{font-size:15px;color:#c0664c;font-weight:950}
.sig-accuracy-result{display:grid;grid-template-columns:1fr auto;gap:0 5px;align-items:center;margin-top:1px;background:#eaf5ff;border:1px solid #cbdff7;border-radius:8px;padding:5px 8px;color:#355b90}
.sig-accuracy-result span{font-size:11.3px;font-weight:900}
.sig-accuracy-result strong{font-size:21px;color:#2356a1;grid-column:2;grid-row:1 / 3;line-height:1.1;font-variant-numeric:tabular-nums}
.sig-accuracy-result small{font-size:10px;color:#576f8b;font-weight:800}
.sig-accuracy-hint{color:#586d83;font-size:10.4px;line-height:1.25;min-height:15px}
.sig-accuracy-controls{flex:0 0 30px;gap:7px;font-size:11.7px;white-space:nowrap;min-height:0}
.sig-accuracy-controls input{width:130px;min-width:0}
.sig-accuracy-controls b{min-width:32px;text-align:center;font-size:13px}
.sig-accuracy-controls span{font-size:11.1px;color:#26639d;font-weight:900;font-variant-numeric:tabular-nums}

/* English: Keep the four-point PCA reduction lesson readable without clipping its controls or score labels. */
/* 中文：四點降維的圖表、座標刻度、選擇按鈕與主成分分數都在同頁完整呈現。 */
.scene:has(.dim-four-wrap){padding:13px 16px 10px;gap:6px}

<body>

<script>
const slides = [{"t":"把資料變成預測","s":"第 1 節課程重點","time":2,"kind":"cover","tag":"課程導入","steps":["從生活中的資料開始","學習：資料整理 → 模型訓練 → 評估","最後用新資料檢驗"],"read":"機器學習不是把規則一條條寫死，而是從資料中找出模式，讓模型能對新的輸入做預測。本節先認識資料的結構，再建立從資料到模型的完整流程。","example":"小晴每晚讀書兩小時、寫十題練習題。只看這些紀錄，你猜她下週數學小考會考幾分？","check":"問題：你認為讀書時間是「輸入」還是「答案」？"},{"t":"一張表看懂樣本、特徵與標籤","s":"每列一筆樣本，輸入 X 與答案 y 要分清楚","time":4,"kind":"dataset","tag":"資料的組成","steps":["辨認列：每位同學一筆樣本","找出特徵 X：時數與題數","找出標籤 y：測驗分數"],"read":"在表格式監督式學習中，每列是一筆 Sample（樣本）；讀書時數與練習題數是 Feature（特徵，輸入 X），測驗分數是 Label（標籤，目標 y）。模型利用有答案的資料學習，再對新樣本預測。分類的標籤也可以是「及格／未及格」。","example":"小雅的成績表中，每一列是一位同學；讀書時間與練習題數是輸入，測驗分數是答案。","check":"問題：加入「學號」當特徵通常會有哪些風險？"},{"t":"有沒有標籤？回歸、分類、分群、降維","s":"用同一張概念圖，快速掌握四種常見任務","time":3,"kind":"tasks","tag":"常見任務","steps":["監督式：預測數值或類別","非監督式：探索群組或降低特徵維度"],"read":"監督式學習有正確答案 y：回歸預測分數等連續數值；分類預測「及格／未及格」等類別。非監督式學習沒有指定答案：K-means 把相近資料分群；PCA 讓每筆資料用更少特徵表示。分群和降維是兩種不同工作。","example":"小潔預測成績是回歸；判斷及格是分類；把學習習慣相近的人放一起是分群；把身高、體重等特徵濃縮成一條新座標是降維。","check":"PCA 和 K-means 都不需要事先提供群別標籤，但它們的輸出一樣嗎？"},{"t":"資料品質：缺漏值與異常值怎麼辦？","s":"切換兩種情境，看資料品質如何影響統計結果","tag":"前處理 · 資料品質","kind":"combo","steps":["空白不能直接當成 0","極端值先查證，再決定是否處理"],"time":6,"modes":[{"t":"資料前處理：缺漏值怎麼辦？","s":"有些同學忘記填資料，模型要怎麼處理？","time":3,"kind":"missing","tag":"資料前處理","steps":["先找出沒有填寫的欄位","比較「刪除紀錄」與「補入合理數值」","按按鈕觀察補值結果，並避免用測試集決定補值"],"read":"小晴統計全班練習時數時，發現阿哲忘記填寫。空白不代表零：要先確認原因，再決定刪除、補值或另外標記。若使用平均數補值，平均數也只能從訓練資料估計，不能偷看測試集。","example":"阿哲忘記登記讀書時數；應先確認缺漏原因，再評估是否使用訓練集的平均數補值。","check":"「沒填資料」與「真的讀書 0 小時」意思相同嗎？","switch":"缺漏值"},{"t":"資料前處理：異常值會造成什麼影響？","s":"一筆不合理數字，就可能把平均值拉得很遠","time":3,"kind":"outlier","tag":"資料前處理 · 資料品質","steps":["先觀察六筆正常時數","加入一筆可疑的 60 小時紀錄","切換保留與暫時排除，觀察平均數如何變化"],"read":"如果有人把「6 小時」誤寫成「60 小時」，平均值會明顯上升。但異常值不一定都該刪除：先檢查是不是輸入錯誤，或是真有特殊情況，再決定如何處理。","example":"阿哲填讀書時數時多打了一個零，導致全班平均看起來突然增加。","check":"如果 60 小時是真實紀錄，而不是打錯字，能不能直接刪除？","switch":"異常值"}]},{"t":"數值標準化：z-score 的直覺與計算","s":"比較原始分數與標準分數，並理解平均 z 為何是 0","tag":"前處理 · 數值特徵","kind":"combo","steps":["z = (x − 平均數) / 標準差","看懂 z = 0、+1、−1 的意義"],"time":7,"modes":[{"t":"資料前處理：為什麼需要標準化？","s":"換成標準分數後，讓不同單位的特徵有可比較的尺度","time":4,"kind":"scale_intro","tag":"資料前處理 · 特徵尺度","steps":["先看原始分數：平均數 60、標準差 10","切換小晴和阿哲：觀察原始分數及 z-score 如何一起改變","理解 z-score：+1 高於平均一個標準差，−1 低於平均一個標準差"],"read":"z-score＝(x−μ)／σ，表示數值距離平均數幾個標準差；z=0 是剛好等於平均值。標準化讓不同單位的特徵更容易公平參與距離計算，對 K-means、KNN、SVM、PCA 等常有幫助；決策樹通常不需要。標準化不保證一定更準，但可避免數值範圍大的特徵只因為單位較大就主導運算。","example":"小晴練習考 70 分，比平均 60 分高 10 分；因為標準差是 10 分，所以 z=+1。阿哲 50 分則是 z=−1。","check":"如果小宇剛好 60 分，他的 z-score 是多少？為什麼？","switch":"原始 vs z"},{"t":"標準化後，為什麼平均 z-score 會是 0？","s":"把四位同學的分數換算成「離平均數幾個標準差」","time":3,"kind":"scale_reason","tag":"資料前處理 · 標準分數","steps":["先看 A～D 四位同學的原始分數與平均數","按下轉換按鈕，依相同順序看每人的 z-score","計算四人的平均 z-score，理解「扣掉平均數」為何會得到 0"],"read":"z-score＝(x−μ)／σ，表示資料離平均數幾個標準差。本頁四人平均 μ=65、標準差 σ≈11.18。每筆先減去同一組資料的平均數，正負差距相加必為 0；再除以同一個 σ，平均 z 仍為 0。注意：四人的 z 不會全都等於 0。","example":"小晴 50 分，比四人平均低 15 分；除以 11.18 後，z≈−1.34。小萱 80 分則是 +1.34。兩人分居平均值兩側。","check":"平均 z=0，是否代表四個人的 z-score 都等於 0？測試集用訓練集參數轉換後，平均 z 一定也是 0 嗎？","switch":"平均 z 為何是 0"}]},{"t":"先切分資料：理解 X、y 與測試集","s":"比例及四種資料矩陣，在同一頁切換比較","tag":"避免資料洩漏","kind":"combo","steps":["訓練集學習，測試集留到最後","同一列的 X 與 y 必須對應"],"time":10,"modes":[{"t":"切分資料：訓練集與測試集","s":"先決定比例，模擬 train_test_split 如何把資料分成兩份","time":5,"kind":"splitratio","tag":"資料切分 · 第一步","steps":["先看 10 筆資料，決定要保留多少筆測試資料","調整測試集比例，觀察各筆資料被分到哪一份","確認訓練集與測試集不能重複"],"read":"要評估模型能否預測「沒看過的新資料」，就需要先將資料分成訓練集與測試集。訓練集讓模型學規律，測試集先保留起來，最後才用來公平地評估預測能力。拖曳滑桿，就能比較不同比例分別有多少筆資料。","example":"小晴有 10 題英文練習題，先用 7 題練習，剩下 3 題最後再做，才能知道她是否真的學會。","check":"如果 10 筆中拿出 3 筆當測試集，測試集比例是多少？","switch":"訓練／測試比例"},{"t":"從 DataFrame 到 X_train、y_train、X_test、y_test","s":"同一份成績表分成四組資料，各有固定的顏色","time":5,"kind":"splitxy","tag":"資料切分 · 第二步","steps":["先找出藍色 X_train：訓練用的輸入特徵","接著看綠色 y_train：對應的正確分數","最後辨認紫色 X_test、橘色 y_test：留待驗收的資料"],"read":"想像小晴蒐集了 10 位同學的練習紀錄。每一列代表一位同學，讀書時數與練習題數是 X，測驗分數是 y。資料切分時，不是任意挑顏色，而是以「訓練／測試」和「輸入／答案」兩個條件交叉分成四組。你可以點右側任一色卡，對照左側表格中的儲存格。","example":"小晴將前 7 位同學的讀書時數與題數放進藍色 X_train，將這 7 位同學的分數放進綠色 y_train；剩下 3 位同學則用紫色 X_test 與橘色 y_test，等模型練好後再驗收。","check":"如果小安是測試組的學生，她的「練習題數」應放哪個顏色？「測驗分數」又是哪個顏色？","switch":"X_train 等四組"}]},{"t":"StandardScaler：fit、transform 與共同尺度","s":"只在訓練集 fit；所有資料使用相同的 μ、σ","tag":"數值特徵 · 訓練流程","kind":"combo","steps":["fit 學訓練資料的 μ、σ","transform 轉換訓練與測試資料"],"time":8,"modes":[{"t":"StandardScaler：fit 在學什麼？","s":"相同的四筆資料，逐列比較原始值與轉換後的標準分數","time":4,"kind":"scaler_fit","tag":"資料轉換 · fit 與 transform","steps":["左欄先看原始訓練資料：同學 A、B、C、D","按 fit：只計算 μ 與 σ，不改動資料","按 transform：右欄依照相同順序產生四筆標準分數"],"read":"標準化器的 fit 會根據 X_train 計算平均數 μ 與標準差 σ，transform 才會真正轉換每一筆數值。畫面中的 A～D 是同四筆訓練資料；左右欄順序完全一致，方便逐筆比對。此範例 μ=65、σ≈11.18（使用母體標準差）。","example":"小晴（A）原本是 50 分，轉換後約 −1.34；阿哲（B）60 分變成 −0.45。這些數字描述的是離訓練集平均幾個標準差。","check":"按下 fit 但還沒按 transform 時，右邊的分數應該已經改變了嗎？","switch":"fit → transform"},{"t":"StandardScaler：測試集只能 transform","s":"兩種換算方式會把相同測試分數放到不同的位置","time":4,"kind":"scaler_apply","tag":"資料轉換 · 避免資料洩漏","steps":["用訓練集的 μ=65、σ≈11.18 建立共同刻度","看測試集的 90 與 110：應落在訓練平均數右側","切換錯誤示範：如果測試集自己 fit，這兩點會被移到另一套刻度"],"read":"訓練集和測試集必須使用同一套標準化參數。先 scaler.fit(X_train)，再對兩組資料執行 transform。圖中的灰點是訓練資料，橘點是測試資料；切換成錯誤做法時，橘點會跳到另一套刻度的位置，兩組資料便無法直接比較。","example":"先使用訓練集建立標準化基準。小潔的 90 分與小萱的 110 分，也必須使用相同的平均數與標準差轉換，不能只針對這兩筆測試資料重新計算。","check":"為什麼不能把測試資料 90 與 110 的平均數 100 當成新基準？","switch":"測試集不可重新 fit"}]},{"t":"1 個類別欄位，為何變成 3 個 One-Hot 欄位？","s":"Excel「學習方式」只有 1 欄；其中 3 種不同的值，會展開成 3 個 0／1 特徵","kind":"onehot","read":"Excel「學習方式」原本只有 1 個特徵欄位；5 筆資料去重後有 3 種值：自習、讀書會、線上課。完整 One-Hot Encoding（獨熱編碼）為每種類別建 1 欄，於是原本 1 欄展開成 3 個 0／1 欄位。每筆資料所屬類別填 1，其餘填 0，原本的 5 列不變。類別沒有大小順序，不能用 1、2、3 當作連續數值。編碼欄序由訓練集決定，測試集沿用。有些迴歸實作會省略其中 1 欄，本頁示範完整 3 欄。","example":"Excel A 欄由上到下是「自習、讀書會、線上課、讀書會、自習」。雖有 5 筆資料，但不同值只有 3 種。按左側任一同學，例如阿哲選「讀書會」，對應的 3 個新欄位就是 [0, 1, 0]。","check":"原始資料有 5 筆、1 個類別特徵、3 種不重複的值。完整 One-Hot 後，會有幾筆資料、幾個編碼欄位？（提示：列數不變）","steps":["辨認 Excel 原始只有「學習方式」1 欄","找出該欄 3 種不同的值","每種值各建 1 欄，逐列產生 0／1"],"time":4,"tag":"類別特徵 · 編碼"},{"t":"數值＋類別特徵：合成模型可用的 X","s":"標準化時數，再把 One-Hot 欄位水平接在右邊","kind":"featurematrix","read":"每一列是一位同學，每個數值欄位都是一個特徵。數值型「讀書時數」用訓練資料的平均數 μ=4、小時標準差 σ≈1.63 標準化；類別型「學習方式」用 One-Hot 編碼成三個 0／1 欄位。把這些欄位左右合併，就得到每列 4 個數值特徵的矩陣 X，能送進線性迴歸或邏輯斯迴歸。答案 y 獨立保存，不要混入 X。","example":"訓練組三人時數為 2、4、6 小時：z 約為 −1.22、0、+1.22。若測試組讀書 5 小時、使用「讀書會」，輸入就是 [0.61, 0, 1, 0]，不重新計算平均與編碼類別。","check":"測試集有新類別該怎麼辦？為什麼測試資料不能自己重新決定欄位順序？","steps":["只用訓練集決定 scaler 與編碼規則","逐列左右合併：1 個 z + 3 個 0/1","得到 X_train、X_test；y 另外保存"],"time":4,"tag":"前處理整合 · 模型輸入"},{"t":"迴歸線、殘差與均方誤差","s":"拖曳 β₁（斜率）及 β₀（截距），同步看垂直殘差、平方誤差與 MSE","time":8,"kind":"linear","tag":"動手練習 · 線性迴歸","steps":["藍點是實際分數；橘線是 β₀＋β₁x 的預測","藍虛線是殘差 e；綠正方形代表 e²","將 8 筆 e² 平均得到 MSE；下一頁認識 β₂"],"read":"簡單線性迴歸：ŷ = β₀ + β₁x。β₀（beta zero）＝截距 b；β₁（beta one）＝第一個特徵的權重 w₁，決定斜率。實際 y 與預測 ŷ 的垂直差距是殘差 e＝y−ŷ（藍色虛線）；綠色正方形邊長與 |e| 成正比，因此面積與 e² 成正比。將 8 筆平方誤差取平均就是 MSE。多特徵模型還會有 β₂、β₃⋯，對應各欄的 w₂、w₃⋯。","example":"小宇讀書 4 小時，真實考 64 分。若 β₁＝3.2、β₀＝48，預測為 60.8 分，所以 e＝3.2 分、e²＝10.24 分²。調整滑桿時，圖與表格一起改變。","check":"當其中一個殘差的長度變成兩倍時，它的平方誤差會變成幾倍？"},{"t":"線性模型：多特徵與彎曲關係","s":"β₁、β₂ 是不同特徵的權重；也可用 x² 建立新的數值特徵","tag":"回歸 · 特徵工程","kind":"combo","steps":["多特徵：ŷ = b + w₁x₁ + w₂x₂","加上 x² 可描述彎曲趨勢"],"time":8,"modes":[{"t":"多元線性迴歸：一次看多個特徵","s":"把讀書時數與練習題數一起帶入模型，觀察預測分數如何改變","time":4,"kind":"multilinear","tag":"延伸概念 · 線性迴歸","steps":["先看固定的起始分數與兩個輸入特徵","調整讀書時數：每多 1 小時，預測增加 4 分","調整練習題數：每多 1 題，預測增加 1.5 分"],"read":"兩個輸入欄：讀書時數 x₁、練習題數 x₂，模型 ŷ＝β₀＋β₁x₁＋β₂x₂；本例 β₀＝40（截距）、β₁＝4（亦可寫 w₁，每多 1 小時加 4 分）、β₂＝1.5（亦可寫 w₂，每多 1 題加 1.5 分）。β₁、β₂ 就是下節正則化會限制的「模型權重」，通常不懲罰 β₀。這是事先給定係數的教學範例，非現場重新訓練。","example":"小晴 x₁=3 小時、x₂=8 題：ŷ＝40＋4×3＋1.5×8＝64 分；改變任一滑桿，就能區分 β₁x₁ 與 β₂x₂ 各貢獻多少分。","check":"β₁ 代表哪個特徵的權重？β₂ 的數值 1.5 代表什麼？","switch":"多元線性迴歸"},{"t":"多項式線性迴歸：用線性方法描述彎曲關係","s":"把 x 轉成 x²、x³ 等新特徵後，仍然可以用線性迴歸訓練","time":4,"kind":"polylinear","tag":"延伸概念 · 線性迴歸","steps":["先看原始資料可能呈現彎曲趨勢","再把 x 轉成 x、x² 等新特徵","雖然畫出來是曲線，但模型對係數仍然是線性的"],"read":"多項式仍可用「每一欄一個權重」理解：ŷ＝β₀＋β₁x＋β₂x²。這裡 x² 是由原始 x 製造的新特徵，所以它也有自己的係數 β₂。雖然畫出來是彎曲的，但對係數 β₀、β₁、β₂ 仍然是線性的。","example":"小宇練習前兩小時進步最快，後來進步幅度變小；這樣的關係可能用彎曲曲線更合適。","check":"如果資料明顯不是直線，直接只用一條直線配適，可能會出現欠擬合嗎？","switch":"多項式特徵"}]},{"t":"兩個特徵太相像？認識相關係數與共線性","s":"數值型看線性；序位型看名次／順序；名目型沒有自然順序","time":5,"kind":"correlations","tag":"特徵關係 · 共線性","steps":["Pearson 比較數值型特徵的線性關係","Spearman／Kendall 比較有順序的等級或排名","名目型無法直接排序；調整特徵仍須用驗證資料檢查"],"read":"相關係數衡量兩個變數的關聯方向及強弱。Pearson 比較數值型資料的線性關係；Spearman 與 Kendall 可以比較有先後順序的等級（序位型）或數值資料的排名。名目型（社團名稱、血型）沒有自然順序，不能直接用三者比較。檢查 X₁ 與 X₂ 的線性重複可初步發現共線性；調整輸入特徵仍須驗證。","example":"Pearson：比較讀書時數和練習題數。Spearman／Kendall：比較問卷的「讀書投入程度」與「練習投入程度」（很少、偏少、普通、偏多、很多）。籃球社／熱舞社等社團名稱沒有高低順序，屬名目型，不可硬編成名次。","check":"社團名稱和「很少→很多」的參與程度，哪一個可以做排序相關？Pearson 很高就一定該刪除特徵嗎？"},{"t":"回歸怎麼評估？MAE、MSE、RMSE、R²","s":"四項指標放在同一頁切換，分清楚絕對值、平方、開根號與比較基準","tag":"回歸 · 模型評估","kind":"combo","steps":["MAE：每筆誤差取絕對值後平均","MSE：每筆誤差平方後平均","RMSE：MSE 開根號；R²：比猜平均數好多少"],"time":11,"modes":[{"t":"MAE：預測平均差幾分？","s":"Mean Absolute Error（平均絕對誤差）｜直接平均每筆「差了多少」","time":3,"kind":"mae_lab","tag":"回歸評估 · MAE","steps":["先看四筆成績：真實值與預測值各是多少","用 |真實 − 預測| 算出每筆絕對誤差","拖曳第 4 筆誤差，觀察 MAE 如何改變"],"read":"MAE 是 Mean Absolute Error（平均絕對誤差）。每筆先算 e = 真實值 − 預測值，取絕對值 |e|，再把 n 筆的 |e| 加總除以 n。MAE = Σ|y−ŷ| / n。因為不會讓正負誤差互相抵銷，可以直接解讀為「平均差幾分」。MAE 越小通常越好，0 代表每筆都預測正確。","example":"四位同學原本各預測差 2 分，MAE = 2 分。如果第四位同學突然差 16 分，MAE = (2+2+2+16)/4 = 5.5 分。","check":"把第 4 筆誤差從 2 改成 16：MAE 增加多少？「預測少 16 分」與「預測多 16 分」在 MAE 中有差別嗎？","switch":"MAE"},{"t":"RMSE：為什麼先平方、再開根號？","s":"Root Mean Squared Error（均方根誤差）｜更重視較大的預測失誤","time":4,"kind":"mse_lab","tag":"回歸評估 · RMSE","steps":["先看四筆資料的殘差大小，計算每筆 e²","把平方誤差平均，得到 MSE（單位為分²）","再開根號得到 RMSE（回到分），觀察大誤差的影響"],"read":"MSE（Mean Squared Error，均方誤差）＝Σ(y−ŷ)²／n。先算每筆殘差 e＝y−ŷ，平方後加總，再除以樣本數 n。平方會特別放大較大的失誤，結果單位是分²，不是分。拖曳切換兩種誤差情境，對照下方 RMSE＝√MSE，理解為什麼開根號能回到原始單位。","example":"四筆都差 2 分：MSE=(4+4+4+4)/4=4 分²；最後一筆差 16 分：MSE=(4+4+4+256)/4=67 分²。","check":"如果某一筆誤差由 2 分變成 4 分，它對 MSE 的平方項由 4 增加到多少？","switch":"MSE"},{"t":"RMSE：為什麼先平方、再開根號？","s":"Root Mean Squared Error（均方根誤差）｜更重視較大的預測失誤","time":4,"kind":"rmse_lab","tag":"回歸評估 · RMSE","steps":["先看四筆資料的殘差大小，計算每筆 e²","把平方誤差平均，得到 MSE（單位為分²）","再開根號得到 RMSE（回到分），觀察大誤差的影響"],"read":"RMSE 是 Root Mean Squared Error（均方根誤差）。每筆殘差 e 先平方，取平均得到 MSE，再開根號：RMSE = √MSE。平方讓大錯誤的影響變大；開根號讓結果回到原始單位。MSE 是分²，RMSE 是分；同一組資料的 RMSE 不會小於 MAE。","example":"若四筆誤差是 2、2、2、16 分：MSE=(4+4+4+256)/4=67 分²，RMSE≈8.19 分，MAE=5.5 分。大誤差對 RMSE 影響較明顯。","check":"為什麼一筆差 16 分的平方誤差是 256，而不是 16？為什麼 RMSE 的單位可以寫「分」？","switch":"RMSE"},{"t":"R²：比「只猜平均數」好多少？","s":"Coefficient of Determination（決定係數）｜以真實值平均數作為比較基準","time":4,"kind":"r2_lab","tag":"回歸評估 · R²","steps":["先看四位同學的真實成績，以及共同平均 75 分","按不同模型，觀察誤差平方和 SSE 如何變化","用 R² = 1 − SSE/SST 判讀 1、0 與負數"],"read":"R² 是 Coefficient of Determination（決定係數）。先把「全部猜真實平均值」當基準：SST=Σ(y−平均 y)²。模型的誤差平方和是 SSE=Σ(y−ŷ)²，因此 R²=1−SSE/SST。等於 1 代表完美預測；等於 0 代表和猜平均數一樣；小於 0 代表更差。R² 不是分類答對率。","example":"四位同學真實分數是 60、70、80、90，平均 75，SST=500。若預測為 62、68、82、88，SSE=16，R²=1−16/500=0.968。","check":"如果模型對四個人一律預測 95 分，且比「都猜 75 分」還差，R² 會大於 0 還是小於 0？","switch":"R²"}]},{"t":"過度擬合：訓練準不等於預測準","s":"認識過度擬合與泛化","time":4,"kind":"overfit","tag":"模型的泛化能力","steps":["欠擬合抓不到規律","適當擬合保留趨勢","過度擬合追逐雜訊"],"read":"三張圖使用完全相同的資料點。欠擬合只用過於簡單的模型，無法掌握主要趨勢；適當擬合掌握主要關係；過度擬合把資料中的偶然起伏也學進去，雖然訓練誤差小，遇到新資料卻可能表現不佳。","example":"阿翔把上週練習題答案背熟，遇到稍微變化的新題卻答錯；這是過度擬合的生活類比。","check":"哪條線最貼近每個訓練點？它一定能在新資料上預測得最好嗎？"},{"t":"第 1 節：3 題快速檢核","s":"三題皆可直接作答；答錯提供線索，答對補完整解釋","time":1,"kind":"quiz1","tag":"課堂檢核 · 11:00","steps":["資料切分與測試集","類別編碼及特徵合併","沿用訓練集的轉換規則"],"read":"第一節重點：資料品質、數值與類別特徵都要正確前處理；先切分訓練與測試資料；在訓練資料建立轉換規則，之後把兩類特徵組成 X 供模型使用。最後用新資料評估預測能力。","example":"小晴完成練習後會留下沒有看過的題目作檢測；AI 模型的測試集也是相同道理。","check":"你能說明：為什麼測試資料必須沿用訓練集的平均數與 One-Hot 欄位順序？"},{"t":"從分數，走向「是否及格」","s":"第 2 節課程重點","time":2,"kind":"cover2","tag":"課程導入","steps":["邏輯斯迴歸：機率、類別、Accuracy","正則化：控制模型複雜度","PCA 降維與 K-means 分群"],"read":"第二節先認識邏輯斯迴歸如何從線性分數得到分類機率，使用固定 0.5 決定類別，再以 Accuracy（正確率）初步觀察表現；下一次課程才深入學習混淆矩陣與其他分類指標。接著介紹 L1/L2 正則化如何控制模型權重，最後探索 PCA 降維與 K-means 分群。","example":"小晴想用讀書紀錄預測五位同學會不會及格；先看模型預測對了幾位，之後再學其他分類評估方法。","check":"問題：上一節的線性迴歸會直接輸出類別嗎？"},{"t":"邏輯斯迴歸：從機率到分類結果","s":"用 Sigmoid 取得機率，再以固定 0.5 分類；一起看 Accuracy","time":7,"kind":"sigmoid","tag":"監督式學習 · 二元分類","steps":["線性分數 z 經 Sigmoid 轉成 0～1 的機率","固定 p ≥ 0.5 判為「及格」；低於 0.5 判為「未及格」","Accuracy＝預測正確人數 ÷ 全部人數"],"read":"邏輯斯迴歸（Logistic Regression）用線性分數 z＝w·x＋b，經 Sigmoid 函數算出正類機率 p（介於 0 與 1）。本課固定以 0.5 分類：p ≥ 0.5 判為「及格」，否則為「未及格」。右表比較五位同學的真實答案與模型預測：Accuracy（正確率）＝預測正確人數／全部人數。拖曳 z 可改變小晴的示範機率、預測類別及正確率；其餘四人的資料固定。這是教學模擬，不代表正在重新訓練模型。混淆矩陣、Precision、Recall、F1 將在下一次課程再詳細介紹。","example":"班上五位同學，模型根據學習紀錄預測「是否及格」。一開始判對四位，Accuracy＝4÷5＝80%。如果小晴的機率下降到 0.5 以下，模型就把她預測為未及格，因為她實際及格，正確率也隨之下降。","check":"小晴實際及格。如果模型給她 p＝0.49，固定門檻 0.5 時會預測哪一類？假設其餘四位答案不變，Accuracy 會是多少？"},{"t":"L1 與 L2 正則化：限制模型複雜度","s":"改變正則化強度，觀察係數 β₁、β₂ 如何被限制","time":4,"kind":"formula","tag":"正則化","steps":["L1：絕對值總和，容易有 0 係數","L2：平方和，通常連續收縮","強度增加需留意欠擬合"],"read":"把高中平時小考分數當作特徵 X₁（數學）與 X₂（英文），預測下次數學段考成績時，模型會學到 β₁、β₂ 兩個權重（w₁、w₂），代表各特徵的影響。L1、L2 正則化是在原本的預測誤差之外，對過大的權重加入懲罰，降低過度擬合的風險；β₀ 是截距，通常不懲罰。L1（菱形）較容易讓某個權重剛好變成 0；L2（圓形）通常讓權重逐步縮小。這些操作限制的是模型係數，不是修改學生的分數。","example":"假設用「平時數學小考」與「英文小考」預測下次數學段考：若模型過度依賴某一科偶然的高分，正則化會限制權重。L1 可能讓較不需要的 β₂ 歸零；L2 通常同時縮小 β₁、β₂。只是教學類比，實際是否更準仍需用驗證資料比較。","check":"問題：若 L1 使英文成績的 β₂＝0，是英文分數變 0，還是模型暫時不使用英文這項輸入的線性貢獻？"},{"t":"同一滑桿比較 Lasso（L1）與 Ridge（L2）","s":"拖曳懲罰強度，觀察參數變化","time":4,"kind":"regular","tag":"係數變化觀察","steps":["固定同一組四個係數","調高 λ 比較兩邊長條","歸零（L1）與縮小（L2）不同"],"read":"Lasso（L1）與 Ridge（L2）都會對模型係數 β₁、β₂⋯（也可寫 w₁、w₂⋯）加入懲罰。L1 可能令部分係數歸零，L2 一般讓各係數平滑縮小。注意 β₀ 通常不受正則化；兩圖使用同一組假設係數與理想化正交特徵，不是從學生資料重新訓練。","example":"調高正則化強度，想像教練要四位選手放慢步調：L1 會讓部分人停下來，L2 讓大家一起減速。","check":"問題：哪一類正則化較可能把小係數直接變成零？"},{"t":"非監督式學習：分群與降維不同","s":"PCA 減少特徵數；K-means 找相似群別","tag":"探索沒有標籤的資料","kind":"combo","steps":["降維：樣本數不變，特徵數減少","分群：為樣本指派群別"],"time":7,"modes":[{"t":"沒有標籤，可以分群，也可以降維","s":"Clustering（分群）與 Dimensionality Reduction（降維）","time":4,"kind":"unsupervised","tag":"無監督式學習","steps":["非監督式：資料沒有提供預設答案","PCA：找低維表示，而不是替樣本貼群別","K-means：將相似樣本分成 K 個群"],"read":"沒有標籤時，可以從資料本身探索結構。PCA 是 Principal Component Analysis（主成分分析），常用來做 Dimensionality Reduction（降維），把多個特徵壓縮成少數新座標；K-means 是 Clustering（分群），把樣本分配到 K 個群。K 代表群數，不是縮寫。","example":"小瑜手上只有同學的身高與體重：PCA 可把兩欄濃縮成一條新座標；K-means 則可以把相近身形的同學分群。","check":"PCA 的輸出是新的特徵座標，還是每位同學的群別？","switch":"分群 vs 降維"},{"t":"降維：把二維資料整理成一維","s":"從四筆明確座標出發，看看兩個特徵如何合成一個主成分分數","time":3,"kind":"dimreduce","tag":"非監督式學習 · 降維","steps":["左圖：A～D 分別在 (0,0)、(1,1)、(2,2)、(3,3)","先扣各欄平均 1.5，再沿 45° 方向線性投影","右圖：得到 −2.12、−0.71、+0.71、+2.12 四個新分數"],"read":"原本 A～D 四筆資料各有兩個數值特徵，座標為 (0,0)、(1,1)、(2,2)、(3,3)。如果資料沿左下到右上的直線排列，可以先扣掉兩欄平均數 1.5，再沿 45° 的單位方向 (1/√2, 1/√2) 投影，得到一個主成分分數 t＝[(x₁−1.5)+(x₂−1.5)]／√2。四筆依序成為 −2.12、−0.71、+0.71、+2.12。這是中心化加線性投影：維度由 2 變 1，四筆樣本都還在，t 不是原始 x₁ 或 x₂。這個完全共線的教學範例，保留一維可保留全部變異；真實資料通常會損失一些資訊。","example":"假設每位同學有兩個已換成同一尺度的學習特徵：A=(0,0)、B=(1,1)、C=(2,2)、D=(3,3)。按 A～D，觀察兩個值如何合成一個新分數。B 的新分數是 −0.71，不是原本的 1；正負號是相對全班平均的位置。","check":"B 同學原本有 2 個特徵，降維後剩下幾個？新分數 −0.71 是哪個原始特徵的值嗎？","switch":"降維前後比較"}]},{"t":"PCA：旋轉投影軸，找保留差異最多的方向","s":"主成分分數是「中心化後的投影座標」，不是原來的兩個特徵值","time":3,"kind":"pca","tag":"降維 · PCA","steps":["旋轉投影軸：比較保留變異比例","看 A 同學從 (x₁, x₂) 投影成一個 PC1 分數 t","找最佳軸：少一個特徵，盡量保留最大解釋力"],"read":"PCA（主成分分析）把兩個特徵沿某個方向投影成一個分數 t。先扣除各欄平均數（中心化），再沿橘色軸投影；t 不是原始時數，也不是群別。旋轉橘線，A 同學的 t 與保留變異比例會同步變化。對準綠色最佳軸時，一維投影的變異最大，此時 t 稱為第一主成分分數（PC1 score）；代表只留一個新特徵時保留最多原始差異，但仍可能損失資訊。","example":"假設小晴平日讀書 1.2 小時、週末讀書 2.2 小時。中心化後，PCA 會把這兩個值沿主成分方向合成一個帶正負號的分數 t。投影軸旋轉時，t 及保留的變異比例都會變動；最佳方向會使整體投影變異最大。","check":"把橘線轉到綠色最佳軸，保留變異比例會變大。降成一維後，A 同學的新數值 t 是原始「平日讀書時數」嗎？它如何計算？"},{"t":"K-means 分群：逐步分派、更新中心","s":"觀察最近中心、重新計算、再分配","time":3,"kind":"kmeans","tag":"分群步驟 · K-means","steps":["指定 K 個初始中心","指派最近中心","更新為群內平均值"],"read":"K-means 是分群（Clustering）方法；K 表示指定的群數。每一輪先比較樣本到各中心的歐氏距離（Euclidean Distance），再將中心移到該群樣本的平均位置。不同初始化可能產生不同結果。執行完分群，還可以用 Inertia 與 Silhouette Score 評估效果。","example":"在園遊會地圖上，兩個集合點先亂放；每個攤位先比較自己離哪個集合點近，再重新移動中心。","check":"如果某個點到 C1 比到 C2 更近，它在這一輪應該分到哪一群？"},{"t":"Inertia：群內平方距離總和","s":"Inertia（群內平方距離總和）：每個點到所屬群中心的距離平方，再全部加總","time":3,"kind":"km_inertia","tag":"分群評估 · Inertia","steps":["K 越多通常 Inertia 越小","但不能只看它選群數"],"read":"Inertia 是 K-means 的群內平方距離總和（Within-Cluster Sum of Squares，WCSS；也稱 Sum of Squared Errors，SSE）。每個點先算到所屬中心的距離，再平方、加總。對同一份資料，K 增加時最佳 Inertia 不會變大；但若 K 等於樣本數，Inertia 可以變成 0，因此不能只挑最小值，也可以搭配轉折點法與 Silhouette Score 評估。","example":"園遊會要設集合點：每個攤位到自己那區集合點的路程越短，整體越集中。但如果每個攤位都放一個集合點，雖然距離是 0，分群就失去整理用途。","check":"把 K 從 2 改成 4，Inertia 變小，能直接認定 4 群比較合適嗎？"},{"t":"Silhouette：群內近、群間遠","s":"輪廓係數（Silhouette Score）：比較群內平均距離 a 與最近其他群平均距離 b","time":3,"kind":"km_silhouette","tag":"分群評估 · Silhouette Score","steps":["觀察群內平均距離 a","觀察最近其他群平均距離 b","接近 1 通常分群更清楚"],"read":"Silhouette Score 是輪廓係數（又稱輪廓分數）。對每個點，a 是它到同群其他點的平均距離；b 是它到最近一個「其他群」的平均距離。s=(b−a)/max(a,b)，介於 −1 到 1；越接近 1 通常群內更緊密、群間更分離；約 0 表示群界不清；小於 0 可能分錯群。單點群慣例記為 0，K=1 無法計算。","example":"小晴跟自己的讀書小組成員都很近，跟其他組卻很遠，輪廓係數通常較高；若她同時靠近兩組，分界就比較不明確。","check":"一個樣本若 a=1、b=5，算出的 s 大約是多少？這代表分群清不清楚？"},{"t":"把兩種分群指標一起看","s":"兩個指標一起看，避免誤以為群數越多越好","time":3,"kind":"km_metrics_compare","tag":"分群評估 · 綜合判讀","steps":["比較 K=2、3、4","Inertia 越小未必越好","輪廓係數與實際用途一起考慮"],"read":"Inertia 看「群內有多緊密」，數值越小代表群內平方距離越小，但群數 K 越多通常也越小。Silhouette Score 看「群內相近且群間分開」，範圍 −1 到 1，越高一般越清楚。圖中的數值是用同一組 8 點示範資料重新分群後計算；不同資料不一定都適合 2 群。","example":"校慶要安排 2、3、4 個集合點：4 個集合點總距離最短，但若群界混亂、每群太少攤位，實際管理未必比較方便。","check":"在這一組資料中，K=4 的 Inertia 比較小，但 K=2 的 Silhouette 較高；你會選幾群？理由是什麼？"},{"t":"第 2 節：3 題快速檢核","s":"三題直接作答；正確顯示完整觀念，答錯先看提示","time":5,"kind":"quiz2","tag":"課堂統整 · 12:00","steps":["二元分類與 Accuracy","正則化與係數","K-means 分群與評估"],"read":"第二節以邏輯斯迴歸預測及格與否，先學如何用 Accuracy 計算模型整體正確率；接著比較 L1、L2 正則化對權重的影響，再認識 PCA 降維、K-means 分群和分群評估。混淆矩陣與 Precision、Recall、F1 將留待下一次課程。","example":"學習平台要預測同學下一次是否及格。Accuracy 衡量的是「所有預測中，判對的比例」，及格、未及格兩類都要一起計算，不能只看預測及格的人。","check":"若模型把所有同學都判為及格，就一定有高 Accuracy 嗎？必須比對什麼？"}];

// Preserve training statistics and feature order across all examples.

 const notes=[

// Use a reproducible synthetic classification dataset for all thresholds.
// 使用固定的教學用機率資料，讓每個閾值計算結果都可驗算。
// English: All displayed classification metrics derive from the same labeled predictions.
// 中文：每一格混淆矩陣與各項指標都從同一組真實／預測標籤計算。
let classModel = 'balanced';
const CLASS_DEMOS={
 balanced:{name:'一般模型',pred:[1,1,1,0,1,0,0,0]},
 miss:{name:'容易漏判及格',pred:[1,1,0,0,0,0,0,0]},
 false:{name:'容易誤判及格',pred:[1,1,1,1,1,1,0,0]}
};
// English: Switch prediction examples without altering the actual labels.
// 中文：切換模型的預測結果，實際標籤不變。
function setClassModel(name){classModel=name;renderClassMetrics();}
// English: Derive TP, TN, FP, FN, accuracy, precision, recall and F1 from one source.
// 中文：直接由同一份標籤算出 TP、TN、FP、FN 及 Accuracy／Precision／Recall／F1。
function renderClassMetrics(){
 const root=document.querySelector('#cmRows');if(!root)return;
 const truth=[1,1,1,1,0,0,0,0],pred=CLASS_DEMOS[classModel].pred;
 const counts={tp:0,tn:0,fp:0,fn:0};
 const labels={tp:'TP',tn:'TN',fp:'FP',fn:'FN'};
 root.innerHTML=truth.map((real,i)=>{
  const guess=pred[i],key=real?(guess?'tp':'fn'):(guess?'fp':'tn');counts[key]++;
  return `<div class="cm-row"><span>${String.fromCharCode(65+i)}</span><span>${real?'及格':'未及格'}</span><span class="cm-guess ${guess?'pos':'neg'}">${guess?'及格':'未及格'}</span><span class="cm-result ${guess===real?'':'bad'}">${labels[key]}</span></div>`;
 }).join('');
  // English: Columns represent actual labels and rows represent model predictions.
  // 中文：矩陣橫向為實際答案、縱向為模型預測，四格皆包含英文全名。
  const matrixItems=[
    ['TP','tp','good','True Positive'],['FP','fp','bad','False Positive'],
    ['FN','fn','bad','False Negative'],['TN','tn','good','True Negative']
  ];
  const tile=([short,key,style,full])=>`<div class="cm-cell ${style}" aria-label="${full}，${counts[key]} 人"><b>${counts[key]}</b><strong>${short}</strong><small>${full}</small></div>`;
  document.querySelector('#cmMatrix').innerHTML=`<div class="cm-axis-top">實際值</div><div class="cm-axis-col cm-axis-col-pos">及格</div><div class="cm-axis-col cm-axis-col-neg">未及格</div><div class="cm-axis-y">模型預測</div><div class="cm-axis-row cm-axis-row-pos">及格</div><div class="cm-axis-row cm-axis-row-neg">未及格</div>${matrixItems.map(tile).join('')}`;
 const accuracy=(counts.tp+counts.tn)/truth.length;
 const precision=counts.tp+counts.fp?counts.tp/(counts.tp+counts.fp):0;
 const recall=counts.tp+counts.fn?counts.tp/(counts.tp+counts.fn):0;
 const f1=precision+recall?2*precision*recall/(precision+recall):0;
 document.querySelector('#cmNumbers').innerHTML=[['Accuracy',accuracy],['Precision',precision],['Recall',recall],['F1',f1]].map(([name,val])=>`<div>${name}<strong>${(val*100).toFixed(1)}%</strong></div>`).join('');
 document.querySelector('#cmExplain').textContent=`${CLASS_DEMOS[classModel].name}：TP=${counts.tp}、TN=${counts.tn}、FP=${counts.fp}、FN=${counts.fn}；共答對 ${counts.tp+counts.tn}/8 人。Accuracy 雖一樣，但 Precision 與 Recall 不一定相同。`;
 document.querySelectorAll('[data-cmmodel]').forEach(x=>x.classList.toggle('active',x.dataset.cmmodel===classModel));
}


// English: Correlation examples compare two distinct input features, never confuse feature X with target y.
// 中文：相關係數互動示範預設比較兩個不同的輸入特徵 X₁、X₂，不將標籤 y 誤當共線性對象。
let corrScenario=0,corrMethod=0,corrPicked=[1,6],corrPickNext=0;
// English: Track a teaching-only feature selection preview, without retraining or altering the measured data.
// 中文：追蹤特徵選擇的教學預覽，不假裝已重新訓練模型，也不更動相關係數資料。
let corrFeatureMode=0;
// English: Toggle the explanatory sidebar between coefficient choice and feature selection without adding slides.
// 中文：右側說明可切換「係數選用」與「特徵增減」，不占用額外頁面。
let corrInfoMode=0;
// English: The fourth example changes only student 4 from 25 to 100 practice problems.
// 中文：「一筆極端值」只修改第 4 位同學的練習題數 25→100，讓原值相關與排序相關都有可比較的變化。
const CORR_EXAMPLES=[
 {name:'近似直線',y:[5,12,17,25,31,36,42,49],msg:'讀書時數與練習題數近乎線性重複；多元迴歸中的 β₁、β₂ 可能不穩定。'},
 {name:'彎曲同升',y:[1,2,3,5,8,14,28,66],msg:'原始資料呈明顯彎曲，切換任何係數都保留曲線；下方名次對照仍是 1→1 到 8→8。'},
 {name:'反向直線',y:[51,43,39,30,26,19,11,3],msg:'強烈反向的線性關係同樣可能造成共線性，判讀時看 |Pearson r|。'},
 {name:'一筆極端',y:[5,12,17,100,31,36,42,49],msg:'只把第 4 筆由 25 題改成 100 題；它的題數名次從第 4 名變成第 8 名，名次順序也改變。',extreme:3,original:25},
 {name:'順序混亂',y:[24,6,39,12,48,18,36,30],msg:'兩欄沒有穩定的線性或單調關係，三種係數都較低；不代表一定毫無關係。'}
];
// English: Ordinal variables represent ordered categories; their numeric codes express order, not equal interval sizes.
// 中文：序位變數是有先後的等級；數字代碼只代表順序，不假設每級之間等距。
let corrOrdinalScenario=0;
// English: Each array contains eight students' paired ordinal survey responses on a five-level scale.
// 中文：每組陣列表示八位同學對兩個五級序位特徵的成對問卷回覆。
const CORR_ORDINAL_EXAMPLES=[
 {name:'等級同升',x:[1,2,2,3,3,4,4,5],y:[1,1,2,3,3,4,5,5],msg:'兩項投入等級大致一起升高，且有數位同學落在相同等級；排名的「同名次」會影響係數。'},
 {name:'等級反向',x:[1,2,2,3,3,4,4,5],y:[5,5,4,3,3,2,1,1],msg:'讀書投入程度越高，另一項投入反而越低；負的係數代表反向的排序關係。'},
 {name:'部分顛倒',x:[1,2,2,3,3,4,4,5],y:[1,4,2,5,1,4,3,5],msg:'大致同方向，但有些同學的等級先後相反；Spearman 與 Kendall 均會降低。'},
 {name:'很多同級',x:[1,2,2,3,3,4,4,5],y:[2,2,2,2,3,3,4,4],msg:'問卷等級只有五級，同樣等級（ties）很常見：Spearman 用平均名次、Kendall τ-b 會調整平手配對。'}
];
// English: Keep scenario controls synchronized with the measurement scale used by the selected method.
// 中文：切換係數時同步切換「數值情境」或「序位等級情境」的情境按鈕。
function corrSyncScenarios(){
 const el=document.querySelector('#corrCaseChoices');if(!el)return;
 const ordinal=corrMethod!==0;
 const key=ordinal?'ordinal':'numeric';
 if(el.dataset.scale!==key){
  const examples=ordinal?CORR_ORDINAL_EXAMPLES:CORR_EXAMPLES;
  el.innerHTML=examples.map((d,i)=>`<button data-corr-case="${i}" onclick="corrChooseScenario(${i})" aria-pressed="false">${d.name}</button>`).join('');
  el.dataset.scale=key;
 }
 el.classList.toggle('corr-case-ordinal',ordinal);
 const chosen=ordinal?corrOrdinalScenario:corrScenario;
 el.querySelectorAll('[data-corr-case]').forEach(button=>{const selected=Number(button.dataset.corrCase)===chosen;button.classList.toggle('selected',selected);button.setAttribute('aria-pressed',String(selected));});
}
// English: In ordinal examples, keep feature names aligned with the responses being compared.
// 中文：序位模式的特徵選擇示意改用問卷等級欄，不沿用數值型時數欄。
function corrFeatureLabels(){
 return corrMethod===0?['X₁ 讀書時數','X₂ 練習題數','X₃ 睡眠時數']:['X₁ 讀書投入程度','X₂ 練習投入程度','X₃ 睡眠程度'];
}
// English: Pearson is computed from the raw values and their centered products.
// 中文：Pearson 利用原始數值的共變動計算線性相關，沒有先對資料進行排序。
function corrPearson(x,y){
 const mx=x.reduce((a,b)=>a+b,0)/x.length,my=y.reduce((a,b)=>a+b,0)/y.length;
 let cross=0,xx=0,yy=0;
 for(let i=0;i<x.length;i++){const a=x[i]-mx,b=y[i]-my;cross+=a*b;xx+=a*a;yy+=b*b;}
 return xx*yy?cross/Math.sqrt(xx*yy):NaN;
}
// English: Spearman uses within-column ranks; tied observations receive their average rank.
// 中文：Spearman 分別對兩欄排序求名次，並非將 Excel 資料列重排；同值使用平均名次。
function corrRanks(values){
 const order=values.map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v),out=Array(values.length);
 for(let i=0;i<order.length;){let j=i+1;while(j<order.length&&order[j].v===order[i].v)j++;const rank=(i+j+1)/2;for(let k=i;k<j;k++)out[order[k].i]=rank;i=j;}
 return out;
}
// English: Kendall tau-b compares concordant and discordant pairs, adjusting for ties.
// 中文：Kendall τ-b 比較所有兩兩配對的方向是否一致，並正確調整同值情況。
function corrKendall(x,y){
 let same=0,opposite=0,tieX=0,tieY=0;
 for(let i=0;i<x.length;i++)for(let j=i+1;j<x.length;j++){
  const dx=Math.sign(x[i]-x[j]),dy=Math.sign(y[i]-y[j]);
  if(dx===0&&dy!==0)tieX++;else if(dx!==0&&dy===0)tieY++;
  else if(dx*dy>0)same++;else if(dx*dy<0)opposite++;
 }
 const denom=Math.sqrt((same+opposite+tieX)*(same+opposite+tieY));
 return {value:denom?(same-opposite)/denom:NaN,same,opposite,tieX,tieY};
}
// English: Selecting a new scenario updates points, ranks, Kendall pairs, and explanatory copy.
// 中文：切換資料情境必須同步更新點、名次、Kendall 配對與說明。
function corrChooseScenario(i){if(corrMethod===0)corrScenario=i;else corrOrdinalScenario=i;corrPicked=[1,6];corrPickNext=0;renderCorrelation();}
// English: Selecting a coefficient keeps the original scatterplot fixed and changes only the calculation overlay.
// 中文：切換係數時保持原始散點座標不變，只改變下方的計算對照與教學提示。
function corrChooseMethod(i){corrMethod=i;corrPicked=[1,6];corrPickNext=0;renderCorrelation();}
// English: Keep the same scatterplot and switch only the right-hand practical guide.
// 中文：保留目前散點情境與係數，僅切換右側教學指南內容。
function corrChooseInfoMode(i){corrInfoMode=i;renderCorrelation();}
// English: Select the next of two observations for Kendall pair comparison.
// 中文：Kendall 模式點選兩筆樣本，可直接看到順序一致或相反。
function corrChoosePoint(i){if(corrMethod!==2)return;corrPicked[corrPickNext]=i;corrPickNext=(corrPickNext+1)%2;renderCorrelation();}
// English: Draw the input-column experiment; these are column counts, not claimed predictive improvements.
// 中文：顯示保留、減少或新增輸入特徵後的欄位數，絕不虛構模型準確率。
function renderCorrFeaturePreview(){
 const root=document.querySelector('#corrFeaturePreview');if(!root)return;
 const labels=corrFeatureLabels(),columns=corrFeatureMode===1?labels.slice(0,1):corrFeatureMode===2?labels:labels.slice(0,2);
 root.innerHTML=`<span class="corr-feature-matrix">X（8 筆 × ${columns.length} 欄）</span>${columns.map((name,i)=>`<span class="corr-feature-chip ${i===2?'added':''}">${name}</span>`).join('')}`;

function makeKMInitial(){return {points:[{x:1.2,y:5.5},{x:1.8,y:4.8},{x:2.5,y:5.2},{x:2.9,y:4.3},{x:6.7,y:2.4},{x:7.5,y:3.1},{x:8.0,y:2.2},{x:8.4,y:3.8}],centroids:[{x:1.0,y:2.0},{x:3.0,y:3.0}],assignments:Array(8).fill(null),iter:1,idx:0,phase:'assign',selected:null,status:'從點 p1 開始，逐一比較到兩個群中心的距離。',oldCentroids:null,converged:false,lastMovement:null,changes:0};}
function resetKM(){stopKMAuto();kmState=makeKMInitial();renderKM();}
let kmTimer=null;
function stopKMAuto(){if(kmTimer!==null){clearInterval(kmTimer);kmTimer=null;}const btn=$('#kmAutoBtn');if(btn)btn.textContent='每秒自動執行';}
function toggleKMAuto(){
 if(kmTimer!==null){stopKMAuto();return;}
 if(!kmState||kmState.converged)return;
 const btn=$('#kmAutoBtn');if(btn)btn.textContent='暫停自動執行';
 kmTimer=setInterval(()=>{
  if(activeSlide().kind!=='kmeans'||!kmState||kmState.converged){stopKMAuto();return;}
  stepKM();
  if(kmState.converged)stopKMAuto();
 },1000);
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function stepKM(){
 if(!kmState||kmState.converged)return;
 const st=kmState;
 if(st.phase==='assign'){
   const index=st.idx,p=st.points[index],d=st.centroids.map(c=>dist(p,c));
   const best=d[0]<=d[1]?0:1;
   if(st.assignments[index]!==best)st.changes++;
   st.assignments[index]=best;
   st.selected={index,dists:d,best};
   st.status=`p${index+1} → 中心 C1：${d[0].toFixed(2)}；中心 C2：${d[1].toFixed(2)}。距離較短的是 C${best+1}，所以分到${best===0?'藍':'橘'}色群。`;
   st.idx++;
   if(st.idx===st.points.length)st.phase='update';
 } else if(st.phase==='update'){
   st.oldCentroids=st.centroids.map(c=>({...c}));
   const groups=[[],[]];st.points.forEach((pt,i)=>groups[st.assignments[i]].push(pt));
   const next=st.oldCentroids.map((old,k)=>groups[k].length?{x:groups[k].reduce((a,p)=>a+p.x,0)/groups[k].length,y:groups[k].reduce((a,p)=>a+p.y,0)/groups[k].length}:old);
   const movement=next.map((c,k)=>dist(c,st.centroids[k]));st.lastMovement=movement;
   st.centroids=next;st.selected=null;
   st.status=`中心更新：C1 移動 ${movement[0].toFixed(2)}；C2 移動 ${movement[1].toFixed(2)}。兩個位置都是各群樣本座標的平均值。`;
   // Convergence requires stable assignments and no meaningful centroid movement; do not falsely label a forced iteration cutoff as convergence.
   if(st.changes===0&&Math.max(...movement)<1e-8){st.converged=true;st.phase='done';st.status+=' 群別未再改變，中心也不再移動，已收斂。';}
   else{st.iter++;st.idx=0;st.changes=0;st.phase='assign';st.status+=` 接著進入第 ${st.iter} 輪。`;}
 }
 renderKM();if(st.converged)stopKMAuto();
}
function renderKM(){
 if(!kmState)return;

 const labelPlacement=[[-12,-17],[-12,25],[13,-16],[13,24],[-8,26],[11,-16],[11,26],[11,-16]];
 st.points.forEach((p,i)=>{
  const z=xy(p),g=st.assignments[i],color=g===0?'#5b9df1':g===1?'#f3b35b':'#bdcbdc';
  const [dx,dy]=labelPlacement[i],tx=z.x+dx,ty=z.y+dy;
  // Labels are intentionally staggered; leader segments connect labels and data points.
  if(Math.abs(dx)>11||Math.abs(dy)>18)svg+=`<path d="M${z.x} ${z.y} L${z.x+dx*.67} ${z.y+dy*.72}" stroke="#a2b3ca" stroke-width="1.2"/>`;
  svg+=`<circle cx="${z.x}" cy="${z.y}" r="8" stroke="#fff" stroke-width="2" fill="${color}"/><text x="${tx}" y="${ty}" font-size="16" font-weight="850" text-anchor="${dx<0?'end':'start'}" stroke="#fff" stroke-width="3" paint-order="stroke" fill="#38577e">p${i+1}</text>`;
 });
 st.centroids.forEach((c,k)=>{const v=xy(c),color=k===0?'#2c66bd':'#c9772b';if(st.oldCentroids&&st.selected===null){const old=xy(st.oldCentroids[k]);svg+=`<line x1="${old.x}" y1="${old.y}" x2="${v.x}" y2="${v.y}" stroke="${color}" stroke-width="2" stroke-dasharray="5 4"/>`;}svg+=`<path d="M${v.x-8} ${v.y-8}L${v.x+8} ${v.y+8}M${v.x+8} ${v.y-8}L${v.x-8} ${v.y+8}" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M${v.x-8} ${v.y-8}L${v.x+8} ${v.y+8}M${v.x+8} ${v.y-8}L${v.x-8} ${v.y+8}" stroke="${color}" stroke-width="4.2" stroke-linecap="round"/><text x="${v.x+11}" y="${v.y+7}" fill="${color}" font-size="17" font-weight="900">C${k+1}</text>`;});
 if(st.selected){const z=xy(st.points[st.selected.index]);svg+=`<circle cx="${z.x}" cy="${z.y}" r="13" stroke="#de9c38" stroke-width="2" fill="none"/>`;}
 $('#kmeansPlot').innerHTML=svgWrap(W,H,svg);
 $('#kmOut').textContent=st.converged?`已收斂 · ${st.iter} 輪`:`第 ${st.iter} 輪 · ${st.phase==='assign'?'逐點分配':'更新中心'}`;
 let distInfo='';
 if(st.selected){distInfo=`<div class="km-distance">點 p${st.selected.index+1}： <b>C1 ${st.selected.dists[0].toFixed(2)}</b> ／ <b>C2 ${st.selected.dists[1].toFixed(2)}</b><br>→ 最近的是 C${st.selected.best+1}</div>`;}
 $('#kmPanel').innerHTML=`<div class="mathcard"><p>每個點到中心的歐氏距離</p><math><msub><mi>d</mi><mi>k</mi></msub><mo>=</mo><msqrt><msup><mrow><mo>(</mo><mi>x</mi><mo>−</mo><msub><mi>μ</mi><mrow><mi>k</mi><mo>,</mo><mn>1</mn></mrow></msub><mo>)</mo></mrow><mn>2</mn></msup><mo>+</mo><msup><mrow><mo>(</mo><mi>y</mi><mo>−</mo><msub><mi>μ</mi><mrow><mi>k</mi><mo>,</mo><mn>2</mn></mrow></msub><mo>)</mo></mrow><mn>2</mn></msup></msqrt></math></div><div class="model-readout"><div><small>輪數</small><b>${st.iter}</b></div><div><small>待分配</small><b>${st.phase==='assign'?st.points.length-st.idx:0}</b></div><div><small>狀態</small><b>${st.converged?'收斂':st.phase==='update'?'更新':'分配'}</b></div></div>${distInfo}<div class="km-status">${st.status}</div>`;

function solvePenalty(lambda,kind){
 const q11=1.5,q22=1.25,q12=-.6,star=[1.55,.78];
 if(kind==='L2'){
  const a=q11+2*lambda,b=q12,d=q22+2*lambda, c1=q11*star[0]+q12*star[1],c2=q12*star[0]+q22*star[1],det=a*d-b*b;
  return [(c1*d-b*c2)/det,(a*c2-b*c1)/det];
 }
 let beta=[...star];
 for(let i=0;i<100;i++){
  const z1=star[0]-q12/q11*(beta[1]-star[1]);beta[0]=Math.sign(z1)*Math.max(0,Math.abs(z1)-lambda/q11);
  const z2=star[1]-q12/q22*(beta[0]-star[0]);beta[1]=Math.sign(z2)*Math.max(0,Math.abs(z2)-lambda/q22);
 }
 return beta;
}
function renderPenalty(){
 const input=$('#penaltyRange');if(!input)return;
 const lambda=Number(input.value)/50,hat=[1.55,.78],q11=1.5,q22=1.25,q12=-.6;
 $('#penaltyOut').textContent=lambda.toFixed(2);
 const opts=[{kind:'L1',color:'#3379d0',title:'L1：菱形限制'},{kind:'L2',color:'#3eae82',title:'L2：圓形限制'}];
 opts.forEach(({kind,color,title})=>{
  const b=solvePenalty(lambda,kind),r=kind==='L1'?Math.abs(b[0])+Math.abs(b[1]):Math.hypot(...b);
  const W=315,H=235,cx=116,cy=166,sc=54;
  const XY=([x,y])=>({x:cx+x*sc,y:cy-y*sc});
  const orig=XY(hat),p=XY(b);
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${title} 的係數幾何圖"><rect width="${W}" height="${H}" fill="#fff"/><text x="12" y="20" font-size="17" font-weight="850" fill="${color}">${title}</text><text x="${W-12}" y="20" text-anchor="end" font-size="12" fill="#68798b">${kind==='L1'?'λ(|β₁|+|β₂|)':'λ(β₁²+β₂²)'}</text><line x1="19" y1="${cy}" x2="${W-16}" y2="${cy}" stroke="#707d92" stroke-width="1.3"/><line x1="${cx}" y1="29" x2="${cx}" y2="${H-10}" stroke="#707d92" stroke-width="1.3"/><text x="${W-31}" y="${cy-8}" font-size="13" fill="#627087">β₁</text><text x="${cx+8}" y="40" font-size="13" fill="#627087">β₂</text>`;
  const theta=.5*Math.atan2(2*q12,q11-q22),l1=(q11+q22+Math.sqrt((q11-q22)**2+4*q12*q12))/2,l2=(q11+q22-Math.sqrt((q11-q22)**2+4*q12*q12))/2;
  [0.14,.35,.68,1.15,1.85].forEach((level,i)=>{
   let path='';for(let k=0;k<=90;k++){
    const a=k*Math.PI/45,ux=Math.cos(a)*Math.sqrt(2*level/l1),uy=Math.sin(a)*Math.sqrt(2*level/l2);
    const vx=hat[0]+ux*Math.cos(theta)-uy*Math.sin(theta),vy=hat[1]+ux*Math.sin(theta)+uy*Math.cos(theta);const t=XY([vx,vy]);path+=(k?' L':' M')+t.x.toFixed(2)+' '+t.y.toFixed(2);
   }
   svg+=`<path d="${path}" fill="none" stroke="#e9a19b" stroke-width="1.25" opacity="${.85-i*.1}"/>`;
  });
  if(kind==='L1'){
    const a=XY([0,r]),b1=XY([r,0]),c=XY([0,-r]),d=XY([-r,0]);
    svg+=`<polygon points="${a.x},${a.y} ${b1.x},${b1.y} ${c.x},${c.y} ${d.x},${d.y}" fill="${color}" fill-opacity=".2" stroke="${color}" stroke-width="2.8"/>`;
  }else{
    svg+=`<circle cx="${cx}" cy="${cy}" r="${r*sc}" fill="${color}" fill-opacity=".19" stroke="${color}" stroke-width="2.8"/>`;
  }
  svg+=`<circle cx="${orig.x}" cy="${orig.y}" r="5.2" fill="#26364b" stroke="#fff" stroke-width="1.5"/><text x="${orig.x+8}" y="${orig.y-7}" font-size="12" fill="#43546b">無懲罰最佳值</text>`;
  svg+=`<circle cx="${p.x}" cy="${p.y}" r="6.2" stroke="#fff" stroke-width="2" fill="${color}"/>`;
  svg+=`<text x="12" y="${H-27}" font-size="14" fill="#4a5d7b">β₁ = ${b[0].toFixed(2)}　β₂ = ${b[1].toFixed(2)}</text>`;
  svg+=`<text x="12" y="${H-11}" font-size="12" fill="#6d7f95">${kind==='L1'?'β₁ 或 β₂ 可剛好歸零':'通常兩個係數都逐漸縮小'}</text></svg>`;
  $('#penalty'+kind).innerHTML=svg;
 });
 const v1=solvePenalty(lambda,'L1');
 $('#penaltyExplain').textContent=v1.some(x=>Math.abs(x)<1e-8)?'L1 的最佳解已碰到座標軸：至少一個係數變成 0。橢圓中心是沒有正則化時的最佳解。':'紅色橢圓線表示相同的資料誤差。增大 λ，係數限制縮小；觀察 L1 菱形與 L2 圓形如何影響最終係數。';
}

// Each metric is computed directly from the illustrated true and predicted values.
let demoError = 8, rmseBigError = 16, r2Mode = 'good';
const metricTruth = [60,70,80,90];
function calcErrors(truth,preds){
  const errors=truth.map((v,i)=>v-preds[i]);
  const sumAbs=errors.reduce((a,e)=>a+Math.abs(e),0);
  const sumSquares=errors.reduce((a,e)=>a+e*e,0);
  return {errors, sumAbs, sumSquares, mae:sumAbs/errors.length, mse:sumSquares/errors.length, rmse:Math.sqrt(sumSquares/errors.length)};
}
function renderMAE(){
  const predicted=[62,68,82,90-demoError],res=calcErrors(metricTruth,predicted),holder=$('#maeRows');
  if(!holder)return;
  holder.innerHTML=metricTruth.map((v,i)=>{
    const abs=Math.abs(res.errors[i]),w=Math.min(100,abs/20*100);
    return `<div class="mae-row"><b>第${i+1}筆</b><span>${v}分</span><span>${predicted[i]}分</span><div class="mae-track"><div class="mae-fill" style="width:${w}%"></div></div><b>${abs}分</b></div>`;
  }).join('');
  $('#maeValue').textContent=res.mae.toFixed(2)+' 分';
  $('#maeMSEValue').textContent=res.mse.toFixed(2)+' 分²';
  $('#maeRMSEValue').textContent=res.rmse.toFixed(2)+' 分';
  $('#maeWorking').textContent=`(${res.errors.map(e=>Math.abs(e)).join(' + ')}) ÷ 4 = ${res.mae.toFixed(2)} 分`;
  $('#maeSliderLabel').textContent=demoError+' 分';
  const slider=$('#maeSlider'); if(slider) slider.value=demoError;
}
function setRMSE(v){rmseBigError=v;renderRMSE();}
function renderRMSE(){
  const predicted=[62,68,82,90-rmseBigError],res=calcErrors(metricTruth,predicted);
  const holder=$('#rmseRows'); if(!holder)return;
  holder.innerHTML=res.errors.map((e,i)=>{
    const sq=e*e,w=Math.max(1,sq/256*100);
    return `<div class="rmse-line"><strong>第${i+1}筆</strong><span>|e|=${Math.abs(e)}</span><span>e²=${sq}</span><div class="rmse-bar"><div style="width:${w}%"></div></div><strong>${sq} 分²</strong></div>`;
  }).join('');
  $('#rmseMSE').textContent=res.mse.toFixed(2)+' 分²';
  $('#rmseRoot').textContent=res.rmse.toFixed(2)+' 分';
  $('#rmseMAE').textContent=res.mae.toFixed(2)+' 分';
  $('#rmseWork').textContent=`MSE = (${res.errors.map(e=>e*e).join(' + ')}) ÷ 4 = ${res.mse.toFixed(2)}`;
  document.querySelectorAll('[data-rmse]').forEach(el=>el.classList.toggle('active',Number(el.dataset.rmse)===rmseBigError));
}
function setR2Mode(mode){r2Mode=mode;renderR2();}
function renderR2(){
  const preds={good:[62,68,82,88],mean:[75,75,75,75],bad:[95,95,95,95]}[r2Mode];
  const mean=metricTruth.reduce((a,b)=>a+b,0)/metricTruth.length;
  const sst=metricTruth.reduce((s,y)=>s+(y-mean)**2,0);
  const sse=metricTruth.reduce((s,y,i)=>s+(y-preds[i])**2,0);
  const r2=1-sse/sst;
  const W=400,H=180,L=40,R=18,T=18,B=30;
  const X=i=>L+20+i*(W-L-R-40)/3,Y=v=>T+(100-v)/(100-50)*(H-T-B);
  let svg=`<rect width="${W}" height="${H}" fill="#fff" rx="12"/>`;
  [50,60,70,80,90,100].forEach(v=>{
    const y=Y(v); svg+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#e7edf5" stroke-dasharray="3 4"/><text x="${L-7}" y="${y+3}" text-anchor="end" font-size="10" fill="#8091a6">${v}</text>`;
  });
  const baseY=Y(mean);
  svg+=`<line x1="${L}" y1="${baseY}" x2="${W-R}" y2="${baseY}" stroke="#d3a153" stroke-width="1.8" stroke-dasharray="7 5"/>`;
  const points=metricTruth.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
  svg+=`<polyline points="${points}" fill="none" stroke="#3f77c3" stroke-width="2.8"/>`;
  const predPoints=preds.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
  svg+=`<polyline points="${predPoints}" fill="none" stroke="#e78c48" stroke-width="2.5" stroke-dasharray="5 4"/>`;
  metricTruth.forEach((v,i)=>{
    const x=X(i),yp=Y(preds[i]),yt=Y(v);
    svg+=`<line x1="${x}" y1="${yp}" x2="${x}" y2="${yt}" stroke="#de9865" stroke-width="2" stroke-opacity=".75"/>`;
    svg+=`<circle cx="${x}" cy="${yt}" r="4.5" fill="#3f77c3" stroke="white" stroke-width="1.1"/>`;
    svg+=`<circle cx="${x}" cy="${yp}" r="4" fill="#e78c48" stroke="white" stroke-width="1"/>`;
    svg+=`<text x="${x}" y="${H-9}" text-anchor="middle" font-size="10.6" font-weight="750" fill="#60748c">學生${i+1}</text>`;
  });
  $('#r2Plot').innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" aria-label="真實成績藍線、模型預測橘線、平均數金虛線">${svg}</svg>`;
  $('#r2Score').textContent=r2.toFixed(3);
  $('#r2Score').classList.toggle('negative',r2<0);
  $('#r2SST').textContent=sst.toFixed(0);
  $('#r2SSE').textContent=sse.toFixed(0);
  const scale=Math.max(sst,sse,1);
  $('#r2SSTBar').style.width=100*sst/scale+'%';
  $('#r2SSEBar').style.width=100*sse/scale+'%';
  $('#r2Formula').textContent=`1 − ${sse.toFixed(0)} / ${sst.toFixed(0)} = ${r2.toFixed(3)}`;
  $('#r2Meaning').textContent=r2>0.95?'模型明顯優於只猜平均數':Math.abs(r2)<1e-9?'等於只猜平均數的表現':'比只猜平均數還差（R² 為負）';
  document.querySelectorAll('[data-r2]').forEach(el=>el.classList.toggle('active',el.dataset.r2===r2Mode));
}

 if(kind==='help')document.querySelector('#modal').innerHTML='<h2>播放操作</h2><p>←：上一張投影片；→：下一張投影片。<br>G：投影片總覽；F：全螢幕；H 或 ?：操作說明；Esc：關閉視窗。</p><p>同一頁的相近概念可以點右側切換標籤；滑桿、圖表、測驗與動畫都直接點選操作，不使用方向鍵。全部圖表及運算可以離線使用。</p><button onclick="closeModal()">關閉</button>';
 else document.querySelector('#modal').innerHTML=`<h2>投影片總覽（${slides.length} 頁）</h2><p>第 1 節：${slides.findIndex(d=>d.kind==='cover2')} 頁｜第 2 節：${slides.length-slides.findIndex(d=>d.kind==='cover2')} 頁。點選標題直接跳頁。</p><div class="slidegrid">${slides.map((slide,i)=>`<button class="${i===page?'curr':''}" onclick="jump(${i})">${String(i+1).padStart(2,'0')} · ${esc(slide.t)}</button>`).join('')}</div>`;
 document.querySelector('#overlay').classList.add('show');
}
// Keep arrow keys dedicated to slide navigation; other shortcuts are optional.
// 左右鍵專用於換頁；表單操作時保留原生鍵盤輸入。
addEventListener('keydown',event=>{
 const key=event.key;
 const editing=document.activeElement?.matches('input:not([type=range]),textarea,select');
 if(key==='Escape'){if(modalKind)closeModal();return;}
 if(editing)return;
 if(key==='ArrowRight'||key==='PageDown'){event.preventDefault();next();}
 else if(key==='ArrowLeft'||key==='PageUp'){event.preventDefault();prev();}
 else if(key.toLowerCase()==='f'){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.();}
 else if(key.toLowerCase()==='g')showModal('grid');
 else if(key.toLowerCase()==='h'||key==='?')showModal('help');
 else if(key==='Home')jump(0);
 else if(key==='End')jump(slides.length-1);
});
render();

</script>
</body>
</html>
